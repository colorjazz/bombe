<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absences Sport-études</title>
  <meta name="color-scheme" content="light">
  <style>
:root {
  --bleu: #1d4ed8; --bleu-pale: #dbeafe; --fond: #f4f6fb; --texte: #1f2937; --gris: #6b7280;
  --rouge: #b91c1c; --rouge-pale: #fee2e2; --orange: #b45309; --orange-pale: #fef3c7; --vert: #047857; --vert-pale: #d1fae5;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--fond); color: var(--texte); font-size: 16px; }
main { max-width: 1000px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.25rem; margin: 0; }
h2 { font-size: 1.2rem; }
h3 { margin: 0; font-size: 1.1rem; }
h4 { margin: 14px 0 6px; font-size: .95rem; color: var(--gris); text-transform: uppercase; letter-spacing: .03em; }

.barre { background: var(--bleu); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.barre .lien { color: #fff; }

.carte { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.carte.passee { opacity: .65; }
.etroite { max-width: 440px; margin: 24px auto; }
.titre-carte { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.details { color: var(--gris); font-size: .9rem; margin: 4px 0 0; }
.note { font-style: italic; color: var(--gris); font-size: .9rem; }
.vide { color: var(--gris); }
.aide { color: var(--gris); }
.centre { text-align: center; }

button { font: inherit; cursor: pointer; border-radius: 8px; border: 0; padding: 10px 16px; }
.principal { background: var(--bleu); color: #fff; font-weight: 600; }
.principal:hover { filter: brightness(1.1); }
.secondaire { background: #e5e7eb; color: var(--texte); }
.gros { padding: 14px 18px; font-size: 1.05rem; width: 100%; }
.lien { background: none; padding: 2px 4px; color: var(--bleu); text-decoration: underline; }
.danger { color: var(--rouge); }

.choix-role { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.choix-role button { background: #eef2ff; color: var(--texte); border: 2px solid transparent; }
.choix-role button.actif { border-color: var(--bleu); background: var(--bleu-pale); font-weight: 600; }

form label { display: block; margin-bottom: 12px; font-weight: 600; font-size: .95rem; }
form label small { display: block; font-weight: 400; color: var(--gris); margin-top: 2px; }
input:not([type=checkbox]), select, textarea {
  display: block; width: 100%; margin-top: 4px; padding: 10px; font: inherit; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff;
}
label.case, .case-fait { display: flex; align-items: center; gap: 8px; font-weight: 400; }
input[type=checkbox] { width: 20px; height: 20px; }
fieldset { border: 1px solid #e5e7eb; border-radius: 8px; margin: 0 0 12px; padding: 12px; }
fieldset[hidden] { display: none; }
legend { font-weight: 600; padding: 0 4px; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cases { max-height: 200px; overflow: auto; }
.cases .case { margin-bottom: 6px; }
.boutons { display: flex; justify-content: flex-end; gap: 8px; }
.erreur { color: var(--rouge); background: var(--rouge-pale); padding: 8px 12px; border-radius: 8px; }
.avert { color: var(--orange); background: var(--orange-pale); padding: 8px 12px; border-radius: 8px; }

dialog { border: 0; border-radius: 12px; padding: 20px; width: min(560px, 94vw); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(15,23,42,.5); }
dialog h2 { margin-top: 0; }

.pastille { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.pastille.rouge { background: var(--rouge-pale); color: var(--rouge); }
.pastille.orange { background: var(--orange-pale); color: var(--orange); }
.pastille.verte { background: var(--vert-pale); color: var(--vert); }
.pastille.bleue { background: var(--bleu-pale); color: var(--bleu); }
.pastille.grise { background: #e5e7eb; color: var(--gris); }

.entete-eleve { margin-bottom: 12px; }
.resume { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.chiffre { background: #fff; border-radius: 12px; padding: 12px 16px; flex: 1; min-width: 200px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chiffre strong { font-size: 1.6rem; color: var(--bleu); margin-right: 4px; }
.chiffre small { display: block; color: var(--gris); }

.taches { list-style: none; padding: 0; margin: 0; }
.taches li { display: flex; gap: 12px; align-items: flex-start; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; }
.taches li.fait { background: #f9fafb; }
.taches li.fait .travail { text-decoration: line-through; color: var(--gris); }
.taches p { margin: 4px 0; }
.case-fait { flex-direction: column; font-size: .75rem; color: var(--gris); gap: 2px; min-width: 56px; }
.examen { background: var(--orange-pale); color: #7c2d12; padding: 6px 8px; border-radius: 6px; }
.travail { white-space: pre-wrap; }

.onglets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.onglets button { background: #fff; color: var(--texte); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.onglets button.actif { background: var(--bleu); color: #fff; }
.filtres { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filtres input[type=search] { flex: 2; min-width: 200px; margin: 0; }
.filtres select { flex: 1; min-width: 150px; width: auto; margin: 0; }

table.eleves { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .95rem; }
table.eleves th { text-align: left; color: var(--gris); font-weight: 600; font-size: .85rem; border-bottom: 2px solid #e5e7eb; padding: 6px; }
table.eleves td { border-bottom: 1px solid #eef0f3; padding: 8px 6px; vertical-align: top; }
ul.mini { margin: 0; padding-left: 0; list-style: none; }
ul.mini li { margin-bottom: 6px; }
ul.mini .examen { margin-top: 2px; font-size: .9rem; }

/* Téléphone : les tableaux deviennent des fiches */
@media (max-width: 640px) {
  .deux { grid-template-columns: 1fr; }
  table.eleves thead { display: none; }
  table.eleves tr { display: block; border-bottom: 2px solid #e5e7eb; padding: 6px 0; }
  table.eleves td { display: block; border: 0; padding: 3px 0; }
  table.eleves td[data-titre]::before { content: attr(data-titre) " : "; color: var(--gris); font-size: .85rem; }
}

@media print {
  .barre, .onglets, .filtres, .resume, button { display: none !important; }
  body { background: #fff; }
  .carte { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
}

/* Calendrier */
.cal-titre { margin: 0 8px; min-width: 180px; text-align: center; text-transform: capitalize; }
.calendrier { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-entete { text-align: center; font-weight: 600; color: var(--gris); font-size: .85rem; padding: 4px 0; }
.cal-jour { min-height: 74px; padding: 6px; border-radius: 8px; background: #f8fafc; border: 1px solid #e5e7eb;
  display: flex; flex-direction: column; align-items: flex-start; text-align: left; color: inherit; }
.cal-jour.fds { background: #f1f5f9; }
.cal-jour.auj { outline: 3px solid var(--orange); }
.cal-jour.choisi { outline: 3px solid var(--texte); }
.cal-num { font-size: .85rem; font-weight: 600; }
.cal-nb { font-size: 1.4rem; font-weight: 700; line-height: 1.1; margin-top: auto; }
.cal-lib { font-size: .7rem; }
@media (max-width: 640px) {
  .cal-jour { min-height: 52px; padding: 3px; }
  .cal-lib { display: none; }
  .cal-nb { font-size: 1.1rem; }
  .cal-titre { min-width: 0; font-size: 1rem; }
}

.demo-bandeau { background: #fef3c7; color: #78350f; padding: 8px 16px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.demo-bandeau code { background: #fff; padding: 1px 6px; border-radius: 4px; }
.demo-acces { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.demo-bandeau button { background: #fff; border: 1px solid #f59e0b; padding: 6px 10px; font-size: .85rem; min-height: 36px; }
button[onclick="print()"] { display: none; }
</style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>
<body>
<div class="demo-bandeau">
  <strong>Démonstration</strong> — données fictives, gardées seulement dans votre navigateur.
  Code élève : <code>sport</code> · code enseignant : <code>prof</code>.
  <span class="demo-acces">Essayer :
    <button data-demo="eleve">Léa (élève, NIP 1234)</button>
    <button data-demo="enseignant">M. Gagnon (enseignant)</button>
    <button data-demo="reset">Remettre les données d'origine</button></span>
</div>
  <header class="barre">
    <h1>🏆 Absences Sport-études</h1>
    <div id="qui" hidden>
      <span id="qui-nom"></span>
      <button id="deconnexion" class="lien">Se déconnecter</button>
    </div>
  </header>

  <main id="app"><p class="centre">Chargement…</p></main>

  <!-- Écran de connexion -->
  <template id="tpl-connexion">
    <section class="carte etroite">
      <h2>Bienvenue</h2>
      <div class="choix-role">
        <button data-role="eleve" class="gros actif">🎒 Je suis élève</button>
        <button data-role="enseignant" class="gros">📚 Je suis enseignant·e</button>
      </div>
      <form id="form-connexion">
        <label>Prénom et nom <input name="nom" autocomplete="name" required placeholder="ex. Léa Tremblay"></label>
        <label class="eleve">Groupe <input name="groupe" placeholder="ex. 3-02" autocomplete="off"></label>
        <label class="eleve">NIP (4 chiffres)
          <input name="nip" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="current-password">
          <small>Première fois ? Choisis ton NIP maintenant et retiens-le.</small>
        </label>
        <label class="enseignant" hidden>Matière <input name="matiere" placeholder="ex. Mathématiques"></label>
        <label>Code de l'école <input name="code" required autocomplete="off">
          <small class="eleve">Donné par ton enseignant.</small></label>
        <button class="principal" type="submit">Entrer</button>
        <p class="erreur" hidden></p>
      </form>
    </section>
  </template>

  <!-- Boîte : déclarer une absence (élève) -->
  <dialog id="dlg-absence">
    <form id="form-absence" method="dialog">
      <h2>Déclarer une absence</h2>
      <label>Tournoi
        <select name="tournoi_id" required></select>
      </label>
      <fieldset id="nouveau-tournoi">
        <label>Nom du tournoi <input name="nom" placeholder="ex. Championnat provincial de volleyball"></label>
        <div class="deux">
          <label>Sport <input name="sport" placeholder="ex. Volleyball"></label>
          <label>Ville <input name="lieu" placeholder="ex. Sherbrooke"></label>
        </div>
        <div class="deux">
          <label>Premier jour d'absence <input type="date" name="debut"></label>
          <label>Dernier jour d'absence <input type="date" name="fin"></label>
        </div>
      </fieldset>
      <p id="avert-preavis" class="avert" hidden></p>
      <label>Message pour les enseignants (facultatif)
        <textarea name="note" rows="2" placeholder="ex. Je pars jeudi midi, je serai là le matin."></textarea></label>
      <p class="erreur" hidden></p>
      <div class="boutons">
        <button type="button" class="secondaire" data-fermer>Annuler</button>
        <button type="submit" class="principal">Déclarer</button>
      </div>
    </form>
  </dialog>

  <!-- Boîte : demander du travail / une reprise d'examen (enseignant) -->
  <dialog id="dlg-tache">
    <form id="form-tache" method="dialog">
      <h2>Travail pour <span id="tache-tournoi"></span></h2>
      <fieldset>
        <legend>Élèves concernés</legend>
        <div id="tache-eleves" class="cases"></div>
      </fieldset>
      <label>Travail à faire
        <textarea name="travail" rows="3" placeholder="ex. Lire le chapitre 4 et faire les exercices p. 112 à 115."></textarea></label>
      <label>À remettre le <input type="date" name="remise"></label>
      <label class="case"><input type="checkbox" name="examen"> Il y a un examen à reprendre</label>
      <fieldset id="bloc-examen" hidden>
        <label>Examen <input name="examen_nom" placeholder="ex. Examen de l'étape 2 — fonctions"></label>
        <div class="deux">
          <label>Date de reprise <input type="date" name="reprise_date"></label>
          <label>Heure et local <input name="reprise_info" placeholder="ex. 8 h 15, local B-204"></label>
        </div>
      </fieldset>
      <p class="erreur" hidden></p>
      <div class="boutons">
        <button type="button" class="secondaire" data-fermer>Annuler</button>
        <button type="submit" class="principal">Envoyer aux élèves</button>
      </div>
    </form>
  </dialog>

  <script>
// Démonstration : remplace le serveur par des données fictives gardées dans le navigateur (localStorage).
// Mêmes routes que src/worker.js, pour montrer l'application sans la mettre en ligne.
(() => {
  const CLE = 'absences-demo-v1';
  const JOUR = 864e5;
  const iso = (dec) => new Date(Date.now() + dec * JOUR).toLocaleDateString('en-CA');
  const cle = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

  function donneesInitiales() {
    const noms = [['Léa Tremblay', '3-02'], ['Noah Côté', '3-01'], ['Emma Gagnon', '3-02'], ['William Roy', '4-01'],
      ['Florence Bouchard', '4-01'], ['Thomas Gauthier', '3-01'], ['Alice Morin', '4-02'], ['Jacob Lavoie', '4-02'],
      ['Zoé Fortin', '3-02'], ['Liam Pelletier', '4-01'], ['Rosalie Bélanger', '3-01'], ['Nathan Lévesque', '4-02']];
    const d = { n: 100, eleves: [], enseignants: [], tournois: [], absences: [], taches: [], sessions: {} };
    noms.forEach(([nom, groupe], i) => d.eleves.push({ id: i + 1, nom, nom_cle: cle(nom), groupe, nip: i === 0 ? '1234' : null }));
    d.enseignants.push({ id: 1, nom: 'Marc Gagnon', nom_cle: cle('Marc Gagnon'), matiere: 'Mathématiques' },
      { id: 2, nom: 'Julie Roy', nom_cle: cle('Julie Roy'), matiere: 'Français' });
    const T = [
      ['Coupe Québec de volleyball', 'Volleyball', 'Sherbrooke', 4, 6, [1, 2, 3, 9, 11]],
      ['Omnium de tennis junior', 'Tennis', 'Gatineau', 17, 17, [1, 7]],
      ['Championnat provincial de natation', 'Natation', 'Montréal', 10, 12, [4, 5, 10]],
      ['Tournoi de hockey Pee-Wee', 'Hockey', 'Québec', -2, 0, [6, 8, 12]],
      ['Classique de soccer d\'hiver', 'Soccer', 'Laval', 24, 26, [2, 6, 8, 11]],
      ['Invitation de gymnastique', 'Gymnastique', 'Trois-Rivières', -12, -11, [7, 9]],
    ];
    T.forEach(([nom, sport, lieu, a, b, el], i) => {
      d.tournois.push({ id: i + 1, nom, sport, lieu, debut: iso(a), fin: iso(b) });
      el.forEach((e, k) => d.absences.push({ id: d.n++, eleve_id: e, tournoi_id: i + 1, note: e === 1 && i === 0 ? 'Je pars jeudi midi.' : '',
        created_at: Date.now() + (a - [12, 9, 5, 2, 1, 15][(e + k) % 6]) * JOUR }));
    });
    const abs = (t, e) => d.absences.find((x) => x.tournoi_id === t && x.eleve_id === e).id;
    const tache = (a, ens, o) => d.taches.push({ id: d.n++, absence_id: a, enseignant_id: ens, travail: '', remise: null, examen: 0,
      examen_nom: '', reprise_date: null, reprise_info: '', fait_at: null, created_at: Date.now(), ...o });
    [1, 2, 3, 9, 11].forEach((e) => {
      tache(abs(1, e), 1, { travail: 'Exercices p. 112 à 115 (fonctions affines).', remise: iso(9), examen: 1, examen_nom: 'Examen de l\'étape 2', reprise_date: iso(10), reprise_info: '8 h 15, local B-204' });
      tache(abs(1, e), 2, { travail: 'Lire le chapitre 5 du roman et répondre aux questions 1 à 8.', remise: iso(8), fait_at: e === 3 ? Date.now() : null });
    });
    [6, 8, 12].forEach((e) => tache(abs(4, e), 2, { travail: 'Rédiger le plan du texte argumentatif.', remise: iso(3) }));
    return d;
  }

  let db;
  try { db = JSON.parse(localStorage.getItem(CLE)); } catch { db = null; }
  if (!db) db = donneesInitiales();
  const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(db)); } catch { /* navigateur sans stockage */ } };
  window.reinitialiserDemo = () => { db = donneesInitiales(); sauver(); };

  class E extends Error { constructor(s, m) { super(m); this.s = s; } }
  const auj = () => iso(0);
  const ens = (id) => db.enseignants.find((e) => e.id === id);
  const avecProf = (t) => ({ ...t, enseignant: ens(t.enseignant_id).nom, matiere: ens(t.enseignant_id).matiere });
  const tournoi = (id) => db.tournois.find((t) => t.id === id);

  function qui(h, role) {
    const s = db.sessions[(h.Authorization || '').replace('Bearer ', '')];
    if (!s) throw new E(401, 'Connectez-vous.');
    if (role && s.role !== role) throw new E(403, 'Action réservée.');
    const p = (s.role === 'eleve' ? db.eleves : db.enseignants).find((x) => x.id === s.id);
    return { role: s.role, ...p };
  }
  const profil = (p) => ({ role: p.role, id: p.id, nom: p.nom, groupe: p.groupe, matiere: p.matiere });

  const routes = {
    'POST login': (h, b) => {
      const role = b.role === 'enseignant' ? 'enseignant' : 'eleve';
      if ((b.code || '').trim().toLowerCase() !== (role === 'eleve' ? 'sport' : 'prof')) throw new E(403, role === 'eleve' ? 'Code de l\'école incorrect (démo : sport).' : 'Code enseignant incorrect (démo : prof).');
      const nom = (b.nom || '').trim().replace(/\s+/g, ' ');
      if (!nom.includes(' ')) throw new E(400, 'Prénom et nom, s’il vous plaît.');
      let p;
      if (role === 'eleve') {
        if (!/^\d{4}$/.test(b.nip || '')) throw new E(400, 'Le NIP doit avoir 4 chiffres.');
        p = db.eleves.find((e) => e.nom_cle === cle(nom));
        if (!p) { if (!b.groupe) throw new E(400, 'Indique ton groupe.'); p = { id: db.n++, nom, nom_cle: cle(nom), groupe: b.groupe.trim(), nip: null }; db.eleves.push(p); }
        if (!p.nip) p.nip = b.nip; else if (p.nip !== b.nip) throw new E(403, 'NIP incorrect.');
        if (b.groupe) p.groupe = b.groupe.trim();
      } else {
        p = db.enseignants.find((e) => e.nom_cle === cle(nom));
        if (!p) { p = { id: db.n++, nom, nom_cle: cle(nom), matiere: (b.matiere || '').trim() }; db.enseignants.push(p); }
        else if (b.matiere) p.matiere = b.matiere.trim();
      }
      const token = 'demo' + Math.random().toString(36).slice(2);
      db.sessions[token] = { role, id: p.id };
      return { token, moi: profil({ role, ...p }) };
    },
    'POST logout': () => ({ ok: true }),
    'GET moi': (h) => ({ moi: profil(qui(h)) }),
    'GET tournois': (h) => { qui(h); return { tournois: db.tournois.filter((t) => t.fin >= auj()).sort((a, b) => a.debut.localeCompare(b.debut))
      .map((t) => ({ ...t, nb: db.absences.filter((a) => a.tournoi_id === t.id).length })) }; },
    'POST absences': (h, b) => {
      const el = qui(h, 'eleve');
      let tid = Number(b.tournoi_id) || null;
      if (!tid) {
        const n = b.nouveau || {};
        if (!n.nom) throw new E(400, 'Indique le nom du tournoi.');
        if (!n.debut) throw new E(400, 'Date invalide : premier jour d’absence.');
        const fin = n.fin && n.fin >= n.debut ? n.fin : n.debut;
        const pareil = db.tournois.find((t) => t.debut === n.debut && cle(t.nom) === cle(n.nom));
        tid = pareil ? pareil.id : db.n++;
        if (!pareil) db.tournois.push({ id: tid, nom: n.nom.trim(), sport: (n.sport || '').trim(), lieu: (n.lieu || '').trim(), debut: n.debut, fin });
      }
      if (db.absences.some((a) => a.eleve_id === el.id && a.tournoi_id === tid)) throw new E(409, 'Tu as déjà déclaré ce tournoi.');
      db.absences.push({ id: db.n++, eleve_id: el.id, tournoi_id: tid, note: (b.note || '').trim(), created_at: Date.now() });
      return { ok: true };
    },
    'DELETE absences': (h, b, id) => {
      qui(h);
      const a = db.absences.find((x) => x.id === id);
      db.absences = db.absences.filter((x) => x.id !== id);
      db.taches = db.taches.filter((t) => t.absence_id !== id);
      if (a && !db.absences.some((x) => x.tournoi_id === a.tournoi_id)) db.tournois = db.tournois.filter((t) => t.id !== a.tournoi_id);
      return { ok: true };
    },
    'GET mes-absences': (h) => {
      const el = qui(h, 'eleve');
      return { absences: db.absences.filter((a) => a.eleve_id === el.id).map((a) => {
        const t = tournoi(a.tournoi_id);
        return { id: a.id, note: a.note, created_at: a.created_at, tournoi_id: t.id, tournoi: t.nom, sport: t.sport, lieu: t.lieu, debut: t.debut, fin: t.fin,
          taches: db.taches.filter((x) => x.absence_id === a.id).map(avecProf) };
      }).sort((a, b) => b.debut.localeCompare(a.debut)) };
    },
    'POST taches-fait': (h, b, id) => { qui(h, 'eleve'); const t = db.taches.find((x) => x.id === id); t.fait_at = t.fait_at ? null : Date.now(); return { ok: true }; },
    'GET tableau': (h, b, id, q) => {
      qui(h, 'enseignant');
      const depuis = iso(q.get('passes') === '1' ? -365 : -14);
      const tournois = db.tournois.filter((t) => t.fin >= depuis).sort((a, b) => a.debut.localeCompare(b.debut)).map((t) => ({
        ...t,
        eleves: db.absences.filter((a) => a.tournoi_id === t.id).map((a) => {
          const e = db.eleves.find((x) => x.id === a.eleve_id);
          return { absence_id: a.id, eleve_id: e.id, nom: e.nom, groupe: e.groupe, note: a.note, declare_le: a.created_at,
            preavis: Math.floor((Date.parse(t.debut + 'T00:00:00') - a.created_at) / JOUR),
            taches: db.taches.filter((x) => x.absence_id === a.id).map(avecProf) };
        }).sort((x, y) => (x.groupe + x.nom).localeCompare(y.groupe + y.nom)),
      })).filter((t) => t.eleves.length);
      const reprises = db.taches.filter((t) => t.examen && t.reprise_date >= auj()).map((t) => {
        const a = db.absences.find((x) => x.id === t.absence_id), e = db.eleves.find((x) => x.id === a.eleve_id);
        return { ...avecProf(t), eleve: e.nom, groupe: e.groupe, tournoi: tournoi(a.tournoi_id).nom };
      }).sort((x, y) => x.reprise_date.localeCompare(y.reprise_date));
      return { tournois, reprises };
    },
    'POST taches': (h, b) => {
      const p = qui(h, 'enseignant');
      const ids = (b.absence_ids || []).map(Number);
      if (!ids.length) throw new E(400, 'Choisissez au moins un élève.');
      if (!(b.travail || '').trim() && !b.examen) throw new E(400, 'Décrivez le travail à faire ou cochez « Examen à reprendre ».');
      ids.forEach((aid) => db.taches.push({ id: db.n++, absence_id: aid, enseignant_id: p.id, travail: (b.travail || '').trim(), remise: b.remise || null,
        examen: b.examen ? 1 : 0, examen_nom: b.examen ? b.examen_nom || '' : '', reprise_date: b.examen ? b.reprise_date || null : null,
        reprise_info: b.examen ? b.reprise_info || '' : '', fait_at: null, created_at: Date.now() }));
      return { ok: true, nb: ids.length };
    },
    'DELETE taches': (h, b, id) => { qui(h, 'enseignant'); db.taches = db.taches.filter((t) => t.id !== id); return { ok: true }; },
    'GET eleves': (h) => { qui(h, 'enseignant'); return { eleves: db.eleves.map((e) => ({ ...e, nb: db.absences.filter((a) => a.eleve_id === e.id).length }))
      .sort((a, b) => (a.groupe + a.nom).localeCompare(b.groupe + b.nom)) }; },
    'POST eleves-nip': (h, b, id) => { qui(h, 'enseignant'); db.eleves.find((e) => e.id === id).nip = null; return { ok: true }; },
  };

  window.fetch = async (url, opt = {}) => {
    const u = new URL(url, 'http://demo');
    const parts = u.pathname.replace('/api/', '').split('/');
    let nom = parts[0], id = null;
    if (parts[1]) { id = Number(parts[1]); if (parts[2] === 'fait') nom = 'taches-fait'; if (parts[2] === 'effacer-nip') nom = 'eleves-nip'; }
    const route = routes[`${opt.method || 'GET'} ${nom}`];
    let status = 200, data;
    try {
      if (!route) throw new E(404, 'Introuvable');
      data = route(opt.headers || {}, opt.body ? JSON.parse(opt.body) : {}, id, u.searchParams);
      sauver();
    } catch (err) { status = err.s || 500; data = { error: err.message }; }
    return new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  };

  // Le cadre des artefacts refuse confirm() : la démo répond « oui » à chaque confirmation.
  window.confirm = () => true;
})();

</script>
<script>
// Absences Sport-études — application (navigateur). Aucune dépendance.
'use strict';

const PREAVIS_MIN = 7; // jours d'avance demandés aux élèves
const $ = (sel, el = document) => el.querySelector(sel);
const app = $('#app');
let moi = null;

// ---------- Outils ----------

async function api(chemin, options = {}) {
  const token = localStorage.getItem('jeton');
  const rep = await fetch('/api/' + chemin, {
    method: options.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await rep.json().catch(() => ({ error: 'Le serveur ne répond pas. Réessayez.' }));
  if (rep.status === 401 && chemin !== 'login') { deconnecter(); throw new Error(data.error); }
  if (!rep.ok) throw new Error(data.error || 'Erreur');
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function auj() { return new Date().toLocaleDateString('en-CA'); }

function joursAvant(iso) {
  return Math.round((new Date(iso + 'T12:00') - new Date(auj() + 'T12:00')) / 864e5);
}

function dateFr(iso, avecJour = true) {
  if (!iso) return '';
  return new Date(iso + 'T12:00').toLocaleDateString('fr-CA', { weekday: avecJour ? 'short' : undefined, day: 'numeric', month: 'long' });
}

function periode(debut, fin) {
  return debut === fin ? dateFr(debut) : `du ${dateFr(debut)} au ${dateFr(fin)}`;
}

// « Dans 3 jours », « En cours », « Terminé »
function etat(debut, fin) {
  const d = joursAvant(debut), f = joursAvant(fin);
  if (f < 0) return '<span class="pastille grise">Terminé</span>';
  if (d <= 0) return '<span class="pastille rouge">En cours</span>';
  if (d === 1) return '<span class="pastille orange">Demain</span>';
  return `<span class="pastille ${d <= PREAVIS_MIN ? 'orange' : 'bleue'}">Dans ${d} jours</span>`;
}

function preavisPastille(jours) {
  if (jours < 0) return '<span class="pastille rouge" title="Déclaré après le départ">Averti en retard</span>';
  const cls = jours < 3 ? 'rouge' : jours < PREAVIS_MIN ? 'orange' : 'verte';
  return `<span class="pastille ${cls}" title="Délai entre la déclaration et le départ">Averti ${jours} j avant</span>`;
}

function montrerErreur(form, msg) {
  const p = $('.erreur', form);
  p.textContent = msg || '';
  p.hidden = !msg;
}

function ouvrir(dlg) {
  montrerErreur(dlg, '');
  dlg.showModal();
}

document.querySelectorAll('dialog').forEach((d) => {
  d.addEventListener('click', (e) => { if (e.target.matches('[data-fermer]')) d.close(); });
});

function deconnecter() {
  api('logout', { method: 'POST' }).catch(() => {});
  localStorage.removeItem('jeton');
  moi = null;
  demarrer();
}
$('#deconnexion').onclick = deconnecter;

// ---------- Connexion ----------

function ecranConnexion() {
  $('#qui').hidden = true;
  app.replaceChildren($('#tpl-connexion').content.cloneNode(true));
  const form = $('#form-connexion');
  let role = localStorage.getItem('role') || 'eleve';
  const choisir = (r) => {
    role = r;
    app.querySelectorAll('[data-role]').forEach((b) => b.classList.toggle('actif', b.dataset.role === r));
    form.querySelectorAll('.eleve').forEach((el) => { el.hidden = r !== 'eleve'; });
    form.querySelectorAll('.enseignant').forEach((el) => { el.hidden = r !== 'enseignant'; });
    form.nip.required = r === 'eleve';
  };
  app.querySelectorAll('[data-role]').forEach((b) => { b.onclick = () => choisir(b.dataset.role); });
  choisir(role);
  form.nom.value = localStorage.getItem('nom') || '';
  form.groupe.value = localStorage.getItem('groupe') || '';
  form.onsubmit = async (e) => {
    e.preventDefault();
    montrerErreur(form, '');
    const f = Object.fromEntries(new FormData(form));
    try {
      const r = await api('login', { method: 'POST', body: { role, ...f } });
      localStorage.setItem('jeton', r.token);
      localStorage.setItem('role', role);
      localStorage.setItem('nom', f.nom);
      if (f.groupe) localStorage.setItem('groupe', f.groupe);
      moi = r.moi;
      afficher();
    } catch (err) { montrerErreur(form, err.message); }
  };
}

// ---------- Élève ----------

async function ecranEleve() {
  const { absences } = await api('mes-absences');
  const aFaire = absences.flatMap((a) => a.taches).filter((t) => !t.fait_at);
  const reprises = absences.flatMap((a) => a.taches)
    .filter((t) => t.examen && t.reprise_date && joursAvant(t.reprise_date) >= 0)
    .sort((a, b) => a.reprise_date.localeCompare(b.reprise_date));

  app.innerHTML = `
    <section class="entete-eleve">
      <button id="btn-declarer" class="principal gros">＋ Déclarer une absence pour un tournoi</button>
      <p class="aide">Déclare ton absence <strong>au moins ${PREAVIS_MIN} jours avant</strong> ton départ :
        tes enseignants pourront préparer ton travail.</p>
    </section>
    <section class="resume">
      <div class="chiffre"><strong>${aFaire.length}</strong> travail${aFaire.length > 1 ? 'x' : ''} à faire</div>
      <div class="chiffre"><strong>${reprises.length}</strong> reprise${reprises.length > 1 ? 's' : ''} d'examen à venir
        ${reprises[0] ? `<small>Prochaine : ${dateFr(reprises[0].reprise_date)} (${esc(reprises[0].matiere || reprises[0].enseignant)})</small>` : ''}</div>
    </section>
    <h2>Mes absences</h2>
    ${absences.length ? '' : '<p class="vide">Aucune absence déclarée pour l\'instant.</p>'}
    <div id="liste"></div>`;

  const liste = $('#liste');
  for (const a of absences) {
    const carte = document.createElement('article');
    carte.className = 'carte' + (joursAvant(a.fin) < 0 && a.taches.every((t) => t.fait_at) ? ' passee' : '');
    carte.innerHTML = `
      <div class="titre-carte">
        <div>
          <h3>${esc(a.tournoi)}</h3>
          <p class="details">${periode(a.debut, a.fin)}${a.sport ? ' · ' + esc(a.sport) : ''}${a.lieu ? ' · ' + esc(a.lieu) : ''}</p>
        </div>
        ${etat(a.debut, a.fin)}
      </div>
      ${a.note ? `<p class="note">« ${esc(a.note)} »</p>` : ''}
      <h4>Travail demandé par mes enseignants</h4>
      ${a.taches.length ? '' : '<p class="vide">Rien pour l\'instant. Reviens voir avant ton départ.</p>'}
      <ul class="taches">${a.taches.map(tacheEleve).join('')}</ul>
      ${a.taches.length ? '' : '<button class="lien danger" data-annuler>Annuler cette absence</button>'}`;
    carte.querySelectorAll('[data-fait]').forEach((cb) => {
      cb.onchange = async () => { await api(`taches/${cb.dataset.fait}/fait`, { method: 'POST' }); ecranEleve(); };
    });
    const annuler = $('[data-annuler]', carte);
    if (annuler) annuler.onclick = async () => {
      if (!confirm(`Annuler ton absence pour « ${a.tournoi} » ?`)) return;
      await api('absences/' + a.id, { method: 'DELETE' });
      ecranEleve();
    };
    liste.append(carte);
  }
  $('#btn-declarer').onclick = ouvrirDeclaration;
}

function tacheEleve(t) {
  return `<li class="${t.fait_at ? 'fait' : ''}">
    <label class="case-fait"><input type="checkbox" data-fait="${t.id}" ${t.fait_at ? 'checked' : ''}> Terminé</label>
    <div>
      <strong>${esc(t.matiere || 'Cours')}</strong> <span class="details">— ${esc(t.enseignant)}</span>
      ${t.travail ? `<p class="travail">${esc(t.travail)}</p>` : ''}
      ${t.remise ? `<p>📅 À remettre le <strong>${dateFr(t.remise)}</strong></p>` : ''}
      ${t.examen ? `<p class="examen">📝 Examen à reprendre${t.examen_nom ? ' : ' + esc(t.examen_nom) : ''}<br>
        ${t.reprise_date ? `<strong>${dateFr(t.reprise_date)}</strong>` : 'Date à confirmer avec ton enseignant'}${t.reprise_info ? ' · ' + esc(t.reprise_info) : ''}</p>` : ''}
    </div>
  </li>`;
}

async function ouvrirDeclaration() {
  const dlg = $('#dlg-absence');
  const form = $('#form-absence');
  form.reset();
  const { tournois } = await api('tournois');
  form.tournoi_id.innerHTML = '<option value="">— Choisis ton tournoi —</option>'
    + tournois.map((t) => `<option value="${t.id}" data-debut="${t.debut}">${esc(t.nom)} (${periode(t.debut, t.fin)}${t.lieu ? ', ' + esc(t.lieu) : ''})</option>`).join('')
    + '<option value="nouveau">➕ Mon tournoi n\'est pas dans la liste</option>';
  if (!tournois.length) form.tournoi_id.value = 'nouveau';
  const maj = () => {
    const nouveau = form.tournoi_id.value === 'nouveau';
    $('#nouveau-tournoi').hidden = !nouveau;
    ['nom', 'debut'].forEach((n) => { form[n].required = nouveau; });
    const debut = nouveau ? form.debut.value : form.tournoi_id.selectedOptions[0]?.dataset.debut;
    const avert = $('#avert-preavis');
    const j = debut ? joursAvant(debut) : null;
    avert.hidden = j === null || j >= PREAVIS_MIN;
    if (!avert.hidden) avert.textContent = j < 0
      ? 'Ce tournoi a déjà commencé. Déclare-le quand même, puis parle à tes enseignants dès ton retour.'
      : `Attention : ton départ est dans ${j} jour${j > 1 ? 's' : ''}. Préviens aussi tes enseignants en personne.`;
    if (nouveau && form.debut.value && (!form.fin.value || form.fin.value < form.debut.value)) form.fin.value = form.debut.value;
  };
  form.tournoi_id.onchange = maj;
  form.debut.onchange = maj;
  maj();
  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    const corps = { note: f.note };
    if (f.tournoi_id === 'nouveau') corps.nouveau = { nom: f.nom, sport: f.sport, lieu: f.lieu, debut: f.debut, fin: f.fin };
    else corps.tournoi_id = Number(f.tournoi_id);
    try {
      await api('absences', { method: 'POST', body: corps });
      dlg.close();
      ecranEleve();
    } catch (err) { montrerErreur(form, err.message); }
  };
  ouvrir(dlg);
}

// ---------- Enseignant ----------

const vue = { onglet: 'tournois', groupe: '', recherche: '', passes: false, mois: auj().slice(0, 7), jour: null };

async function ecranEnseignant() {
  const [tab, liste] = await Promise.all([api('tableau' + (vue.passes || vue.onglet === 'calendrier' ? '?passes=1' : '')), vue.onglet === 'eleves' ? api('eleves') : null]);
  const groupes = [...new Set(tab.tournois.flatMap((t) => t.eleves.map((e) => e.groupe)).filter(Boolean))].sort();
  const enCours = tab.tournois.filter((t) => joursAvant(t.debut) <= 0 && joursAvant(t.fin) >= 0);
  const nbAbsentsAuj = new Set(enCours.flatMap((t) => t.eleves.map((e) => e.eleve_id))).size;

  app.innerHTML = `
    <nav class="onglets">
      <button data-onglet="tournois">🏆 Tournois et absents</button>
      <button data-onglet="calendrier">📅 Calendrier</button>
      <button data-onglet="reprises">📝 Reprises d'examen (${tab.reprises.length})</button>
      <button data-onglet="eleves">👥 Élèves</button>
    </nav>
    <section class="resume">
      <div class="chiffre"><strong>${nbAbsentsAuj}</strong> élève${nbAbsentsAuj > 1 ? 's' : ''} absent${nbAbsentsAuj > 1 ? 's' : ''} aujourd'hui</div>
      <div class="chiffre"><strong>${tab.tournois.filter((t) => joursAvant(t.debut) > 0 && joursAvant(t.debut) <= 14).length}</strong> tournoi(s) dans les 14 prochains jours</div>
    </section>
    <div id="contenu"></div>`;
  app.querySelectorAll('[data-onglet]').forEach((b) => {
    b.classList.toggle('actif', b.dataset.onglet === vue.onglet);
    b.onclick = () => { vue.onglet = b.dataset.onglet; ecranEnseignant(); };
  });
  const contenu = $('#contenu');
  if (vue.onglet === 'tournois') ongletTournois(contenu, tab.tournois, groupes);
  else if (vue.onglet === 'calendrier') ongletCalendrier(contenu, tab.tournois, groupes);
  else if (vue.onglet === 'reprises') ongletReprises(contenu, tab.reprises);
  else ongletEleves(contenu, liste.eleves);
}

function ongletTournois(contenu, tournois, groupes) {
  contenu.innerHTML = `
    <div class="filtres">
      <input type="search" id="recherche" placeholder="Chercher un élève ou un tournoi" value="${esc(vue.recherche)}">
      <select id="filtre-groupe"><option value="">Tous les groupes</option>
        ${groupes.map((g) => `<option ${g === vue.groupe ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
      <label class="case"><input type="checkbox" id="passes" ${vue.passes ? 'checked' : ''}> Voir les tournois passés</label>
      <button class="secondaire" onclick="print()">🖨️ Imprimer</button>
    </div>
    <div id="tournois"></div>`;
  $('#recherche').oninput = (e) => { vue.recherche = e.target.value; dessiner(); };
  $('#filtre-groupe').onchange = (e) => { vue.groupe = e.target.value; dessiner(); };
  $('#passes').onchange = (e) => { vue.passes = e.target.checked; ecranEnseignant(); };

  function dessiner() {
    const zone = $('#tournois');
    zone.replaceChildren();
    const q = vue.recherche.trim().toLowerCase();
    let n = 0;
    for (const t of tournois) {
      const eleves = t.eleves.filter((e) => (!vue.groupe || e.groupe === vue.groupe)
        && (!q || e.nom.toLowerCase().includes(q) || t.nom.toLowerCase().includes(q) || (t.sport || '').toLowerCase().includes(q)));
      if (!eleves.length) continue;
      n++;
      const carte = document.createElement('article');
      carte.className = 'carte' + (joursAvant(t.fin) < 0 ? ' passee' : '');
      carte.innerHTML = `
        <div class="titre-carte">
          <div>
            <h3>${esc(t.nom)}</h3>
            <p class="details">${periode(t.debut, t.fin)}${t.sport ? ' · ' + esc(t.sport) : ''}${t.lieu ? ' · ' + esc(t.lieu) : ''}
              · <strong>${eleves.length} élève${eleves.length > 1 ? 's' : ''}</strong></p>
          </div>
          ${etat(t.debut, t.fin)}
        </div>
        <table class="eleves">
          <thead><tr><th>Élève</th><th>Groupe</th><th>Déclaré</th><th>Travail demandé</th></tr></thead>
          <tbody>${eleves.map((e) => `
            <tr>
              <td data-titre="Élève"><strong>${esc(e.nom)}</strong>${e.note ? `<div class="note">« ${esc(e.note)} »</div>` : ''}</td>
              <td data-titre="Groupe">${esc(e.groupe)}</td>
              <td data-titre="Déclaré">${preavisPastille(e.preavis)}</td>
              <td data-titre="Travail">${e.taches.length ? `<ul class="mini">${e.taches.map((ta) => tacheProf(ta)).join('')}</ul>` : '<span class="vide">Aucun</span>'}</td>
            </tr>`).join('')}</tbody>
        </table>
        <button class="principal" data-ajouter>＋ Demander du travail / une reprise d'examen</button>`;
      $('[data-ajouter]', carte).onclick = () => ouvrirTache(t, eleves);
      carte.querySelectorAll('[data-retirer]').forEach((b) => {
        b.onclick = async () => {
          if (!confirm('Retirer ce travail ? L\'élève ne le verra plus.')) return;
          await api('taches/' + b.dataset.retirer, { method: 'DELETE' });
          ecranEnseignant();
        };
      });
      zone.append(carte);
    }
    if (!n) zone.innerHTML = '<p class="vide">Aucune absence déclarée' + (q || vue.groupe ? ' pour ce filtre.' : ' pour les tournois à venir.') + '</p>';
  }
  dessiner();
}

function tacheProf(t) {
  const mien = t.enseignant_id === moi.id;
  return `<li>
    <strong>${esc(t.matiere || t.enseignant)}</strong>${t.fait_at ? ' <span class="pastille verte">Terminé</span>' : ''}
    ${mien ? `<button class="lien danger" data-retirer="${t.id}" title="Retirer">✕</button>` : ''}
    ${t.travail ? `<div>${esc(t.travail)}</div>` : ''}
    ${t.remise ? `<div class="details">À remettre le ${dateFr(t.remise)}</div>` : ''}
    ${t.examen ? `<div class="examen">📝 Reprise${t.examen_nom ? ' « ' + esc(t.examen_nom) + ' »' : ''} : ${t.reprise_date ? dateFr(t.reprise_date) : 'date à fixer'}${t.reprise_info ? ', ' + esc(t.reprise_info) : ''}</div>` : ''}
  </li>`;
}

function ouvrirTache(t, eleves) {
  const dlg = $('#dlg-tache');
  const form = $('#form-tache');
  form.reset();
  $('#tache-tournoi').textContent = t.nom;
  $('#tache-eleves').innerHTML = eleves.map((e) =>
    `<label class="case"><input type="checkbox" name="absence" value="${e.absence_id}" checked> ${esc(e.nom)} <span class="details">${esc(e.groupe)}</span></label>`).join('');
  const bloc = $('#bloc-examen');
  bloc.hidden = true;
  form.examen.onchange = () => { bloc.hidden = !form.examen.checked; };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    const ids = [...form.querySelectorAll('[name=absence]:checked')].map((c) => Number(c.value));
    try {
      await api('taches', { method: 'POST', body: { ...f, examen: form.examen.checked, absence_ids: ids } });
      dlg.close();
      ecranEnseignant();
    } catch (err) { montrerErreur(form, err.message); }
  };
  ouvrir(dlg);
}

// Calendrier du mois : nombre d'élèves absents chaque jour ; un clic sur un jour montre qui et pour quel tournoi.
function ongletCalendrier(contenu, tournois, groupes) {
  const [an, mo] = vue.mois.split('-').map(Number);
  const iso = (d) => d.toLocaleDateString('en-CA');
  const premier = new Date(an, mo - 1, 1, 12);
  const nbJours = new Date(an, mo, 0).getDate();
  const decalage = (premier.getDay() + 6) % 7; // semaine commençant le lundi
  // Absences de chaque jour du mois
  const parJour = {};
  for (let j = 1; j <= nbJours; j++) parJour[iso(new Date(an, mo - 1, j, 12))] = [];
  for (const t of tournois) {
    for (const e of t.eleves) {
      if (vue.groupe && e.groupe !== vue.groupe) continue;
      for (const jour in parJour) if (jour >= t.debut && jour <= t.fin) parJour[jour].push({ ...e, tournoi: t });
    }
  }
  const max = Math.max(1, ...Object.values(parJour).map((l) => l.length));
  const total = new Set(Object.values(parJour).flat().map((e) => e.eleve_id)).size;
  const titre = premier.toLocaleDateString('fr-CA', { month: 'long', year: 'numeric' });
  if (vue.jour && !parJour[vue.jour]) vue.jour = null;

  let cases = '<div class="cal-vide"></div>'.repeat(decalage);
  for (const [jour, liste] of Object.entries(parJour)) {
    const d = new Date(jour + 'T12:00');
    const fds = d.getDay() === 0 || d.getDay() === 6;
    const n = new Set(liste.map((e) => e.eleve_id)).size;
    const intens = n ? 0.15 + 0.75 * (n / max) : 0;
    cases += `<button class="cal-jour${fds ? ' fds' : ''}${jour === auj() ? ' auj' : ''}${jour === vue.jour ? ' choisi' : ''}"
      data-jour="${jour}" style="${n ? `background: rgba(29,78,216,${intens.toFixed(2)}); color: ${intens > 0.5 ? '#fff' : 'inherit'}` : ''}"
      title="${n} élève${n > 1 ? 's' : ''} absent${n > 1 ? 's' : ''}">
      <span class="cal-num">${d.getDate()}</span>
      ${n ? `<span class="cal-nb">${n}</span><span class="cal-lib">absent${n > 1 ? 's' : ''}</span>` : ''}
    </button>`;
  }

  contenu.innerHTML = `
    <div class="filtres">
      <button class="secondaire" id="mois-prec" aria-label="Mois précédent">◀</button>
      <h2 class="cal-titre">${titre}</h2>
      <button class="secondaire" id="mois-suiv" aria-label="Mois suivant">▶</button>
      <button class="secondaire" id="mois-auj">Aujourd'hui</button>
      <select id="filtre-groupe"><option value="">Tous les groupes</option>
        ${groupes.map((g) => `<option ${g === vue.groupe ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
    </div>
    <p class="aide">${total} élève${total > 1 ? 's' : ''} absent${total > 1 ? 's' : ''} au moins un jour ce mois-ci.
      Plus la case est foncée, plus il y a d'absents. Cliquez sur un jour pour voir qui.</p>
    <article class="carte">
      <div class="calendrier">
        ${['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((j) => `<div class="cal-entete">${j}</div>`).join('')}
        ${cases}
      </div>
    </article>
    <div id="detail-jour"></div>`;

  const changerMois = (delta) => {
    const d = new Date(an, mo - 1 + delta, 1, 12);
    vue.mois = iso(d).slice(0, 7);
    vue.jour = null;
    ongletCalendrier(contenu, tournois, groupes);
  };
  $('#mois-prec').onclick = () => changerMois(-1);
  $('#mois-suiv').onclick = () => changerMois(1);
  $('#mois-auj').onclick = () => { vue.mois = auj().slice(0, 7); vue.jour = auj(); ongletCalendrier(contenu, tournois, groupes); };
  $('#filtre-groupe').onchange = (e) => { vue.groupe = e.target.value; ongletCalendrier(contenu, tournois, groupes); };
  contenu.querySelectorAll('[data-jour]').forEach((b) => {
    b.onclick = () => { vue.jour = b.dataset.jour; ongletCalendrier(contenu, tournois, groupes); };
  });

  if (vue.jour) {
    const liste = parJour[vue.jour];
    const groupesT = new Map();
    for (const e of liste) {
      if (!groupesT.has(e.tournoi.id)) groupesT.set(e.tournoi.id, { t: e.tournoi, eleves: [] });
      groupesT.get(e.tournoi.id).eleves.push(e);
    }
    $('#detail-jour').innerHTML = `
      <article class="carte">
        <h3>${dateFr(vue.jour)} : ${liste.length ? `${new Set(liste.map((e) => e.eleve_id)).size} élève(s) absent(s)` : 'aucun absent'}</h3>
        ${[...groupesT.values()].map(({ t, eleves }) => `
          <h4>${esc(t.nom)} <span class="details">${t.sport ? esc(t.sport) + ' · ' : ''}${t.lieu ? esc(t.lieu) + ' · ' : ''}${periode(t.debut, t.fin)}</span></h4>
          <ul class="mini">${eleves.map((e) => `<li><strong>${esc(e.nom)}</strong> <span class="details">${esc(e.groupe)}</span></li>`).join('')}</ul>`).join('')}
      </article>`;
  }
}

function ongletReprises(contenu, reprises) {
  contenu.innerHTML = reprises.length ? `
    <article class="carte">
      <table class="eleves">
        <thead><tr><th>Date</th><th>Élève</th><th>Matière</th><th>Examen</th><th>Heure / local</th><th>Tournoi</th></tr></thead>
        <tbody>${reprises.map((r) => `<tr>
          <td data-titre="Date"><strong>${dateFr(r.reprise_date)}</strong></td>
          <td data-titre="Élève">${esc(r.eleve)} <span class="details">${esc(r.groupe)}</span></td>
          <td data-titre="Matière">${esc(r.matiere || '')} <span class="details">${esc(r.enseignant)}</span></td>
          <td data-titre="Examen">${esc(r.examen_nom)}</td>
          <td data-titre="Heure / local">${esc(r.reprise_info)}</td>
          <td data-titre="Tournoi">${esc(r.tournoi)}</td></tr>`).join('')}</tbody>
      </table>
    </article>` : '<p class="vide">Aucune reprise d\'examen prévue.</p>';
}

function ongletEleves(contenu, eleves) {
  contenu.innerHTML = `
    <p class="aide">Un élève a oublié son NIP ? Effacez-le : il en choisira un nouveau à sa prochaine connexion.</p>
    <article class="carte">
      <table class="eleves">
        <thead><tr><th>Élève</th><th>Groupe</th><th>Absences</th><th></th></tr></thead>
        <tbody>${eleves.map((e) => `<tr>
          <td data-titre="Élève">${esc(e.nom)}</td><td data-titre="Groupe">${esc(e.groupe)}</td><td data-titre="Absences">${e.nb}</td>
          <td><button class="lien" data-nip="${e.id}" data-nom="${esc(e.nom)}">Effacer le NIP</button></td></tr>`).join('')}</tbody>
      </table>
    </article>`;
  contenu.querySelectorAll('[data-nip]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm(`Effacer le NIP de ${b.dataset.nom} ?`)) return;
      await api(`eleves/${b.dataset.nip}/effacer-nip`, { method: 'POST' });
      b.replaceWith('NIP effacé ✔');
    };
  });
}

// ---------- Démarrage ----------

function afficher() {
  $('#qui').hidden = false;
  $('#qui-nom').textContent = moi.nom + (moi.role === 'eleve' ? (moi.groupe ? ' · ' + moi.groupe : '') : (moi.matiere ? ' · ' + moi.matiere : ''));
  (moi.role === 'eleve' ? ecranEleve() : ecranEnseignant()).catch((err) => {
    app.innerHTML = `<p class="erreur">${esc(err.message)}</p>`;
  });
}

async function demarrer() {
  if (!localStorage.getItem('jeton')) return ecranConnexion();
  try {
    moi = (await api('moi')).moi;
    afficher();
  } catch { ecranConnexion(); }
}

demarrer();

});
