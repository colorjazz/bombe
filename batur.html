<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archives Vivantes — Dossier Batur</title>
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Three.js (build UMD, expose global THREE) -->
  <script crossorigin src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <!-- Babel for JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind (play CDN, utility classes used below) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // ICÔNES (SVG inline — remplace lucide-react,
    // qui nécessite un bundler et n'a pas de build UMD)
    // ==========================================
    const Icon = ({ path, size = 18, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        {path}
      </svg>
    );
    const SendIcon = (props) => <Icon {...props} path={<><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></>} />;
    const UserIcon = (props) => <Icon {...props} path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />;
    const BotIcon = (props) => <Icon {...props} path={<><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></>} />;
    const AlertCircleIcon = (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />;
    const SettingsIcon = (props) => <Icon {...props} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />;

    // ==========================================
    // CONFIGURATION DE L'IA (À MODIFIER SI BESOIN)
    // ==========================================
    // Vous pouvez coller votre clé API ici pour ne pas avoir à la saisir dans l'interface
    const DEFAULT_API_KEY = "";

    const PERSONA_NAME = "Batur (Dossier #94)";

    const SYSTEM_INSTRUCTION = `
OBJECTIF PÉDAGOGIQUE :
Tu es un personnage dans un jeu d'enquête interactif. L'élève doit découvrir ton pays d'origine (qui n'existe plus aujourd'hui), les raisons de ta fuite et ton parcours d'intégration au Québec en te posant des questions.

RÈGLES STRICTES :
1. NE RÉVÈLE JAMAIS ton nom complet, ta ville d'origine (Sarajevo) ou ton pays (Yougoslavie/Bosnie) dans tes premières réponses.
2. Si on te demande "D'où viens-tu ?", donne des indices : un pays d'Europe qui n'existe plus aujourd'hui sur les cartes, ou bien une ville multiculturelle magnifique qui a organisé les Jeux Olympiques d'hiver.
3. Révèle tes informations étape par étape. Récompense la curiosité :
    - Si on te parle de ton arrivée au Canada ou du paysage, raconte l'anecdote où tu as ostiné (contredit) ton professeur de français qui disait qu'il y a plus d'un million de lacs au Québec. Tu avais même appelé le ministère pour vérifier !
    - Si on te demande comment tu as appris la langue, explique que tu es devenu chauffeur de taxi en l'an 2000 pour pratiquer le français avec les clients.
4. Ton ton est chaleureux, très bavard, profondément reconnaissant envers le Québec et nostalgique de ta jeunesse. Tu utilises parfois des expressions comme "c'est sûr et certain" ou "tu sais". Tu es très fier d'habiter à Gatineau (anciennement Hull).

TON HISTOIRE SECRÈTE :
Je suis né à Sarajevo, dans un pays qui s'appelait la Yougoslavie. J'avais une belle vie, j'avais mon appartement très jeune, et j'ai même travaillé pour l'organisation des Jeux Olympiques d'hiver de 1984.

En 1992, la guerre a éclaté. Comme je viens d'une famille mixte au niveau des religions, je refusais de combattre mes voisins. La ville était bombardée chaque jour. J'ai fui avec ma femme et mes trois enfants (dont un bébé de 7 mois) par le dernier train vers Belgrade.
Après avoir été refusés par l'Australie, nous avons été acceptés par le Canada comme réfugiés pris en charge par l'État. Nous sommes arrivés en août 1994 à Hull (Gatineau). J'ai été choqué par l'accueil incroyable : on nous a mis dans un motel avec piscine, on ne nous demandait pas de rembourser l'aide sociale, et en 4 jours on avait un appartement meublé !

Le plus dur a été la langue. Je ne parlais pas un mot de français ou d'anglais. Mes enfants étaient comme des éponges, mais pour moi c'était dur. En 2000, je suis devenu chauffeur de taxi pour améliorer mon français et comprendre la culture d'ici. Mon plus grand moment de fierté a été d'attendre l'annuaire téléphonique de Bell pour y voir mon nom imprimé, car dans mon pays d'origine, avoir le téléphone demandait beaucoup de relations !

Aujourd'hui, je travaille pour "Accueil Parrainage Outaouais" pour aider les nouveaux arrivants. Je me sens profondément Québécois, nos valeurs sont proches. Mon pays d'origine me manque (la Yougoslavie), mais il n'existe plus que dans ma mémoire. Je ne retournerai jamais y vivre, mes enfants ont grandi ici, ils sont parfaitement trilingues, et le Québec est leur vraie maison.
`;

    // ==========================================
    // COMPOSANT: Avatar 3D (Three.js)
    // ==========================================
    const ThreeAvatar = ({ isSpeaking }) => {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);

      useEffect(() => {
        const width = mountRef.current.clientWidth;
        const height = mountRef.current.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#f8fafc');
        sceneRef.current = scene;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 1.5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        mountRef.current.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0xe2e8f0, 0.4);
        fillLight.position.set(-5, 0, 5);
        scene.add(fillLight);

        const avatarGroup = new THREE.Group();

        const skinMaterial = new THREE.MeshStandardMaterial({
          color: 0x8b5a2b,
          roughness: 0.5,
          metalness: 0.1
        });
        const clothesMaterial = new THREE.MeshStandardMaterial({
          color: 0x334155,
          roughness: 0.8
        });

        const headGeo = new THREE.SphereGeometry(1, 32, 32);
        const head = new THREE.Mesh(headGeo, skinMaterial);
        head.position.y = 1.8;
        avatarGroup.add(head);

        const neckGeo = new THREE.CylinderGeometry(0.3, 0.4, 0.8, 32);
        const neck = new THREE.Mesh(neckGeo, skinMaterial);
        neck.position.y = 1;
        avatarGroup.add(neck);

        const bodyGeo = new THREE.CapsuleGeometry(1.2, 1.5, 16, 32);
        const body = new THREE.Mesh(bodyGeo, clothesMaterial);
        body.rotation.z = Math.PI / 2;
        body.position.y = 0.2;
        avatarGroup.add(body);

        scene.add(avatarGroup);

        let animationFrameId;
        const clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();

          avatarGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.05;

          head.rotation.y = Math.sin(elapsedTime * 0.5) * 0.1;
          head.rotation.z = Math.sin(elapsedTime * 0.3) * 0.05;

          if (isSpeaking) {
            head.rotation.x = Math.sin(elapsedTime * 8) * 0.05;
          } else {
            head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, 0, 0.1);
          }

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!mountRef.current) return;
          const newWidth = mountRef.current.clientWidth;
          const newHeight = mountRef.current.clientHeight;
          camera.aspect = newWidth / newHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(newWidth, newHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (mountRef.current && renderer.domElement) {
            mountRef.current.removeChild(renderer.domElement);
          }
          renderer.dispose();
          headGeo.dispose();
          neckGeo.dispose();
          bodyGeo.dispose();
          skinMaterial.dispose();
          clothesMaterial.dispose();
        };
      }, [isSpeaking]);

      return <div ref={mountRef} className="w-full h-full bg-slate-50 rounded-2xl shadow-inner border border-slate-200 overflow-hidden" />;
    };

    // ==========================================
    // COMPOSANT PRINCIPAL: Application React
    // ==========================================
    const App = () => {
      const [apiKey, setApiKey] = useState(DEFAULT_API_KEY);
      const [showConfig, setShowConfig] = useState(!DEFAULT_API_KEY);
      const [messages, setMessages] = useState([
        { role: 'model', text: "Bonjour... Assieds-toi, prends ton temps. Je suis prêt à te raconter l'histoire de ma vie et d'où je viens, mais c'est à toi de me poser les bonnes questions pour le découvrir." }
      ]);
      const [input, setInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };
      useEffect(scrollToBottom, [messages, isLoading]);

      const callGemini = async (userText) => {
        if (!apiKey) {
          alert("Veuillez entrer votre clé API Google Gemini dans la configuration.");
          setShowConfig(true);
          return;
        }

        setIsLoading(true);
        setIsSpeaking(true);

        const history = messages.map(msg => ({
          role: msg.role === 'user' ? 'user' : 'model',
          parts: [{ text: msg.text }]
        }));
        history.push({ role: 'user', parts: [{ text: userText }] });

        const payload = {
          contents: history,
          systemInstruction: {
            parts: [{ text: SYSTEM_INSTRUCTION }]
          }
        };

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`Erreur HTTP: ${response.status}`);
          }

          const data = await response.json();
          const aiResponseText = data.candidates[0].content.parts[0].text;

          setMessages(prev => [...prev, { role: 'model', text: aiResponseText }]);
        } catch (error) {
          console.error("Erreur API:", error);
          setMessages(prev => [...prev, { role: 'model', text: "Désolé, j'ai perdu le fil de mes pensées... (Erreur de connexion API. Vérifiez votre clé)." }]);
        } finally {
          setIsLoading(false);
          setIsSpeaking(false);
        }
      };

      const handleSend = (e) => {
        e.preventDefault();
        if (!input.trim()) return;

        const userText = input.trim();
        setMessages(prev => [...prev, { role: 'user', text: userText }]);
        setInput('');

        callGemini(userText);
      };

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col md:flex-row text-slate-800 font-sans">

          <div className="w-full md:w-1/3 lg:w-2/5 p-4 flex flex-col gap-4 bg-white shadow-xl z-10 relative">
            <div className="flex justify-between items-center pb-4 border-b border-slate-100">
              <div>
                <h1 className="text-xl font-bold text-slate-800">Archives Vivantes</h1>
                <p className="text-sm text-slate-500">Simulation d'enquête historique</p>
              </div>
              <button
                onClick={() => setShowConfig(!showConfig)}
                className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-full transition-colors"
                title="Configuration"
              >
                <SettingsIcon size={20} />
              </button>
            </div>

            <div className="flex-1 relative min-h-[300px] max-h-[500px]">
              <ThreeAvatar isSpeaking={isSpeaking} />

              <div className="absolute bottom-4 left-4 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-xl shadow-lg border border-slate-100 flex items-center gap-3">
                <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <div>
                  <p className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Interlocuteur</p>
                  <p className="font-medium text-slate-700">{PERSONA_NAME}</p>
                </div>
              </div>
            </div>

            {showConfig && (
              <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl mt-auto">
                <h3 className="text-sm font-semibold text-blue-800 flex items-center gap-2 mb-2">
                  <AlertCircleIcon size={16} /> Configuration API
                </h3>
                <p className="text-xs text-blue-600 mb-3">
                  Pour faire fonctionner l'IA, entrez votre clé API Google Gemini.
                </p>
                <input
                  type="password"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  placeholder="Clé API (AIzaSy...)"
                  className="w-full text-sm px-3 py-2 border border-blue-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                />
              </div>
            )}
          </div>

          <div className="w-full md:w-2/3 lg:w-3/5 flex flex-col h-screen max-h-screen relative bg-slate-50">

            <div className="bg-white px-6 py-4 border-b border-slate-200 shadow-sm flex items-center gap-3">
              <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
                <BotIcon size={20} />
              </div>
              <div>
                <h2 className="font-semibold text-slate-800">Conversation en cours</h2>
                <p className="text-xs text-slate-500">Posez des questions pour découvrir son histoire.</p>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-6 space-y-6">
              {messages.map((msg, index) => (
                <div
                  key={index}
                  className={`flex flex-col max-w-[85%] ${msg.role === 'user' ? 'ml-auto items-end' : 'mr-auto items-start'}`}
                >
                  <div className={`flex items-center gap-2 mb-1 px-1 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                    <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] text-white ${msg.role === 'user' ? 'bg-slate-800' : 'bg-blue-500'}`}>
                      {msg.role === 'user' ? <UserIcon size={12} /> : <BotIcon size={12} />}
                    </div>
                    <span className="text-xs text-slate-400 font-medium">
                      {msg.role === 'user' ? 'Vous' : PERSONA_NAME}
                    </span>
                  </div>

                  <div
                    className={`px-5 py-3 rounded-2xl shadow-sm text-sm leading-relaxed ${
                      msg.role === 'user'
                        ? 'bg-slate-800 text-white rounded-tr-none'
                        : 'bg-white border border-slate-200 text-slate-700 rounded-tl-none'
                    }`}
                  >
                    {msg.text.split('\n').map((line, i) => (
                      <React.Fragment key={i}>
                        {line.replace(/\*\*/g, '')}
                        {i !== msg.text.split('\n').length - 1 && <br />}
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              ))}

              {isLoading && (
                <div className="flex flex-col max-w-[85%] mr-auto items-start">
                  <div className="px-5 py-4 rounded-2xl bg-white border border-slate-200 text-slate-400 rounded-tl-none shadow-sm flex items-center gap-2">
                    <div className="w-2 h-2 bg-slate-300 rounded-full animate-bounce"></div>
                    <div className="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></div>
                    <div className="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style={{ animationDelay: '0.4s' }}></div>
                  </div>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            <div className="bg-white border-t border-slate-200 p-4">
              <form
                onSubmit={handleSend}
                className="flex items-center gap-2 max-w-4xl mx-auto bg-slate-50 p-2 rounded-full border border-slate-200 shadow-inner focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent transition-all"
              >
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  placeholder="Posez votre question ici..."
                  disabled={isLoading || !apiKey}
                  className="flex-1 bg-transparent px-4 py-2 outline-none text-slate-700 disabled:opacity-50"
                />
                <button
                  type="submit"
                  disabled={isLoading || !input.trim() || !apiKey}
                  className="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white p-3 rounded-full transition-colors flex items-center justify-center shadow-md"
                >
                  <SendIcon size={18} />
                </button>
              </form>
              {!apiKey && (
                <p className="text-center text-xs text-red-500 mt-2 font-medium">
                  Veuillez configurer votre clé API (icône roue crantée en haut à gauche) pour commencer l'enquête.
                </p>
              )}
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
