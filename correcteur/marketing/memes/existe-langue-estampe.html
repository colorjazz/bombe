<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{background:#ccc}
.m{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:"Inter Display",Inter,sans-serif;color:#fff;
  background:radial-gradient(900px 700px at 85% 10%,#4f46e5 0%,rgba(79,70,229,0) 60%),radial-gradient(800px 600px at 0% 100%,#c2410c 0%,rgba(194,65,12,0) 55%),#16132a}
.pill{position:absolute;top:70px;right:70px;font:600 30px Inter;padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25)}
.t1{position:absolute;top:215px;left:76px;font-weight:900;font-size:134px;letter-spacing:-4px;line-height:1;
  background:linear-gradient(90deg,#fdba74,#fb923c 45%,#f97316);-webkit-background-clip:text;color:transparent}
.t2{position:absolute;top:395px;left:80px;right:80px;font-weight:900;font-size:96px;letter-spacing:-3px;line-height:1.02}
.t2 em{font-style:normal;background:linear-gradient(transparent 62%,#4f46e5 62%,#4f46e5 92%,transparent 92%)}
.steps{position:absolute;top:712px;left:80px;right:80px;display:flex;gap:18px}
.steps div{flex:1;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);border-radius:22px;padding:22px 22px;font:700 29px/1.2 Inter}
.steps b{display:block;font:900 22px Inter;color:#fb923c;letter-spacing:1px;margin-bottom:8px}
.last{position:absolute;top:918px;left:80px;font:600 32px Inter;color:#d6d3f5}
.foot{position:absolute;bottom:0;left:0;right:0;height:96px;background:#0d0b1a;display:flex;align-items:center;gap:18px;padding:0 44px;font:800 34px Inter}
.foot img{width:58px;height:58px}.foot span{margin-left:auto;color:#fb923c}
/* Estampe de biais, comme un tampon encreur (grain léger par-dessus) */
.stamp{position:absolute;top:40px;left:52px;transform:rotate(-10deg);padding:14px 28px 12px;border:7px solid #fb923c;border-radius:16px;
  box-shadow:0 0 0 6px #16132a,0 0 0 10px #fb923c;color:#fb923c;font:900 42px/1.02 "Inter Display",Inter,sans-serif;text-transform:uppercase;letter-spacing:2px;text-align:center;
  display:grid;background:rgba(251,146,60,.1);overflow:hidden}
.stamp::after{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 40%,transparent 0 3px,rgba(22,19,42,.35) 3px 4px);mix-blend-mode:multiply;opacity:.55}
</style></head><body>
<div class="m" id="m">
  <div class="stamp"><span>Même écrit</span><span>à la main</span></div>
  <div class="pill">Primaire et secondaire</div>
  <div class="t1">Oui, ça existe…</div>
  <div class="t2">Une appli qui <em>corrige le français</em> de tes élèves.</div>
  <div class="steps">
    <div><b>1</b>Tu photographies les textes</div>
    <div><b>2</b>Fautes surlignées, règle expliquée</div>
    <div><b>3</b>Selon l’année de tes élèves</div>
  </div>
  <div class="last">Tu relis, tu ajustes, tu gardes le dernier mot.</div>
  <div class="foot"><img src="logo.png" alt="">30 pages gratuites<span>brulelapile.ca</span></div>
</div></body></html>
