name = "correcteur-express"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "correcteur-express"
database_id = "9e056bae-7080-4877-80b5-db1305aa3424"

[vars]
# Gemini, via son accès compatible OpenAI. Pour changer de fournisseur, modifier ces deux lignes.
AI_MODEL = "gemini-3.5-flash"
# Utilisé automatiquement si AI_MODEL est retiré par Google (erreur 404).
AI_FALLBACK_MODEL = "gemini-flash-latest"
# Correction de la langue, 2e correction et redressement des photos : modèle stable (pas « preview »).
# Mesuré sur 9 vraies copies (vérité de terrain, voir tools/surlignages) : 81 % de surlignages exacts, contre 59 %.
LANG_MODEL = "gemini-3.7-flash"
AI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
TRIAL_PAGES = "30"
# Secrets à définir avec `npx wrangler secret put` :
#   AI_API_KEY (clé Gemini), STRIPE_SECRET_KEY, IP_SALT

# Journaux visibles dans Cloudflare (onglet Observability). Le serveur n'y écrit jamais le contenu des copies.
[observability]
enabled = true

[observability.logs]
invocation_logs = true

# Nettoyage horaire des empreintes d'IP (24 h) et des vieilles clés d'essai
[triggers]
crons = ["17 * * * *"]
