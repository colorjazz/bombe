<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prof Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Mise en page : un écran EGA 4:3 centré sur un bureau sombre, une ligne de touches dessous. */
  :root {
    --desk: #0b0b10;
    --bezel: #1c1c24;
    --bezel-edge: #34343f;
    --legend: #8a8aa0;
    --key: #55ffff;
    --btn: #2a2a36;
    --btn-fg: #ffffff;
    --font-legend: "VT323", "Lucida Console", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--btn-fg);
    font-family: var(--font-legend);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    overflow-x: hidden;
  }
  .monitor {
    width: min(100%, 960px, calc((100vh - 120px) * 4 / 3));
    padding: 10px;
    background: var(--bezel);
    border: 2px solid var(--bezel-edge);
    border-radius: 6px;
    box-sizing: border-box;
    position: relative;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    cursor: pointer;
    touch-action: manipulation;
  }
  #kbd {
    position: absolute;
    left: 0; bottom: 0;
    width: 1px; height: 1px;
    opacity: 0;
    border: 0; padding: 0;
    font-size: 16px;
  }
  .legend {
    color: var(--legend);
    font-size: 20px;
    text-align: center;
    line-height: 1.2;
    max-width: 960px;
  }
  .legend b { color: var(--key); font-weight: normal; }
  .pad { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .pad button {
    font-family: var(--font-legend);
    font-size: 22px;
    min-width: 52px; min-height: 44px;
    background: var(--btn);
    color: var(--btn-fg);
    border: 2px solid var(--bezel-edge);
    border-radius: 4px;
  }
  .pad button:focus-visible { outline: 2px solid var(--key); }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<div class="monitor">
  <canvas id="screen" width="320" height="200" aria-label="Écran du jeu Prof Quest"></canvas>
  <input id="kbd" type="text" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Tapez un ordre">
</div>
<div class="pad" id="pad">
  <button data-k="ArrowLeft" aria-label="Aller à gauche">&larr;</button>
  <button data-k="ArrowUp" aria-label="Monter">&uarr;</button>
  <button data-k="ArrowDown" aria-label="Descendre">&darr;</button>
  <button data-k="ArrowRight" aria-label="Aller à droite">&rarr;</button>
  <button data-k="type">Clavier</button>
  <button data-k="Enter">Entrée</button>
  <button data-k="Tab">Objets</button>
  <button data-k="Escape">Menu</button>
</div>
<div class="legend"><b>Flèches</b> marcher &middot; tapez un ordre + <b>Entrée</b> &middot; <b>Tab</b> inventaire &middot; <b>Échap</b> menu &middot; <b>F3</b> répéter &middot; <b>F5</b>/<b>F7</b> sauver/restaurer</div>

<script>
"use strict";
// ============================================================
//  PROF QUEST - trois glandeurs, une photocopieuse, Mme D.
//  Hommage aux aventures Sierra AGI de 1987 (Police Quest).
//  320x200 EGA, image 160x168 en pixels doubles, police 8x8.
// ============================================================

// ---------- palette EGA ----------
const PAL = [0x000000,0x0000AA,0x00AA00,0x00AAAA,0xAA0000,0xAA00AA,0xAA5500,0xAAAAAA,

const FONT = {};
for (let i = 0; i < 95; i++) { const g = []; for (let r = 0; r < 8; r++) g.push(parseInt(FONT_HEX.substr(i * 16 + r * 2, 2), 16)); FONT[32 + i] = g; }
for (let i = 0; i < 96; i++) { const g = []; for (let r = 0; r < 8; r++) g.push(parseInt(FONT_EXT.substr(i * 16 + r * 2, 2), 16)); FONT[160 + i] = g; }

// ---------- tampons d'écran ----------
const SW = 320, SH = 200, PW = 160, PH = 168, PIC_Y = 8;
const scr = new Uint8Array(SW * SH);
const pic = new Uint8Array(PW * PH);
let bg = new Uint8Array(PW * PH);
const cv = document.getElementById("screen");
const cx = cv.getContext("2d");
const img = cx.createImageData(SW, SH);
const img32 = new Uint32Array(img.data.buffer);

function pset(x, y, c) { x |= 0; y |= 0; if (x < 0 || x >= PW || y < 0 || y >= PH) return; pic[y * PW + x] = c; }
function rect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) pset(i, j, c); }
function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
function line(x0, y0, x1, y1, c) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) { pset(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function ellipse(cx0, cy0, rx, ry, c) {
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx + 0.5) + (y * y) / (ry * ry + 0.5) <= 1) pset(cx0 + x, cy0 + y, c);
}
function sset(x, y, c) { if (x < 0 || x >= SW || y < 0 || y >= SH) return; scr[y * SW + x] = c; }
function srect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) sset(i, j, c); }
function glyph(ch, x, y, fg, bgc, sx = 1, sy = 1) {
  const g = FONT[ch.charCodeAt(0)] || FONT[63];
  for (let r = 0; r < 8; r++) for (let b = 0; b < 8; b++) {
    const on = (g[r] >> b) & 1;
    if (on) srect(x + b * sx, y + r * sy, sx, sy, fg);
    else if (bgc >= 0) srect(x + b * sx, y + r * sy, sx, sy, bgc);
  }
}
function text(str, x, y, fg, bgc = -1, sx = 1, sy = 1) {
  // majuscules accentuées : la police 8x8 les écrase, on fait comme les jeux de l'époque
  str = str.replace(/[\u00c0-\u00dd]/g, (ch) => ch.normalize("NFD")[0]);
  for (let i = 0; i < str.length; i++) glyph(str[i], x + i * 8 * sx, y, fg, bgc, sx, sy); }
const center = (str, y, fg, sx = 1, sy = 1) => text(str, Math.floor((SW - str.length * 8 * sx) / 2), y, fg, -1, sx, sy);

// ---------- son : haut-parleur PC à une voix ----------
let actx = null, voice = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
const NOTE = (n) => { const m = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }; const r = /^([A-G])(#|b)?(\d)$/.exec(n); let s = m[r[1]] + (r[2] === "#" ? 1 : r[2] === "b" ? -1 : 0) + (parseInt(r[3]) - 4) * 12; return 440 * Math.pow(2, s / 12); };
function play(seq, tempo = 1) {
  if (!S || !S.sound) return;
  const a = audio(); if (!a) return;
  try { if (voice) { voice.stop(); voice = null; } } catch (e) {}
  const o = a.createOscillator(), g = a.createGain();
  o.type = "square"; g.gain.value = 0; o.connect(g); g.connect(a.destination);
  let t = a.currentTime + 0.02;
  for (const [n, d] of seq) {
    const dur = (d / 1000) * tempo;
    if (n) { o.frequency.setValueAtTime(typeof n === "number" ? n : NOTE(n), t); g.gain.setValueAtTime(0.045, t); g.gain.setValueAtTime(0, t + dur * 0.9); }
    else g.gain.setValueAtTime(0, t);
    t += dur;
  }
  o.start(); o.stop(t + 0.05); voice = o;
}
const SFX = {
  theme: [["C5",160],["C5",160],["G4",160],["A4",320],["G4",320],[0,80],["B4",160],["C5",160],["D5",160],["E5",320],["D5",160],["C5",160],["A4",160],["G4",480],[0,160],["E4",160],["F4",160],["G4",160],["C5",320],["B4",160],["C5",640]],
  points: [["C5",50],["E5",50],["G5",50],["C6",110]],
  door: [[110,60],[0,30],[90,90]],
  death: [["G4",260],["F#4",260],["F4",260],["E4",700]],
  pa: [["E5",350],["C5",600]],
  bell: Array.from({ length: 30 }, (_, i) => [i % 2 ? 1400 : 1600, 50]),
  win: [["C5",120],["E5",120],["G5",120],["C6",240],["G5",120],["C6",480]],
  beep: [[880,80]],
  bad: [[160,180]],
  select: [[660,40]],
};

// ---------- boîtes de message ----------
const Q = [];
function say(msg, opt = {}) { Q.push(Object.assign({ text: msg }, opt)); }
function wrap(str, width = 30) {
  const out = [];
  for (const para of str.split("\n")) {
    if (para === "") { out.push(""); continue; }
    let l = "";
    for (const w of para.split(" ")) {
      if ((l + (l ? " " : "") + w).length > width) { out.push(l); l = w; } else l += (l ? " " : "") + w;
    }
    out.push(l);
  }
  return out;
}
function drawBox(msg) {
  // espaces insécables avant la ponctuation haute, à la française
  const lines = wrap(msg.replace(/ ([:;!?»])/g, " $1").replace(/« /g, "« "));
  const cols = Math.max(...lines.map((l) => l.length), 1), rows = lines.length;
  const w = cols * 8, h = rows * 8;
  const x0 = Math.floor((SW - w) / 2 / 8) * 8, y0 = PIC_Y + Math.max(4, Math.floor((PH - h) / 2 / 8) * 8);
  srect(x0 - 10, y0 - 6, w + 20, h + 12, 15);
  srect(x0 - 7, y0 - 4, w + 14, 1, 4); srect(x0 - 7, y0 + h + 3, w + 14, 1, 4);
  srect(x0 - 8, y0 - 4, 2, h + 8, 4); srect(x0 + w + 6, y0 - 4, 2, h + 8, 4);
  lines.forEach((l, i) => text(l, x0, y0 + i * 8, 0));
}


// ---------- les trois glandeurs (tous profs d'histoire) ----------

const MME_D = { hair: 7, skin: 12, shirt: 15, vest: 6, tie: 15, pants: 6, shoes: 0, style: "bun", glasses: true, skirt: true };
const WRONG_NAMES = ["Christian", "Guylaine", "Jean-Paul", "Crispin", "Gérald", "Ginette", "Jean-Guy"];

// ---------- état du jeu ----------
const POINTS = { signin: 5, board: 1, water: 1, camera: 1, locker: 1, wake: 2, memo: 2, readmemo: 3, key: 5, mug: 3, filter: 3, grounds: 3,

function newState() {

const P = () => CHARS[S.pc];

const B = () => OTH()[0]; // à gauche de la table, accro au café, connaît le code

const has = (it) => S.inv.includes(it);
const give = (it) => { if (!has(it)) S.inv.push(it); };
const lose = (it) => { S.inv = S.inv.filter((i) => i !== it); };
function award(key) { if (S.got[key]) return; S.got[key] = 1; S.score += POINTS[key]; play(SFX.points); }
function clockStr() { const s = Math.min(BELL, Math.floor(S.t)); const m = 40 + Math.floor(s / 60); return m >= 60 ? "8 h 00" : "7 h " + String(m).padStart(2, "0"); }

// ---------- personnages ----------
function headExtras(x, T, c, f) {

const VERBS = new Set(["look","read","take","drop","open","close","talk","hello","ask","give","sign","use","fill","make","pour","drink","eat","unplug","plugv","fix","load","type","enter","unlock","lock","copyv","sit","stand","smell","wait","empty","wake","debate","play","inventory","score","help","save","restore","restart","quit","sound","kill","insult","kiss","knock","listen","go","swear","thank","yell","dance","grieve","paint","compute"]);

function parse(raw) {
  let s = " " + strip(raw.toLowerCase()).replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim() + " ";
  // roche-papier-ciseaux : « papier » tout seul ou « jouer papier »
  const rps = /^ (je )?(jouer |joue |jouez )?(la |le |les |du )?(roche|pierre|papier|ciseaux|ciseau) $/.exec(s);
  if (rps) return { v: "play", N: [], move: rps[4] === "pierre" ? "roche" : rps[4].startsWith("ciseau") ? "ciseaux" : rps[4] };
  s = s.replace(/ faire (des |les |une |la )?(photo)?cop(ie|ies) /g, " photocopier examen ")
       .replace(/ tirer (sur )?(la |le )?(prise|cordon|fil|plogue|plug) /g, " debrancher photocopieuse ")
       .replace(/ regarder autour /g, " regarder salle ").replace(/ quelle heure /g, " regarder horloge ")
       .replace(/ mot de passe /g, " code ").replace(/ micro ondes /g, " micro ")
       .replace(/ pains? au chocolat /g, " chocolatine ").replace(/ machine a cafe /g, " cafetiere ")
       .replace(/ salle des profs /g, " profs ").replace(/ casiers? des profs /g, " pigeonnier ").replace(/ casiers? des eleves /g, " cases ")
       .replace(/ cases? des eleves /g, " cases ").replace(/ cafe moulu /g, " moulu ")
       .replace(/ face camera /g, " camera ").replace(/ petit prince /g, " prince ")
       .replace(/ roche papier ciseaux /g, " roche ").replace(/ c est (le )?tour de qui /g, " reunion ")
       .replace(/ faire (la )?greve /g, " greve ").replace(/ deposer (un )?grief /g, " grief ")
       .replace(/ faire (une )?sieste /g, " sieste ").replace(/ mettre (les )?pieds sur (le )?bureau /g, " pianoter ");
  const words = s.trim().split(" ").filter(Boolean);
  if (!words.length) return null;
  const toks = []; let num = null;
  for (const w of words) {
    if (/^\d+$/.test(w)) { num = w; continue; }
    if (DUAL[w]) { toks.push(toks.length === 0 ? DUAL[w][0] : DUAL[w][1]); continue; }
    if (VOC[w]) { toks.push(VOC[w]); continue; }
    if (FILLER.has(w)) continue;
    return { err: "Je ne comprends pas « " + w + " »." };
  }
  let v = null; const N = [];
  for (const t of toks) { if (!v && VERBS.has(t)) v = t; else N.push(t); }
  if (!v && num) v = "type";
  if (!v && N.length) v = "look";
  if (!v) return { err: "Hein ?" };
  let move = null;
  if (v === "play") { const w = words.find((x) => /^(roche|pierre|papier|ciseaux?)$/.test(x)); if (w) move = w === "pierre" ? "roche" : w.startsWith("ciseau") ? "ciseaux" : w; }
  return { v, N: resolve(N), num, move };
}
function nearest(names) {
  const sp = ROOMS[S.room].spots; let best = names[0], bd = 1e9;
  for (const n of names) if (sp[n]) { const d = distTo(sp[n]); if (d < bd) { bd = d; best = n; } }
  return best;
}
function resolve(N) {
  const L = S.room === "lounge";
  const ids = { c_jp: "jp", c_guy: "guy", c_crispy: "crispy" };
  const owner = (id) => (id === P().id ? "me" : id === B().id ? "npcB" : "npcC");
  let out = N.map((n) => {
    if (ids[n]) return owner(ids[n]);
    if (n === "figs") return P().id === "guy" ? "figs" : L ? owner("guy") : "figs";
    if (n === "laptop") return P().id === "crispy" ? "laptop" : L ? owner("crispy") : "laptop";
    if (n === "machine") return N.includes("copier") || N.includes("copyv") ? "copier" : N.includes("coffee") ? "maker" : L ? nearest(["copier", "maker"]) : "machine";
    if (n === "box") return N.includes("grounds") || N.includes("coffee") ? "grounds" : L ? "donut" : "mailbox";
    if (n === "person") return L ? "npcB" : "mmeD";
    if (n === "cabinet") return N.includes("supply") ? "supply" : N.includes("upperc") ? "cabinet" : L ? nearest(["cabinet", "supply"]) : "locker";
    if (n === "upperc") return L ? "cabinet" : "locker";
    if (n === "casier") return L ? "locker" : nearest(["mailbox", "locker"]);
    if (n === "water") return L ? "water" : "fountain";
    if (n === "lounge") return L ? "room" : "door";
    if (n === "hall") return L ? "door" : "room";
    if (n === "copyv") return "copier";
    if (n === "feuille") return L ? "paper" : "sheet";
    if (n === "affiche") return L ? "poster" : "board";
    if (n === "prince") return L ? "poster" : "board";
    return n;
  });
  if (out.includes("door")) out = out.filter((n) => n !== "room");
  if (out.includes("maker")) out = out.filter((n) => n !== "coffee");
  if (out.includes("grounds")) out = out.filter((n) => n !== "coffee");
  return out.filter((n, i, a) => a.indexOf(n) === i);
}

    case "board": award("board"); return say("Babillard : VENTE DE GÂTEAUX VENDREDI. PERDU : HAMSTER « GÉRARD ». Note de Mme D : « LE TAUX DE RÉUSSITE DOIT MONTER. PEU IMPORTE COMMENT. » Une affiche du syndicat : « ASSEMBLÉE GÉNÉRALE JEUDI - chat-JP ». Et un dessin du Petit Prince, signé par les élèves de sec. 1.");
    case "fountain": return say("Un abreuvoir fixé au mur, pile à la hauteur d'un élève de sixième année.");
    case "locker": return say("Des cases d'élèves bleues, cabossées. L'une d'elles bourdonne. Personne ne veut savoir.");
    case "mmeD": return say("Mme D, la directrice. Tailleur beige, chignon serré, lunettes au bout du nez, cartable plein de tableaux de bord. Elle ne connaît le nom d'aucun prof, mais récite le taux de diplomation à deux décimales près. Elle cherche son bureau depuis 2019.");
    case "fridge": return S.fridgeOpen ? say("Dans le frigo : " + (S.got.milkTaken ? "" : "une pinte de lait, ") + "un sous-marin étiqueté KOWALSKI - PAS TOUCHE, et un plat de plastique dont le contenu a développé une conscience.") : say("Un frigidaire blanc couvert d'aimants. Sur la porte, un papier jaune : le calendrier des réunions ratées. Un micro-ondes est posé dessus.");
    case "calendar": if (!near("calendar")) return; award("calendar"); award("debate"); if (S.debate < 2) S.debate = 2; return say(CALENDAR());
    case "lunch": return say(S.fridgeOpen ? "Un sous-marin jambon-fromage dans du papier ciré. Étiquette en majuscules rageuses : KOWALSKI - PAS TOUCHE. ÇA VEUT DIRE TOI, " + B().name.toUpperCase() + "." : "Vous ne voyez pas ça ici.");
    case "tupperware": return say(S.fridgeOpen ? "Ça bouge. Un peu. Refermez le frigo." : "Vous ne voyez pas ça ici.");
    case "milk": return say(S.fridgeOpen && !S.got.milkTaken ? "Une pinte de lait. " + inv.milk : "Vous ne voyez pas ça ici.");
    case "microwave": return say("Quelqu'un y a fait réchauffer du poisson en 2009. Plus personne ne s'en sert. L'odeur, elle, est restée.");
    case "coffee": case "pot": case "maker": {
      const p = { sludge: "La verseuse contient un goudron noir qui était du café mardi passé. La plaque est encore allumée.", empty: "La verseuse est vide.", water: "La verseuse est pleine d'eau propre.", brewing: "Le café coule. Ça glougloute avec espoir.", coffee: "Une pleine verseuse de café frais. Ça sent l'espoir." }[S.pot];
      return say("Une vieille cafetière filtre. " + p);
    }
    case "filter": case "grounds": return say(S.cabinetOpen ? "C'est dans l'armoire au-dessus du comptoir." : "Vous ne voyez pas ça ici.");
    case "cabinet": return say(S.cabinetOpen ? "Dans l'armoire :" + (S.got.filter ? "" : " des filtres à café,") + (S.got.grounds ? "" : " un paquet de café moulu,") + " et un sachet de sucre de 1994." : "Des armoires en bois au-dessus du comptoir. Pas barrées.");
    case "supply": return say(S.supplyUnlocked ? "L'armoire est ouverte. " + (S.got.paper ? "Brocheuses, toner, et des craies que personne n'a touchées depuis 1991." : "Il y a une ramette de papier neuve sur la tablette du haut.") : "Une grande armoire de métal gris. Barrée. Mme D garde le bon papier sous clé, comme les joyaux de la Couronne.");
    case "paper": return say(S.supplyUnlocked && !S.got.paper ? "Une ramette de papier dans l'armoire." : S.copier.paper ? "Le bac de la photocopieuse est plein." : "Vous ne voyez pas de papier ici.");
    case "copier": case "jam": return say("Une photocopieuse beige de la taille d'une petite auto. Autocollant : NE PAS DONNER DE COUPS DE PIED. Son écran " + (copierDisplay() === "noir" ? "est noir. Elle est débranchée." : "affiche : " + copierDisplay() + ".") + (S.copier.jam ? " Une feuille froissée est coincée tout au fond, juste à côté d'une étiquette : DANGER - HAUTE TENSION." : ""));
    case "cord": return say(S.copier.plugged ? "Le fil de la photocopieuse court jusqu'à une prise dans le mur." : "Le fil de la photocopieuse traîne à terre, débranché.");
    case "mug": case "rack": return say("Un égouttoir avec quelques tasses propres." + (S.got.mug ? "" : " Une rouge dit : MEILLEUR PROF D'HISTOIRE (OU PRESQUE)."));
    case "sink": return say("Un évier en inox. Au-dessus, une petite plaque en laiton : EN MÉMOIRE DE GÉRARD FENOUIL. IL N'A RIEN DÉBRANCHÉ.");
    case "water": return say("L'évier a l'eau courante. En général.");
    case "donut": return say(S.donut ? "La dernière chocolatine, dans une boîte rose. " + B().name + " la surveille. Et vous surveille." : "La boîte est vide. Il ne reste que des miettes et des souvenirs.");
    case "table": return say("Une table branlante. D'un côté, " + B().name + ". De l'autre, " + C().name + ". Au milieu, une boîte de viennoiseries et des années de désengagement.");
    case "couch": return say("Un divan écossais brun. Personne ne s'y assoit : Mme D a dit que ça « paraissait mal » sur les photos du rapport annuel.");
    case "chair": return say("Des chaises de plastique. " + B().name + " et " + C().name + " en occupent une chacun. Plus une autre pour les pieds.");
    case "poster": return say("Une affiche du Petit Prince : « On ne voit bien qu'avec le coeur. L'essentiel est invisible pour les yeux. » Mme D a ajouté au feutre : « SAUF LES STATISTIQUES. »");
    case "window": return say("Il n'y a pas de fenêtre dans la salle des profs. Il n'y en a jamais.");
  }
  say("Rien de spécial.");
}

function act(v, N, num, move) {
  const L = S.room === "lounge";
  const n0 = N[0], hasN = (...a) => a.some((x) => N.includes(x));
  const me = P().id;
  switch (v) {
    case "look": return doLook(N);
    case "inventory": return showInv();
    case "score": return say("Votre score est de " + S.score + " sur " + MAX + ".");
    case "help": return say("Flèches pour marcher (rappuyez pour arrêter). Puis tapez ce que vous voulez faire :\n\nREGARDER   LIRE NOTE\nPRENDRE COURRIER\nPARLER À MME D\nDEMANDER LE CODE\nPARLER DE LA RÉUNION\nDONNER CAFÉ   PAPIER\nREGARDER CAMÉRA\n\nIl faut être près des choses. F3 répète la dernière commande.");
    case "save": return saveGame();
    case "restore": return restoreGame();
    case "restart": return confirmRestart();
    case "quit": return say("Merci d'avoir joué à Prof Quest.\n\nENTRÉE pour recommencer, ÉCHAP pour continuer.", { enter: restart });
    case "sound": S.sound = !S.sound; return say("Son : " + (S.sound ? "oui." : "non."));
    case "wait": return say("Vous attendez. C'est votre spécialité. Il est " + clockStr() + ".");
    case "swear": return say("Surveillez votre langage. Il y a peut-être des élèves. Et un micro-perche.");
    case "kill": return say("Ce genre de chose vous vaudrait une rencontre avec les ressources humaines du centre de services. Et une nouvelle carrière.");
    case "insult": return hasN("mmeD") && !L ? (near("mmeD") && die("Vous dites à Mme D, en détail, ce que vous pensez de ses indicateurs.\n\nElle sort un formulaire. Puis un deuxième. Puis un tampon.\n\nVous êtes réaffecté au centre de services scolaire, au service des statistiques, jusqu'à la retraite. Le documentaire s'arrête là pour vous.")) : say("Gardez votre énergie. Vous en avez si peu.");
    case "grieve":
      if (me === "jp") return say("Vous déposez un grief. Votre 213e. Objet : « l'existence même des réunions du midi ». Vous gardez votre sérieux trois secondes. Puis vous éclatez de rire. Le caméraman aussi.");
      if (!L && near0("mmeD")) return die("Vous prononcez le mot « grève » à moins de trois mètres de Mme D.\n\nSes lunettes s'embuent. Elle lance une vérification surprise de votre planification. Elle est vide depuis octobre.\n\nVous passez le reste de l'année en surveillance de cafétéria. Seul. Pour toujours.");
      return say("Les griefs, c'est chat-JP qui s'en occupe. Il en a déposé 212. Il en a gagné trois. Il dit que c'est le principe qui compte.");
    case "paint":
      if (me === "guy") return say("Vous sortez une figurine du général Montcalm de votre poche et peinturez un bouton de son uniforme. Trois minutes. Vous êtes épuisé. C'est le plus beau bouton de la Nouvelle-France.");
      return say("Peinturer des figurines, c'est le domaine de Guy-Homie. Il a un pinceau à un seul poil pour les cils de Wolfe.");
    case "compute":
      if (me === "crispy") return say("Vous mettez les pieds sur le bureau le plus proche et ouvrez votre portable. Onze onglets. Aucun n'est en lien avec l'histoire. Vous le refermez avec un profond sentiment d'accomplissement.");
      return say("L'ordi, c'est le truc de Crispy. Personne d'autre ne sait le mot de passe. Personne d'autre ne veut savoir ce qu'il y a dessus.");
    case "kiss": return say(hasN("mmeD") ? "Mme D vous fixe jusqu'à ce que vous cessiez d'exister. Vous reculez lentement." : "Restons professionnels. Il y a une caméra.");
    case "dance": return say("Vous esquissez un pas de danse. Le caméraman l'a filmé. Ça va être dans le générique.");
    case "yell": return say("Votre voix résonne. Quelque part, un concierge soupire.");
    case "thank": return say("Bienvenue.");
    case "listen": return say(L ? "Le frigo ronronne. La cafetière cliquette. " + C().name + " soupire dans sa bulle." : "Des cases claquent au loin. Le crayon de Mme D gratte son cartable. Elle note quelque chose. Sur vous.");
    case "knock": return say("Vous cognez. Personne ne répond. La porte n'est pas barrée : marchez simplement dedans.");
    case "go": case "enter":
      if (v === "enter" && (hasN("code") || num)) return act("type", N, num);
      return say("Utilisez les flèches pour marcher. Pour passer une porte, foncez dedans.");
    case "hello": case "talk":
      if (hasN("meeting")) return debate();
      return talk(n0);
    case "ask":
      if (hasN("meeting") && L && !hasN("mmeD")) return debate();
      return ask(N);
    case "debate": return debate();
    case "play": return playRps(move);
    case "wake": return wake(n0);
    case "stand": return say("Vous êtes debout. C'est déjà ça.");
    case "sit": return say(L ? "Le divan vous tend les bras. Mais la cloche sonne à 8 h. Les vrais glandeurs savent quand il ne faut pas glander." : "Il n'y a nulle part où s'asseoir ici. Mme D a fait enlever les bancs : ça « paraissait mal ».");
    case "smell": return say(hasN("milk") ? "Ça sent... bon ? Sûrement assez bon pour un café. Sûrement pas pour le boire tel quel." : hasN("microwave") ? "Poisson. 2009. Inimitable." : L ? "Café brûlé, vieux poisson et désengagement." : "Cire à plancher et aiguisoir.");
    case "drop": return say("Vous êtes mieux de le garder.");
    case "read":
      if (hasN("memo")) { if (has("memo")) { award("readmemo"); return say(MEMO); } break; }
      if (N.length && !hasN("sheet")) return doLook(N);
      break;
  }
  if (!L) return hallAct(v, N, num);
  return loungeAct(v, N, num);
}

// ---------- le grand débat : c'est le tour de qui de rater la réunion ? ----------
function debate() {
  if (S.room !== "lounge") return say("Le débat se fait en salle des profs. Pas devant Mme D. Jamais devant Mme D.");
  if (!near("table")) return;
  const b = B().name, c = C().name, pn = P().name;
  if (S.debate === 3) return say("C'est réglé : c'est votre tour de rater la réunion. " + b + " vous le reproche toutes les trente secondes.");
  if (S.debate === 4) return say("C'est réglé : " + b + " rate la réunion, vous y allez avec " + c + ". " + c + " vous tapote l'épaule. « On va s'asseoir en arrière. »");
  if (S.debate === 0) {
    S.debate = 1; award("debate");
    return say("« Bon. La réunion de Mme D ce midi. C'est le tour de qui de la rater ? »\n\n" + b + " : « Moi ! J'en ai pas raté une depuis octobre. »\n" + c + " : « Voyons donc, c'est mon tour. J'ai fait celle sur les indicateurs au complet. Trois heures. J'ai vu des choses. »\n" + pn + " : « Moi aussi j'y ai droit... »\n\nTout le monde se tourne vers le calendrier collé sur le frigidaire.");
  }
  return say(b + " : « Le calendrier fait foi. Va le lire. »\n" + c + " : « Pis si c'est égal, c'est roche-papier-ciseaux. Comme d'habitude. C'est moi l'arbitre. »");
}
function beats(a, b) { return (a === "roche" && b === "ciseaux") || (a === "ciseaux" && b === "papier") || (a === "papier" && b === "roche"); }
function playRps(move) {
  if (S.room !== "lounge") return say("Jouer à roche-papier-ciseaux tout seul dans le corridor ? Mme D le noterait.");
  if (S.debate < 2) return say(S.debate === 0 ? "Contre qui ? Et pour quoi ? Lancez d'abord le débat sur la réunion." : "Avant de jouer, il faut savoir qui est à égalité. Lisez le calendrier sur le frigo.");
  if (S.debate > 2) return say("C'est réglé. On ne revient pas là-dessus. Même la convention collective est claire.");
  if (!near("table")) return;
  if (!move) return say("Roche, papier ou ciseaux ? Tapez votre coup.");
  const b = B(), c = C().name;
  const pre = c + " arbitre. « Roche... papier... ciseaux ! »\n\nVous : " + move.toUpperCase() + ". " + b.name + " : " + b.rps.toUpperCase() + ".\n\n";
  if (move === b.rps) return say(pre + "Égalité. " + c + " soupire. « On recommence. »");
  if (beats(move, b.rps)) {
    S.debate = 3; award("rps");
    return say(pre + b.name + " fixe sa main, trahi par son propre réflexe. « Bon. J'y vais. Encore. Mais j'apporte " + (b.id === "guy" ? "mes figurines." : b.id === "crispy" ? "mon ordi." : "la convention collective. Pis je pose des questions.") + " »\n\nC'est votre tour de rater la réunion. Votre excuse officielle : « rencontre de parents ». Le caméraman fait un gros plan sur votre main victorieuse.");
  }
  S.debate = 4;
  return say(pre + b.name + " lève les bras. " + c + " tranche : « C'est " + b.name + " qui la rate. " + P().name + ", tu viens avec moi. »\n\nVous passerez votre dîner à regarder des graphiques en tarte. Quelque part, Mme D sourit sans savoir pourquoi.");
}

function talk(n) {
  const L = S.room === "lounge";
  const pn = P().name;
  if (!n) n = L ? "npcB" : "mmeD";
  if (n === "me") return say("Vous vous parlez à vous-même. Le caméraman prend des notes.");
  if (n === "mmeD" && !L) {
    if (!near("mmeD")) return;
    if (!S.signed) return say("Mme D lève les yeux de son cartable. « Ah. Bonjour... " + wrongName() + ". Vous n'avez pas signé. Signez. Je me fiche de ce que vous enseignez, il me faut une donnée. » Elle regarde autour d'elle. « C'est par où, mon bureau, déjà ? »");
    if (!has("copies")) return say("« Vous avez signé à " + clockStr() + ". Je le note. Je note tout. Rappel : réunion ce midi. Présence obligatoire pour tout le département d'histoire. Je compterai les têtes. Enfin, j'essaierai. » Elle s'éloigne d'un pas, hésite, revient. « Ce n'était pas par là. »");
    return say("« Des photocopies ? Parfait. Je vais pouvoir cocher une case. J'aime cocher des cases. » C'est la chose la plus chaleureuse qu'elle ait dite depuis 2019.");
  }
  if (n === "npcB" && L) {
    if (!near("npcB")) return;
    if (!S.happy) return say(B().name + " ne lève pas les yeux. « Pas un mot avant mon café, " + pn + ". Quelqu'un a laissé la cafetière allumée depuis mardi. C'était peut-être moi. Peu importe. »");
    return say("« Ce café est un miracle. Le code de la photocopieuse, c'est " + S.code + ". Pis débranche-la avant d'aller farfouiller dedans. Une plaque au-dessus de l'évier, c'est assez. »");
  }
  if (n === "npcC" && L) {
    if (!near("npcC")) return;
    if (!S.awake) return say(C().name + " " + C().doing + " Pas de réaction. Essayez de DÉRANGER " + C().name.toUpperCase() + ".");
    return say(C().busy);
  }
  say("Il n'y a personne de ce nom ici.");
}
function wake(n) {
  if (S.room !== "lounge") return say("Personne n'est à déranger ici. À part Mme D, et ce serait une mauvaise idée.");
  if (n === "npcB") return say(B().name + " : « Pas avant mon café. »");
  if (!near("npcC")) return;
  if (S.awake) return say(C().busy);
  S.awake = true; award("wake");
  return say(C().name + " lève les yeux, l'air d'avoir été tiré d'un rêve. « Hein ? Ah, toi. Bon, conseil gratuit : débranche la photocopieuse avant d'y toucher, pis apporte un café à " + B().name + ". Sans café, " + B().name + " donne rien. Pas même l'heure. »\n\nPuis, plus bas : « Et pour roche-papier-ciseaux... " + B().hint.slice(2) + "\n\nEt " + C().name + " replonge.");
}
function ask(N) {
  const L = S.room === "lounge";
  let who = N.find((n) => n === "npcB" || n === "npcC" || n === "mmeD");
  if (!who) who = L ? "npcB" : "mmeD";
  if (who === "mmeD" && L) return say("Mme D n'est pas là. Elle cherche probablement son bureau.");
  if (who !== "mmeD" && !L) return say("Il n'y a personne de ce nom ici.");
  if (!near(who)) return;
  const t = N.find((n) => n !== who);
  const pn = P().name;
  if (who === "npcC") {
    if (!S.awake) return say(C().name + " " + C().doing + " Pas de réaction. Essayez de DÉRANGER " + C().name.toUpperCase() + ".");
    switch (t) {
      case "npcB": case "play": return say(B().hint);
      case "mmeD": return say("« Mme D ? Elle a fait enlever la machine à café de l'ancienne salle des profs. Pour « la productivité ». On a fait une minute de silence. Pis une deuxième pour le café. »");
      case "code": case "copier": return say("« Le code ? Demande à " + B().name + ". Mais pas avant son café. J'ai essayé une fois. J'ai encore la marque. »");
      case "donut": return say("« La chocolatine ? Penses-y même pas. Pas tant que " + B().name + " a pas eu son café. »");
      case "meeting": case "calendar": return say("« La réunion ? On y va tous, mais y en a toujours un qui « a une urgence ». Un seul, sinon ça paraît. Le calendrier est sur le frigo. Si c'est égal, roche-papier-ciseaux. Pis c'est moi l'arbitre. J'adore arbitrer. C'est assis. »");
      case "camera": return say("« Les gars du documentaire ? Ils sont là depuis trois semaines. Ils ont rien filmé de productif. Ils commencent à s'inquiéter. »");
    }
    return say(C().busy);
  }
  if (who === "npcB") {
    switch (t) {
      case "code": case "copier":
        if (S.happy) return say("« C'est " + S.code + ". Tu écoutes quand on te parle ? »");
        return say("« Le code ? C'est sûr que je le connais. Pis tu vas le connaître aussi, juste après m'avoir apporté un café. Un FRAIS. Pas le goudron de mardi. »");
      case "jam": return say("« Cette machine-là bloque si on la regarde de travers. Débranche-la avant de mettre la main dedans. Fenouil l'a pas fait. »");
      case "donut": return say(S.happy ? "« Vas-y, prends-la. Tu l'as méritée. »" : "« C'est MA chocolatine. Je la fixe depuis 7 h 15. On a une connexion. »");
      case "lunch": case "kowalski": return say("« Kowalski ? Prof d'éduc. 1,95 m. Très à cheval sur son lunch. L'an passé, quelqu'un a mangé son pouding. On l'a jamais revu. »");
      case "fenouil": return say("« Gérard Fenouil. Trente ans de chimie. Pis cette photocopieuse-là. » " + B().name + " s'essuie discrètement les yeux.");
      case "coffee": case "pot": case "maker": case "filter": case "grounds": return say("« Filtres pis café moulu dans l'armoire au-dessus du comptoir. L'eau, c'est l'évier. C'est pas sorcier, " + pn + ". »");
      case "milk": return say("« Je le prends avec du lait. Mais bois SURTOUT pas ce lait-là tel quel. »");
      case "mmeD": return say("« Mme D ? Elle veut pas que les élèves réussissent. Elle veut que ça AIT L'AIR qu'ils réussissent. C'est pas pareil. Elle a fait une formation là-dessus. »");
      case "paper": case "supply": return say("« Le papier est dans l'armoire grise. Mme D la barre, pis elle met une clé dans chaque casier. Personne comprend. Elle non plus. »");
      case "meeting": case "calendar": return debate();
      case "npcC": return say("« " + C().name + " ? " + C().name + " " + C().doing + " Depuis 2017. »");
      case "camera": return say(B().name + " regarde la caméra. Longuement. Puis retourne à ses affaires. Le silence en dit long.");
      case "me": return say("« Toi ? T'es le seul prof qui a réussi à mettre « sieste » dans sa planification annuelle. Respect. »");
    }
    return say(B().busy);
  }
  switch (t) {
    case "code": case "copier": return say("« Le code ? Je l'ai changé onze fois cette année. Je ne m'en souviens plus. » Elle plisse les yeux. « Quelqu'un dans la salle des profs le connaît toujours. Je ne sais pas comment. Ça m'agace. »");
    case "sheet": return say("« Chaque prof signe. Chaque matin. Ça fait une belle courbe. Je me fiche de la courbe des élèves, mais celle-là est magnifique. »");
    case "class": return say("« La réussite des élèves ? Oui, oui. Tant que ça paraît bien dans le tableau de bord. »");
    case "meeting": return say("« Ce midi. Local... 214 ? 241 ? Je vous enverrai un courriel. Ou deux. Le sujet : le plan d'engagement vers la réussite. Il faut surtout qu'il ait l'air réussi. Tout le département d'histoire doit être là. Je compterai les têtes. » Elle compte les vôtres. Elle arrive à deux.");
    case "npcB": return say("« " + B().name + " ? Ah oui. Le... prof de... quelque chose. Il a un taux de présence de 94 %. C'est bien. Je ne sais pas ce qu'il fait, mais c'est bien. »");
    case "npcC": return say("« " + C().name + ". J'ai un dossier. Il fait quatre centimètres d'épaisseur. Il ne contient que des graphiques. »");
    case "paper": case "supply": case "key": return say("« Votre clé est dans votre casier, avec ma note. Lisez ma note. Je les écris pour qu'elles soient lues. Elles ne le sont jamais. Ça fait baisser mes indicateurs de lecture. »");
    case "lunch": case "kowalski": return say("« M. Kowalski a le meilleur taux de présence de l'école. Ne touchez pas à son lunch. »");
    case "fenouil": return say("Mme D retire ses lunettes. Une demi-seconde. « Nous ne parlons pas de l'incident de la photocopieuse. Il n'apparaît dans aucun rapport. »");
    case "jam": return say("« On débranche d'abord. J'ai fait une note. Plastifiée. »");

// ---------- mort, victoire, sauvegarde ----------
function die(msg) {
  S.dead = true; S.dir = null; S.target = null; play(SFX.death);
  say(msg, { enter: () => say("Merci d'avoir joué à Prof Quest. La prochaine fois, respectez la procédure.\n\nENTRÉE pour recommencer.\nÉCHAP pour restaurer votre partie.", { enter: restart, esc: () => { if (!restoreGame(true)) restart(); } }) });
}
function win() {
  award("deliver"); S.won = true; S.dir = null; play(SFX.win);
  const meeting = S.debate === 3
    ? "Ce midi, " + B().name + " et " + C().name + " iront à la réunion de Mme D. Vous, vous avez une « rencontre de parents ». Avec votre lunch. Mme D compte deux têtes sur trois et ne remarque rien."
    : S.debate === 4
      ? "Ce midi, vous irez à la réunion de Mme D avec " + C().name + ". " + B().name + " a gagné le droit de la rater. Ça arrive aux meilleurs."
      : "Ce midi, faute d'avoir réglé le tour, vous allez tous les trois à la réunion de Mme D. Elle compte trois têtes sur trois. « 100 % de présence ! Ça va TELLEMENT bien paraître. » Vous auriez dû régler ça en salle des profs.";
  say("Vous entrez au local " + P().local + " à " + clockStr() + " avec 32 copies encore tièdes de votre examen.\n\nPile à l'heure, la cloche sonne. Trente-deux élèves de secondaire 4 soupirent à l'unisson.\n\n" + meeting, {
    enter: () => say("(" + P().name + ", face caméra)\n\n« Vous savez quoi ? Aujourd'hui, j'ai travaillé. Un peu. Pis j'ai même pas eu mal. »\n\nLe caméraman zoome. Générique.", {
      enter: () => say("FÉLICITATIONS !\n\nScore final : " + S.score + " sur " + MAX + "." + (S.score < MAX ? "\n\nIl reste des points à trouver. Fouillez. Regardez la caméra. Gagnez le droit de rater la réunion." : "\n\nScore parfait. Même Mme D n'a rien trouvé à redire. Elle ne sait juste pas à qui le dire.") + "\n\nENTRÉE pour rejouer.", { enter: () => restart(true), esc: () => restart(true) }),
    }),
  });
}
function saveGame() {
  try { localStorage.setItem("sdp-qc-save", JSON.stringify(S)); say("Partie sauvegardée.\n\n(" + clockStr() + ", score " + S.score + ")"); }
  catch (e) { say("Ce navigateur refuse de sauvegarder la partie."); }
}
function restoreGame(quiet) {
  let d = null;
  try { d = JSON.parse(localStorage.getItem("sdp-qc-save") || "null"); } catch (e) { d = null; }
  if (!d) { if (!quiet) say("Aucune partie sauvegardée."); return false; }
  Q.length = 0; S = d; S.mode = "play"; S.dir = null; S.target = null; buildBg();
  say("Partie restaurée.");
  return true;
}
function restart(choose) {
  Q.length = 0; const snd = S.sound, pc = S.pc; S = newState(); S.sound = snd; S.pc = pc;
  if (choose) { S.mode = "select"; return; }
  S.mode = "play"; buildBg(); intro();
}
function confirmRestart() { say("ENTRÉE pour recommencer la partie.\n\nÉCHAP pour continuer celle-ci.", { enter: () => restart(true) }); }
function intro() {
  say("École secondaire\nAntoine-de-Saint-Exupéry.\nLundi, 7 h 40.\n\nVous êtes " + P().name + ", prof d'histoire. Vous aviez toute la fin de semaine pour préparer votre examen. Vous l'avez écrit ce matin, dans l'autobus.");
  say("Il faut 32 photocopies avant la cloche de 8 h. La photocopieuse est dans la salle des profs, avec " + B().name + " et " + C().name + ", vos collègues d'histoire.\n\nEt Mme D, la directrice, a convoqué une réunion ce midi. Tout le monde doit y être. Mais entre vous trois, c'est la tradition : à tour de rôle, un seul s'absente. Un absent, ça passe. Deux, ça paraît. C'est le tour de qui ? Personne ne s'entend.");
  say("Flèches pour marcher. Tapez des ordres comme REGARDER, PRENDRE COURRIER ou PARLER À MME D, puis ENTRÉE.\n\nÉCHAP : menu.\nTAB : inventaire.\n\nAh, et une équipe de documentaire filme l'école.");
}

// ---------- inventaire et menu ----------
let overlay = null;
function showInv() { overlay = "inv"; }
function drawInv() {
  scr.fill(15);
  center("Vous transportez :", 8, 0);
  const items = S.inv.map(invName);
  if (!items.length) center("rien", 32, 0);
  items.forEach((it, i) => text(it.slice(0, 38), 16, 28 + i * 12, 0));
  center("Une touche pour revenir au jeu", 184, 0);
}
const MENUS = [
  { t: "Info", items: [["À propos", () => say("PROF QUEST\nTrois profs d'histoire. Une photocopieuse. Une réunion. Et Mme D.\n\nUn hommage de fan aux aventures Sierra AGI de 1987.\n\nAucune photocopieuse n'a été maltraitée. Plusieurs profs, oui.")], ["Aide", () => act("help", [])]] },
  { t: "Fichier", items: [["Sauver       <F5>", saveGame], ["Restaurer    <F7>", () => restoreGame()], ["Recommencer  <F9>", confirmRestart], ["Quitter", () => act("quit", [])]] },
  { t: "Action", items: [["Regarder", () => doLook([])], ["Inventaire  <Tab>", showInv], ["Score", () => act("score", [])], ["Heure", () => say("Votre montre indique " + clockStr() + ". La cloche sonne à 8 h.")], ["Face caméra", camera]] },
  { t: "Spécial", items: [["Son oui/non  <F2>", () => { S.sound = !S.sound; }]] },
];
let menu = null;
function drawMenu() {
  srect(0, 0, SW, 8, 15);
  let x = 8; const xs = [];
  MENUS.forEach((m, i) => { xs.push(x); text(m.t, x, 0, i === menu.m ? 15 : 0, i === menu.m ? 0 : 15); x += (m.t.length + 1) * 8; });
  const m = MENUS[menu.m]; const w = Math.max(...m.items.map((it) => it[0].length)) * 8 + 16;
  const mx = Math.min(xs[menu.m], SW - w - 2), my = 8, h = m.items.length * 8 + 8;
  srect(mx, my, w, h, 15);
  srect(mx, my, w, 1, 0); srect(mx, my + h - 1, w, 1, 0); srect(mx, my, 1, h, 0); srect(mx + w - 1, my, 1, h, 0);
  m.items.forEach((it, i) => { const sel = i === menu.i; srect(mx + 4, my + 4 + i * 8, w - 8, 8, sel ? 0 : 15); text(it[0], mx + 8, my + 4 + i * 8, sel ? 15 : 0); });
}

// ---------- écran titre et choix du perso ----------
function drawTitle() {
  scr.fill(1);
  srect(6, 6, SW - 12, SH - 12, 0);
  srect(8, 8, SW - 16, 1, 9); srect(8, SH - 9, SW - 16, 1, 9); srect(8, 8, 2, SH - 16, 9); srect(SW - 10, 8, 2, SH - 16, 9);
  const c1 = "PROF", c2 = "QUEST";
  text(c1, (SW - c1.length * 32) / 2 + 3, 20, 4, -1, 4, 3); text(c1, (SW - c1.length * 32) / 2, 18, 14, -1, 4, 3);
  text(c2, (SW - c2.length * 32) / 2 + 3, 46, 4, -1, 4, 3); text(c2, (SW - c2.length * 32) / 2, 44, 14, -1, 4, 3);
  center("École secondaire", 74, 11);
  center("Antoine-de-Saint-Exupéry", 83, 11);
  center("3 glandeurs. 1 réunion. Qui la rate ?", 96, 12);
  const M = (x, y, w, h, c) => srect(140 + x * 2, 106 + y, w * 2, h, c);
  M(4, 10, 14, 24, 12); M(5, 11, 12, 1, 4); M(18, 15, 4, 2, 12); M(20, 17, 2, 10, 12); M(18, 27, 4, 2, 12); M(4, 34, 14, 2, 4);
  M(6, 18, 10, 2, 15); M(6, 22, 8, 1, 15);
  const ph = (tick >> 2) % 3;
  for (let i = 0; i < 3; i++) { M(7 + i * 3 + (ph === i ? 1 : 0), 2 + i, 1, 4, 7); M(8 + i * 3 - (ph === i ? 1 : 0), 6 + i, 1, 3, 7); }
  srect(124, 142, 72, 2, 6);
  if ((tick >> 3) % 2) center("Appuyez sur ENTRÉE", 158, 15);
  center("Une production du syndicat local", 176, 7);
}
const SEL_X = [13, 40, 67];
function drawSelect() {
  scr.fill(0);
  srect(0, 24, SW, 64, 3);
  srect(0, 0, SW, 8, 15); center("Choisissez votre glandeur", 0, 0);
  pic.fill(255);
  CHARS.forEach((ch, i) => drawPerson(SEL_X[i], 60, "down", i === S.pc ? (tick >> 2) : 0, ch.c));
  for (let py = 30; py < 62; py++) for (let px = 0; px < 80; px++) { const c = pic[py * PW + px]; if (c !== 255) srect(px * 4, 24 + (py - 30) * 2, 4, 2, c); }
  CHARS.forEach((ch, i) => {
    const cxp = SEL_X[i] * 4 + 2, sel = i === S.pc;
    if (sel) { srect(cxp - 44, 20, 88, 1, 14); srect(cxp - 44, 100, 88, 1, 14); srect(cxp - 44, 20, 2, 81, 14); srect(cxp + 42, 20, 2, 81, 14); }
    text(ch.name, cxp - ch.name.length * 4, 106, sel ? 14 : 7);
    text(ch.local, cxp - ch.local.length * 4, 115, sel ? 11 : 8);
  });
  const lines = wrap(CHARS[S.pc].pitch, 38);
  lines.forEach((l, i) => text(l, 8, 128 + i * 9, 15));
  if ((tick >> 3) % 2) center("<  >  puis ENTRÉE", 186, 11);
}
// ---------- boucle principale ----------
let tick = 0, cursorOn = true;
const kbd = document.getElementById("kbd");

function update() {
  tick++;
  if (S.mode !== "play" || Q.length || overlay || menu || S.dead || S.won) return;
  S.t += 0.1;
  if (S.pot === "brewing" && S.t >= S.brewEnd) { S.pot = "coffee"; play(SFX.beep); say("La cafetière lâche un dernier gargouillis triomphant. Le café est prêt. " + (S.room === "lounge" ? B().name + " renifle l'air comme un chien de chasse." : "")); }
  const pa = (k, at, msg) => { if (S.t >= at && !S.warned[k]) { S.warned[k] = 1; play(SFX.pa); say(msg); } };
  pa("10", 600, "*DING DONG* « Bonjour, ici Mme D, votre... directrice. Rappel : réunion ce midi, local... euh... je vous redis ça. Présence obligatoire. Je compterai les têtes. Merci de votre performance. »");
  pa("5", 900, "*DING DONG* « Cinq minutes avant la cloche. Aussi : si quelqu'un trouve mon bureau, merci de me le signaler. »");
  pa("1", 1140, "*DING DONG* « UNE minute. » Quelque part, trente-deux élèves de secondaire 4 sont déjà au local " + P().local + ". Sans surveillance. Ça sent le brûlé.");
  if (S.t >= BELL && !Q.length) {
    play(SFX.bell);
    return die("DRIIIIIIIIING !\n\nLa cloche de 8 h sonne. Trente-deux élèves de secondaire 4 attendent au local " + P().local + ", sans prof et sans examen.\n\nQuand vous arrivez, ils ont formé un gouvernement provisoire. Mme D trouve que ça paraît bien dans le rapport : « initiative étudiante ». Vous, vous êtes dans le rapport aussi.");
  }
  let dx = 0, dy = 0;
  if (S.target) {
    const tx = S.target.x - S.x, ty = S.target.y - S.y;
    if (Math.abs(tx) <= 1 && Math.abs(ty) <= 1) S.target = null;
    else { dx = Math.sign(tx) * (Math.abs(tx) > 1 ? 1 : 0); dy = Math.sign(ty) * (Math.abs(ty) > 1 ? 1 : 0); S.face = Math.abs(tx) > Math.abs(ty) * 1.2 ? (tx > 0 ? "right" : "left") : (ty > 0 ? "down" : "up"); }
  } else if (S.dir) {
    dx = S.dir.includes("left") ? -1 : S.dir.includes("right") ? 1 : 0;
    dy = S.dir.includes("up") ? -1 : S.dir.includes("down") ? 1 : 0;
  }
  if (dx || dy) {
    const R = ROOMS[S.room]; const nx = S.x + dx, ny = S.y + dy;
    if (R.exit(nx, ny)) { S.target = null; return; }
    if (R.walk(nx, ny)) { S.x = nx; S.y = ny; S.step++; if (S.step % 2 === 0) S.frame++; }
    else if (S.target && dx && dy && R.walk(nx, S.y)) { S.x = nx; S.step++; }
    else if (S.target && dx && dy && R.walk(S.x, ny)) { S.y = ny; S.step++; }
    else { S.dir = null; S.target = null; S.frame = 0; }
  } else S.frame = 0;
}

function render() {
  if (overlay === "inv") { drawInv(); return blit(); }
  if (S.mode === "title") { drawTitle(); return blit(); }
  if (S.mode === "select") { drawSelect(); return blit(); }
  scr.fill(0);
  pic.set(bg);
  const R = ROOMS[S.room];
  R.dyn();
  const layers = R.layers().slice();
  layers.push({ base: S.y, draw() { if (S.dead) drawEgoDown(S.x, S.y); else drawPerson(S.x, S.y, S.face, S.frame, P().c); } });
  layers.sort((a, b) => a.base - b.base).forEach((l) => l.draw());
  for (let y = 0; y < PH; y++) { const so = (y + PIC_Y) * SW, po = y * PW; for (let x = 0; x < PW; x++) { const c = pic[po + x]; scr[so + x * 2] = c; scr[so + x * 2 + 1] = c; } }
  srect(0, 0, SW, 8, 15);
  text(" Score:" + S.score + " sur " + MAX, 0, 0, 0);
  text("Son:" + (S.sound ? "oui" : "non"), 32 * 8, 0, 0);
  if (!S.dead && !S.won) { const ln = ">" + (kbd.value || "").slice(-38); text(ln, 0, 176, 15); if (cursorOn && !Q.length && !menu) text("_", ln.length * 8, 176, 15); }
  if (menu) drawMenu();
  if (Q.length) drawBox(Q[0].text);
  blit();
}
function blit() { for (let i = 0; i < scr.length; i++) img32[i] = PAL32[scr[i]]; cx.putImageData(img, 0, 0); }

let acc = 0, lastT = performance.now();
function loop(now) {
  acc += Math.min(250, now - lastT); lastT = now;
  while (acc >= 50) { update(); acc -= 50; if (tick % 8 === 0) cursorOn = !cursorOn; }
  render();
  requestAnimationFrame(loop);
}

// ---------- entrées ----------
const DIRS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Home: "upleft", PageUp: "upright", End: "downleft", PageDown: "downright" };
function submit() {
  const raw = kbd.value.trim(); kbd.value = "";
  if (!raw) return;
  S.last = raw;
  const p = parse(raw);
  if (!p) return;
  if (p.err) return say(p.err);
  act(p.v, p.N, p.num, p.move);
}
function startGame() { play(SFX.door); S.mode = "play"; buildBg(); intro(); }
function key(k) {
  if (S.mode === "title") {
    if (k === "Enter" || k === " ") { audio(); play(SFX.theme); S.mode = "select"; }
    return true;
  }
  if (S.mode === "select") {
    if (k === "ArrowLeft") { S.pc = (S.pc + 2) % 3; play(SFX.select); }
    else if (k === "ArrowRight") { S.pc = (S.pc + 1) % 3; play(SFX.select); }
    else if (k === "Enter" || k === " ") startGame();
    return true;
  }
  if (overlay) { overlay = null; return true; }
  if (Q.length) {
    if (k === "Enter" || k === "Escape" || k === " ") {
      const m = Q.shift();
      if (k === "Escape" && m.esc) m.esc(); else if (k !== "Escape" && m.enter) m.enter();
    }
    return true;
  }
  if (menu) {
    const m = MENUS[menu.m];
    if (k === "ArrowLeft") { menu.m = (menu.m + MENUS.length - 1) % MENUS.length; menu.i = 0; }
    else if (k === "ArrowRight") { menu.m = (menu.m + 1) % MENUS.length; menu.i = 0; }
    else if (k === "ArrowUp") menu.i = (menu.i + m.items.length - 1) % m.items.length;
    else if (k === "ArrowDown") menu.i = (menu.i + 1) % m.items.length;
    else if (k === "Enter") { const fn = m.items[menu.i][1]; menu = null; fn(); }
    else if (k === "Escape") menu = null;
    return true;
  }
  if (S.dead || S.won) return true;
  if (DIRS[k]) { S.target = null; const d = DIRS[k]; if (S.dir === d) S.dir = null; else { S.dir = d; S.face = d.includes("left") ? "left" : d.includes("right") ? "right" : d; } return true; }
  if (k === "Clear") { S.dir = null; return true; }
  if (k === "Enter") { submit(); return true; }
  if (k === "Escape") { menu = { m: 0, i: 0 }; return true; }
  if (k === "Tab") { showInv(); return true; }
  if (k === "F2") { S.sound = !S.sound; return true; }
  if (k === "F3") { kbd.value = S.last || ""; return true; }
  if (k === "F5") { saveGame(); return true; }
  if (k === "F7") { restoreGame(); return true; }
  if (k === "F9") { confirmRestart(); return true; }
  return false;
}
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (key(e.key)) { e.preventDefault(); return; }
  if (e.key.length === 1 && document.activeElement !== kbd) { kbd.focus(); if (kbd.value.length < 60) kbd.value += e.key; e.preventDefault(); }
}, true);
kbd.addEventListener("input", () => {
  if (Q.length || overlay || menu || S.mode !== "play" || S.dead || S.won) kbd.value = "";
});

cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); audio();
  const r = cv.getBoundingClientRect();
  const sx = Math.floor((e.clientX - r.left) / r.width * SW), sy = Math.floor((e.clientY - r.top) / r.height * SH);
  if (S.mode === "select") { const i = Math.max(0, Math.min(2, Math.floor(sx / (SW / 3)))); if (i === S.pc) startGame(); else { S.pc = i; play(SFX.select); } return; }
  if (S.mode === "title" || overlay || Q.length) { key("Enter"); return; }
  if (menu) { menu = null; return; }
  if (S.dead || S.won) return;
  if (sy >= 176) { keepKbd = true; kbd.focus(); return; }
  const px = Math.floor(sx / 2), py = sy - PIC_Y;
  if (py >= 0 && py < PH) { S.dir = null; S.target = { x: px, y: Math.max(100, py) }; }
});
function padPress(b) {
  const k = b.dataset.k; audio();
  if (k === "type") { toggleKbd(); return; }
  key(k);
}
document.getElementById("pad").addEventListener("pointerdown", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  e.preventDefault(); padPress(b);
});
document.getElementById("pad").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (b && e.detail === 0) padPress(b); // activation au clavier
});

// Le clavier (mobile) reste ouvert : les taps sur l'écran et les boutons ne lui volent plus le focus.
let keepKbd = false;
kbd.addEventListener("focus", () => { keepKbd = true; });
kbd.addEventListener("blur", () => { if (keepKbd) setTimeout(() => { if (keepKbd && document.activeElement !== kbd) kbd.focus({ preventScroll: true }); }, 0); });
for (const el of [cv, document.getElementById("pad")]) {
  el.addEventListener("mousedown", (e) => e.preventDefault());
  el.addEventListener("touchstart", (e) => { if (document.activeElement === kbd) e.preventDefault(); }, { passive: false });
}
function toggleKbd() { if (document.activeElement === kbd) { keepKbd = false; kbd.blur(); } else { keepKbd = true; kbd.focus(); } }

buildBg();
requestAnimationFrame(loop);
</script>
</body>
</html>
