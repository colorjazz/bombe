<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Salle de profs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Mise en page : un écran EGA 4:3 centré sur un bureau sombre, une ligne de touches dessous. */
  :root {
    --desk: #0b0b10;
    --bezel: #1c1c24;
    --bezel-edge: #34343f;
    --legend: #8a8aa0;
    --key: #55ffff;
    --btn: #2a2a36;
    --btn-fg: #ffffff;
    --font-legend: "VT323", "Lucida Console", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--btn-fg);
    font-family: var(--font-legend);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    overflow-x: hidden;
  }
  .monitor {
    width: min(100%, 960px, calc((100vh - 120px) * 4 / 3));
    padding: 10px;
    background: var(--bezel);
    border: 2px solid var(--bezel-edge);
    border-radius: 6px;
    box-sizing: border-box;
    position: relative;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    cursor: pointer;
    touch-action: manipulation;
  }
  #kbd {
    position: absolute;
    left: 0; bottom: 0;
    width: 1px; height: 1px;
    opacity: 0;
    border: 0; padding: 0;
    font-size: 16px;
  }
  .legend {
    color: var(--legend);
    font-size: 20px;
    text-align: center;
    line-height: 1.2;
    max-width: 960px;
  }
  .legend b { color: var(--key); font-weight: normal; }
  .pad { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .pad button {
    font-family: var(--font-legend);
    font-size: 22px;
    min-width: 52px; min-height: 44px;
    background: var(--btn);
    color: var(--btn-fg);
    border: 2px solid var(--bezel-edge);
    border-radius: 4px;
  }
  .pad button:focus-visible { outline: 2px solid var(--key); }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<div class="monitor">
  <canvas id="screen" width="320" height="200" aria-label="Écran du jeu Salle de profs"></canvas>
  <input id="kbd" type="text" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Tapez un ordre">
</div>
<div class="pad" id="pad">
  <button data-k="ArrowLeft" aria-label="Aller à gauche">&larr;</button>
  <button data-k="ArrowUp" aria-label="Monter">&uarr;</button>
  <button data-k="ArrowDown" aria-label="Descendre">&darr;</button>
  <button data-k="ArrowRight" aria-label="Aller à droite">&rarr;</button>
  <button data-k="type">Clavier</button>
  <button data-k="Enter">Entrée</button>
  <button data-k="Tab">Objets</button>
  <button data-k="Escape">Menu</button>
</div>
<div class="legend"><b>Flèches</b> marcher &middot; tapez un ordre + <b>Entrée</b> &middot; <b>Tab</b> inventaire &middot; <b>Échap</b> menu &middot; <b>F3</b> répéter &middot; <b>F5</b>/<b>F7</b> sauver/restaurer</div>

<script>
"use strict";
// ============================================================
//  SALLE DE PROFS - trois glandeurs, une photocopieuse, Mme D.
//  Hommage aux aventures Sierra AGI de 1987 (Police Quest).
//  320x200 EGA, image 160x168 en pixels doubles, police 8x8.
// ============================================================

// ---------- palette EGA ----------
const PAL = [0x000000,0x0000AA,0x00AA00,0x00AAAA,0xAA0000,0xAA00AA,0xAA5500,0xAAAAAA,
             0x555555,0x5555FF,0x55FF55,0x55FFFF,0xFF5555,0xFF55FF,0xFFFF55,0xFFFFFF];
const PAL32 = new Uint32Array(16);
for (let i = 0; i < 16; i++) { const c = PAL[i]; PAL32[i] = 0xFF000000 | ((c & 0xFF) << 16) | (c & 0xFF00) | ((c >> 16) & 0xFF); }

// ---------- police 8x8 (VGA IBM, domaine public, via font8x8) ----------
const FONT_HEX = "0000000000000000183c3c1818001800363600000000000036367f367f3636000c3e031e301f0c00006333180c6663001c361c6e3b336e000606030000000000180c0606060c1800060c1818180c060000663cff3c660000000c0c3f0c0c000000000000000c0c060000003f0000000000000000000c0c006030180c060301003e63737b6f673e000c0e0c0c0c0c3f001e33301c06333f001e33301c30331e00383c36337f3078003f031f3030331e001c06031f33331e003f3330180c0c0c001e33331e33331e001e33333e30180e00000c0c00000c0c00000c0c00000c0c06180c0603060c180000003f00003f0000060c1830180c06001e3330180c000c003e637b7b7b031e000c1e33333f3333003f66663e66663f003c66030303663c001f36666666361f007f46161e16467f007f46161e16060f003c66030373667c003333333f333333001e0c0c0c0c0c1e007830303033331e006766361e366667000f06060646667f0063777f7f6b63630063676f7b736363001c36636363361c003f66663e06060f001e3333333b1e38003f66663e366667001e33070e38331e003f2d0c0c0c0c1e003333333333333f0033333333331e0c006363636b7f7763006363361c1c3663003333331e0c0c1e007f6331184c667f001e06060606061e0003060c18306040001e18181818181e00081c36630000000000000000000000ff0c0c18000000000000001e303e336e000706063e66663b0000001e3303331e003830303e33336e0000001e333f031e001c36060f06060f0000006e33333e301f0706366e666667000c000e0c0c0c1e00300030303033331e070666361e3667000e0c0c0c0c0c1e000000337f7f6b630000001f333333330000001e3333331e0000003b66663e060f00006e33333e307800003b6e66060f0000003e031e301f00080c3e0c0c2c18000000333333336e0000003333331e0c000000636b7f7f3600000063361c36630000003333333e301f00003f190c263f00380c0c070c0c38001818180018181800070c0c380c0c07006e3b000000000000";
const FONT_EXT = "0000000000000000181800181818180018187e03037e18181c36260f06673f000000633e363e630033331e3f0c3f0c0c18181800181818007cc61c36361c331e33000000000000003c4299858599423c3c36367c0000000000cc663366cc00000000003f3030000000000000000000003c429da59da5423c7e000000000000001c36361c0000000018187e1818007e001c30180c3c0000001c3018301c000000180c00000000000000006666663e0603fedbdbded8d8d8000000001818000000000000000018301e080c081c000000001c36361c00000000003366cc66330000c36333bdecf6f303c363337bcc6633f003c463b4dbace6800c000c0603331e0007001c36637f630070001c36637f63001c36003e637f63006e3b003e637f6300631c36637f6363000c0c001e333f33007c36337f333373001e3303331e18301e07003f061e063f0038003f061e063f000c123f061e063f0036003f061e063f0007001e0c0c0c1e0038001e0c0c0c1e000c12001e0c0c1e0033001e0c0c0c1e003f666f6f66663f003f0033373f3b33000e00183c663c18007000183c663c18003c66183c663c18006e3b003e63633e00c3183c66663c180000361c081c3600005c36737b6f361d000e00666666663c007000666666663c003c66006666663c003300333333331e00700066663c1818000f063e66663e060f001e331f331f030307001e303e337e0038001e303e337e007ec33c607c66fc006e3b1e303e337e0033001e303e337e000c0c1e303e337e000000fe30fe33fe0000001e03031e301c07001e333f031e0038001e333f031e007ec33c667e063c0033001e333f031e0007000e0c0c0c1e001c000e0c0c0c1e003e631c1818183c0033000e0c0c0c1e001b0e1b303e331e00001f001f333333000007001e33331e000038001e33331e001e33001e33331e006e3b001e33331e000033001e33331e001818007e0018180000603c767e6e3c060007003333337e000038003333337e001e33003333337e000033003333337e0000380033333e301f0000063e663e060000330033333e301f";
const FONT = {};
for (let i = 0; i < 95; i++) { const g = []; for (let r = 0; r < 8; r++) g.push(parseInt(FONT_HEX.substr(i * 16 + r * 2, 2), 16)); FONT[32 + i] = g; }
for (let i = 0; i < 96; i++) { const g = []; for (let r = 0; r < 8; r++) g.push(parseInt(FONT_EXT.substr(i * 16 + r * 2, 2), 16)); FONT[160 + i] = g; }

// ---------- tampons d'écran ----------
const SW = 320, SH = 200, PW = 160, PH = 168, PIC_Y = 8;
const scr = new Uint8Array(SW * SH);
const pic = new Uint8Array(PW * PH);
let bg = new Uint8Array(PW * PH);
const cv = document.getElementById("screen");
const cx = cv.getContext("2d");
const img = cx.createImageData(SW, SH);
const img32 = new Uint32Array(img.data.buffer);

function pset(x, y, c) { x |= 0; y |= 0; if (x < 0 || x >= PW || y < 0 || y >= PH) return; pic[y * PW + x] = c; }
function rect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) pset(i, j, c); }
function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
function line(x0, y0, x1, y1, c) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) { pset(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function ellipse(cx0, cy0, rx, ry, c) {
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx + 0.5) + (y * y) / (ry * ry + 0.5) <= 1) pset(cx0 + x, cy0 + y, c);
}
function sset(x, y, c) { if (x < 0 || x >= SW || y < 0 || y >= SH) return; scr[y * SW + x] = c; }
function srect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) sset(i, j, c); }
function glyph(ch, x, y, fg, bgc, sx = 1, sy = 1) {
  const g = FONT[ch.charCodeAt(0)] || FONT[63];
  for (let r = 0; r < 8; r++) for (let b = 0; b < 8; b++) {
    const on = (g[r] >> b) & 1;
    if (on) srect(x + b * sx, y + r * sy, sx, sy, fg);
    else if (bgc >= 0) srect(x + b * sx, y + r * sy, sx, sy, bgc);
  }
}
function text(str, x, y, fg, bgc = -1, sx = 1, sy = 1) {
  // majuscules accentuées : la police 8x8 les écrase, on fait comme les jeux de l'époque
  str = str.replace(/[\u00c0-\u00dd]/g, (ch) => ch.normalize("NFD")[0]);
  for (let i = 0; i < str.length; i++) glyph(str[i], x + i * 8 * sx, y, fg, bgc, sx, sy); }
const center = (str, y, fg, sx = 1, sy = 1) => text(str, Math.floor((SW - str.length * 8 * sx) / 2), y, fg, -1, sx, sy);

// ---------- son : haut-parleur PC à une voix ----------
let actx = null, voice = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
const NOTE = (n) => { const m = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }; const r = /^([A-G])(#|b)?(\d)$/.exec(n); let s = m[r[1]] + (r[2] === "#" ? 1 : r[2] === "b" ? -1 : 0) + (parseInt(r[3]) - 4) * 12; return 440 * Math.pow(2, s / 12); };
function play(seq, tempo = 1) {
  if (!S || !S.sound) return;
  const a = audio(); if (!a) return;
  try { if (voice) { voice.stop(); voice = null; } } catch (e) {}
  const o = a.createOscillator(), g = a.createGain();
  o.type = "square"; g.gain.value = 0; o.connect(g); g.connect(a.destination);
  let t = a.currentTime + 0.02;
  for (const [n, d] of seq) {
    const dur = (d / 1000) * tempo;
    if (n) { o.frequency.setValueAtTime(typeof n === "number" ? n : NOTE(n), t); g.gain.setValueAtTime(0.045, t); g.gain.setValueAtTime(0, t + dur * 0.9); }
    else g.gain.setValueAtTime(0, t);
    t += dur;
  }
  o.start(); o.stop(t + 0.05); voice = o;
}
const SFX = {
  theme: [["C5",160],["C5",160],["G4",160],["A4",320],["G4",320],[0,80],["B4",160],["C5",160],["D5",160],["E5",320],["D5",160],["C5",160],["A4",160],["G4",480],[0,160],["E4",160],["F4",160],["G4",160],["C5",320],["B4",160],["C5",640]],
  points: [["C5",50],["E5",50],["G5",50],["C6",110]],
  door: [[110,60],[0,30],[90,90]],
  death: [["G4",260],["F#4",260],["F4",260],["E4",700]],
  pa: [["E5",350],["C5",600]],
  bell: Array.from({ length: 30 }, (_, i) => [i % 2 ? 1400 : 1600, 50]),
  win: [["C5",120],["E5",120],["G5",120],["C6",240],["G5",120],["C6",480]],
  beep: [[880,80]],
  bad: [[160,180]],
  select: [[660,40]],
};

// ---------- les trois glandeurs ----------
const CHARS = [
  { id: "jp", name: "chat-JP", subj: "SVT", de: "de SVT", style: "ears",
    c: { hair: 0, skin: 12, shirt: 15, vest: 2, tie: 10, pants: 8, shoes: 0, style: "ears" },
    pitch: "Prof de SVT. Dort quatorze heures par jour, comme un chat. Retombe toujours sur ses pattes, surtout pour esquiver une réunion.",
    desc: "chat-JP, prof de SVT. Un serre-tête à oreilles de chat, un pull vert, et l'énergie d'un félin à 14h un dimanche.",
    quiz: "Interro de SVT : « La photosynthèse ». Question 1 : Pourquoi les plantes sont-elles vertes ? Question 2 : Non, sérieusement, pourquoi ?" },
  { id: "guy", name: "Guy-Homie", subj: "EPS", de: "d'EPS", style: "cap",
    c: { hair: 0, skin: 6, shirt: 4, vest: 4, tie: 15, pants: 1, shoes: 15, cap: 9, style: "cap" },
    pitch: "Prof d'EPS. Casquette à l'envers, sifflet au cou. Son programme annuel : « Allez, on fait un foot. »",
    desc: "Guy-Homie, prof d'EPS. Casquette à l'envers, sweat rouge, sifflet autour du cou et des baskets qui n'ont jamais couru.",
    quiz: "Interro écrite d'EPS : « Les règles du handball ». Question 1 : Combien de joueurs ? Question 2 : C'est quoi, un ballon ?" },
  { id: "crispy", name: "Crispy", subj: "français", de: "de français", style: "spiky",
    c: { hair: 14, skin: 12, shirt: 15, vest: 13, tie: 5, pants: 8, shoes: 0, style: "spiky" },
    pitch: "Prof de français. Corrige au pifomètre : la note dépend du poids de la copie. Les copies lourdes ont 14.",
    desc: "Crispy, prof de français. Cheveux blonds en pétard, gilet rose, et un stylo rouge qui n'a jamais servi.",
    quiz: "Interro de français : « Le passé simple ». Question 1 : Conjuguez « résoudre ». Question 2 : Pleurez." },
];
const MME_D = { hair: 7, skin: 12, shirt: 15, vest: 6, tie: 15, pants: 6, shoes: 0, style: "bun", glasses: true, skirt: true };

// ---------- état du jeu ----------
const POINTS = { signin: 5, board: 1, water: 1, camera: 1, wake: 2, memo: 2, readmemo: 3, key: 5, mug: 3, filter: 3, grounds: 3,
  fillpot: 5, brew: 5, pour: 5, milk: 2, gift: 10, donut: 3, unlock: 5, paper: 5, unplug: 5, jam: 5,
  plugin: 2, loadpaper: 5, code: 5, copy: 10, deliver: 10 };
const MAX = Object.values(POINTS).reduce((a, b) => a + b, 0);
const BELL = 1200; // secondes de jeu entre 7h40 et 8h00

let S = null;
function newState() {
  return {
    mode: "title", pc: 0, room: "hall", x: 22, y: 140, face: "down", dir: null, frame: 0, step: 0, target: null,
    score: 0, got: {}, sound: (S && S.sound === false) ? false : true,
    inv: ["quiz", "pen"], mug: null, pot: "sludge", brewEnd: 0,
    signed: false, fridgeOpen: false, cabinetOpen: false, supplyUnlocked: false,
    copier: { plugged: true, jam: true, paper: false, code: false },
    happy: false, knowsCode: false, donutWarned: false, donut: true, awake: false, blocked: false,
    code: String(1000 + Math.floor(Math.random() * 9000)),
    t: 0, warned: {}, dead: false, won: false, last: "",
  };
}
S = newState();
const P = () => CHARS[S.pc];
const OTH = () => CHARS.filter((c, i) => i !== S.pc);
const B = () => OTH()[0]; // à table, accro au café, connaît le code
const C = () => OTH()[1]; // sur le canapé, en « réunion »
const has = (it) => S.inv.includes(it);
const give = (it) => { if (!has(it)) S.inv.push(it); };
const lose = (it) => { S.inv = S.inv.filter((i) => i !== it); };
function award(key) { if (S.got[key]) return; S.got[key] = 1; S.score += POINTS[key]; play(SFX.points); }
function clockStr() { const s = Math.min(BELL, Math.floor(S.t)); const m = 40 + Math.floor(s / 60); return m >= 60 ? "8h00" : "7h" + String(m).padStart(2, "0"); }

// ---------- boîtes de message ----------
const Q = [];
function say(msg, opt = {}) { Q.push(Object.assign({ text: msg }, opt)); }
function wrap(str, width = 30) {
  const out = [];
  for (const para of str.split("\n")) {
    if (para === "") { out.push(""); continue; }
    let l = "";
    for (const w of para.split(" ")) {
      if ((l + (l ? " " : "") + w).length > width) { out.push(l); l = w; } else l += (l ? " " : "") + w;
    }
    out.push(l);
  }
  return out;
}
function drawBox(msg) {
  // espaces insécables avant la ponctuation haute, à la française
  const lines = wrap(msg.replace(/ ([:;!?»])/g, " $1").replace(/« /g, "« "));
  const cols = Math.max(...lines.map((l) => l.length), 1), rows = lines.length;
  const w = cols * 8, h = rows * 8;
  const x0 = Math.floor((SW - w) / 2 / 8) * 8, y0 = PIC_Y + Math.max(4, Math.floor((PH - h) / 2 / 8) * 8);
  srect(x0 - 10, y0 - 6, w + 20, h + 12, 15);
  srect(x0 - 7, y0 - 4, w + 14, 1, 4); srect(x0 - 7, y0 + h + 3, w + 14, 1, 4);
  srect(x0 - 8, y0 - 4, 2, h + 8, 4); srect(x0 + w + 6, y0 - 4, 2, h + 8, 4);
  lines.forEach((l, i) => text(l, x0, y0 + i * 8, 0));
}

// ---------- personnages ----------
function headExtras(x, T, c, f) {
  if (c.style === "ears") { pset(x - 2, T - 1, c.hair); pset(x + 2, T - 1, c.hair); pset(x - 2, T - 2, c.hair); pset(x + 2, T - 2, c.hair); }
  if (c.style === "spiky") { pset(x - 2, T - 1, c.hair); pset(x, T - 2, c.hair); pset(x, T - 1, c.hair); pset(x + 2, T - 1, c.hair); pset(x + 1, T - 1, c.hair); }
  if (c.style === "cap") {
    rect(x - 2, T - 1, 5, 2, c.cap);
    if (f === "left") pset(x + 3, T, c.cap); else if (f === "right") pset(x - 3, T, c.cap); else if (f === "up") rect(x - 1, T + 1, 3, 1, c.cap);
  }
  if (c.style === "bun") { rect(x - 1, T - 2, 3, 2, c.hair); }
}
function drawPerson(x, y, f, fr, c) {
  const T = y - 27, wk = fr % 4;
  const side = f === "left" || f === "right";
  if (side) {
    const d = f === "right" ? 1 : -1;
    rect(x - 2, T, 5, 2, c.hair);
    rect(x - 2, T + 2, 5, 4, c.skin);
    rect(d > 0 ? x - 2 : x + 1, T + 2, 2, 3, c.hair);
    pset(x + d, T + 3, 0);
    if (c.glasses) pset(x + 2 * d, T + 3, 0);
    pset(x, T + 6, c.skin);
    rect(x - 2, T + 7, 5, 10, c.vest);
    const sw = wk === 1 ? 1 : wk === 3 ? -1 : 0;
    line(x, T + 8, x + sw * d, T + 15, c.shirt === c.vest ? 0 : c.shirt); pset(x + sw * d, T + 16, c.skin);
    rect(x - 2, T + 17, 5, 1, c.pants);
    const legc = c.skirt ? 8 : c.pants;
    if (c.skirt) rect(x - 2, T + 17, 5, 5, c.pants);
    if (wk === 1 || wk === 3) {
      line(x - 1, T + 21, x - 2 - d, T + 26, legc); line(x, T + 21, x - 1 - d, T + 26, legc);
      line(x, T + 21, x + 1 + d, T + 26, legc); line(x + 1, T + 21, x + 2 + d, T + 26, legc);
      if (!c.skirt) { rect(x - 1, T + 18, 3, 3, c.pants); }
      rect(x - 2 - d + (d > 0 ? 0 : -1), T + 27, 3, 1, c.shoes); rect(x + 1 + d + (d > 0 ? 0 : -1), T + 27, 3, 1, c.shoes);
    } else {
      rect(x - 1, T + (c.skirt ? 22 : 18), 3, c.skirt ? 5 : 9, legc);
      rect(d > 0 ? x - 1 : x - 2, T + 27, 4, 1, c.shoes);
    }
    headExtras(x, T, c, f);
    return;

const DUAL = { copier: ["copyv", "copier"], copie: ["copyv", "copies"], photocopie: ["copyv", "copies"], tape: ["type", "type"] };
const VERBS = new Set(["look","read","take","drop","open","close","talk","hello","ask","give","sign","use","fill","make","pour","drink","eat","unplug","plugv","fix","load","type","enter","unlock","lock","copyv","sit","stand","smell","wait","empty","wake","inventory","score","help","save","restore","restart","quit","sound","kill","insult","kiss","knock","listen","go","swear","thank","yell","dance","meow","whistle","joke","strike"]);

function parse(raw) {
  let s = " " + strip(raw.toLowerCase()).replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim() + " ";
  s = s.replace(/ faire (des |les |une |la )?(photo)?cop(ie|ies) /g, " photocopier interro ")
       .replace(/ tirer (sur )?(la |le )?(prise|cordon|fil) /g, " debrancher photocopieuse ")
       .replace(/ regarder autour /g, " regarder salle ").replace(/ quelle heure /g, " regarder horloge ")
       .replace(/ mot de passe /g, " code ").replace(/ micro ondes /g, " micro ")
       .replace(/ pains? au chocolat /g, " pain ").replace(/ machine a cafe /g, " cafetiere ")
       .replace(/ salle des profs /g, " profs ").replace(/ jambon beurre /g, " sandwich ")
       .replace(/ casiers? des eleves /g, " vestiaire ").replace(/ casiers? des profs /g, " casier ")
       .replace(/ boite aux lettres /g, " casier ").replace(/ cafe moulu /g, " moulu ")
       .replace(/ regarder (la )?camera /g, " regarder camera ").replace(/ face camera /g, " camera ")
       .replace(/ jeu de mots /g, " blague ").replace(/ faire (une )?blague /g, " blague ")
       .replace(/ faire (la )?greve /g, " greve ").replace(/ faire (une )?sieste /g, " sieste ");
  const words = s.trim().split(" ").filter(Boolean);
  if (!words.length) return null;
  const toks = []; let num = null;
  for (const w of words) {
    if (/^\d+$/.test(w)) { num = w; continue; }
    if (DUAL[w]) { toks.push(toks.length === 0 ? DUAL[w][0] : DUAL[w][1]); continue; }
    if (VOC[w]) { toks.push(VOC[w]); continue; }
    if (FILLER.has(w)) continue;
    return { err: "Je ne comprends pas « " + w + " »." };
  }
  let v = null; const N = [];
  for (const t of toks) { if (!v && VERBS.has(t)) v = t; else N.push(t); }
  if (!v && num) v = "type";
  if (!v && N.length) v = N[0] === "camera" ? "look" : "look";
  if (!v) return { err: "Hein ?" };
  return { v, N: resolve(N), num };
}
function nearest(names) {
  const sp = ROOMS[S.room].spots; let best = names[0], bd = 1e9;
  for (const n of names) if (sp[n]) { const d = distTo(sp[n]); if (d < bd) { bd = d; best = n; } }
  return best;
}
function resolve(N) {
  const L = S.room === "lounge";
  const ids = { c_jp: "jp", c_guy: "guy", c_crispy: "crispy" };
  let out = N.map((n) => {
    if (ids[n]) { const id = ids[n]; return id === P().id ? "me" : id === B().id ? "npcB" : "npcC"; }
    if (n === "machine") return N.includes("copier") || N.includes("copyv") ? "copier" : N.includes("coffee") ? "maker" : L ? nearest(["copier", "maker"]) : "machine";
    if (n === "box") return N.includes("grounds") || N.includes("coffee") ? "grounds" : L ? "donut" : "mailbox";
    if (n === "person") return L ? nearest(["npcB", "npcC"]) : "mmeD";
    if (n === "cabinet") return N.includes("supply") ? "supply" : L ? nearest(["cabinet", "supply"]) : "locker";
    if (n === "water") return L ? "water" : "fountain";
    if (n === "lounge") return L ? "room" : "door";
    if (n === "hall") return L ? "door" : "room";
    if (n === "copyv") return "copier";
    if (n === "feuille") return L ? "paper" : "sheet";
    if (n === "affiche") return L ? "poster" : "board";
    if (n === "mailbox" && N.includes("class")) return "locker";
    return n;
  });
  if (out.includes("door")) out = out.filter((n) => n !== "room");
  if (out.includes("locker")) out = out.filter((n) => n !== "class");
  if (out.includes("maker")) out = out.filter((n) => n !== "coffee");
  if (out.includes("grounds")) out = out.filter((n) => n !== "coffee");
  return out.filter((n, i, a) => a.indexOf(n) === i);
}

// ---------- boucle principale ----------
let tick = 0, cursorOn = true;
const kbd = document.getElementById("kbd");

function update() {
  tick++;
  if (S.mode !== "play" || Q.length || overlay || menu || S.dead || S.won) return;
  S.t += 0.1;
  if (S.pot === "brewing" && S.t >= S.brewEnd) { S.pot = "coffee"; play(SFX.beep); say("La cafetière lâche un dernier gargouillis triomphant. Le café est prêt. " + (S.room === "lounge" ? B().name + " renifle l'air comme un chien de chasse." : "")); }
  const pa = (k, at, msg) => { if (S.t >= at && !S.warned[k]) { S.warned[k] = 1; play(SFX.pa); say(msg); } };
  pa("10", 600, "*DING DONG* « Ici Mme D. Sonnerie dans dix minutes. Les professeurs qui traînent en salle des profs seront notés. Je sais qui vous êtes. »");
  pa("5", 900, "*DING DONG* « Cinq minutes. " + C().name + ", je vous entends ronfler depuis mon bureau. »");
  pa("1", 1140, "*DING DONG* « UNE minute. » Quelque part, trente-deux élèves de 4e sont déjà en salle 112. Sans surveillance. Ça sent le roussi.");
  if (S.t >= BELL && !Q.length) {
    play(SFX.bell);
    return die("DRIIIIIIIIING !\n\nLa sonnerie de 8h00 retentit. Trente-deux élèves de 4e attendent en salle 112, sans prof et sans interro.\n\nQuand vous arrivez, ils ont formé un gouvernement provisoire. Mme D en est la présidente. Vous n'en faites pas partie.");
  }
  let dx = 0, dy = 0;
  if (S.target) {
    const tx = S.target.x - S.x, ty = S.target.y - S.y;
    if (Math.abs(tx) <= 1 && Math.abs(ty) <= 1) S.target = null;
    else { dx = Math.sign(tx) * (Math.abs(tx) > 1 ? 1 : 0); dy = Math.sign(ty) * (Math.abs(ty) > 1 ? 1 : 0); S.face = Math.abs(tx) > Math.abs(ty) * 1.2 ? (tx > 0 ? "right" : "left") : (ty > 0 ? "down" : "up"); }
  } else if (S.dir) {
    dx = S.dir.includes("left") ? -1 : S.dir.includes("right") ? 1 : 0;
    dy = S.dir.includes("up") ? -1 : S.dir.includes("down") ? 1 : 0;
  }
  if (dx || dy) {
    const R = ROOMS[S.room]; const nx = S.x + dx, ny = S.y + dy;
    if (R.exit(nx, ny)) { S.target = null; return; }
    if (R.walk(nx, ny)) { S.x = nx; S.y = ny; S.step++; if (S.step % 2 === 0) S.frame++; }
    else if (S.target && dx && dy && R.walk(nx, S.y)) { S.x = nx; S.step++; }
    else if (S.target && dx && dy && R.walk(S.x, ny)) { S.y = ny; S.step++; }
    else { S.dir = null; S.target = null; S.frame = 0; }
  } else S.frame = 0;
}

function render() {
  if (overlay === "inv") { drawInv(); return blit(); }
  if (S.mode === "title") { drawTitle(); return blit(); }
  if (S.mode === "select") { drawSelect(); return blit(); }
  scr.fill(0);
  pic.set(bg);
  const R = ROOMS[S.room];
  R.dyn();
  const layers = R.layers().slice();
  layers.push({ base: S.y, draw() { if (S.dead) drawEgoDown(S.x, S.y); else drawPerson(S.x, S.y, S.face, S.frame, P().c); } });
  layers.sort((a, b) => a.base - b.base).forEach((l) => l.draw());
  for (let y = 0; y < PH; y++) { const so = (y + PIC_Y) * SW, po = y * PW; for (let x = 0; x < PW; x++) { const c = pic[po + x]; scr[so + x * 2] = c; scr[so + x * 2 + 1] = c; } }
  srect(0, 0, SW, 8, 15);
  text(" Score:" + S.score + " sur " + MAX, 0, 0, 0);
  text("Son:" + (S.sound ? "oui" : "non"), 32 * 8, 0, 0);
  if (!S.dead && !S.won) { const ln = ">" + (kbd.value || "").slice(-38); text(ln, 0, 176, 15); if (cursorOn && !Q.length && !menu) text("_", ln.length * 8, 176, 15); }
  if (menu) drawMenu();
  if (Q.length) drawBox(Q[0].text);
  blit();
}
function blit() { for (let i = 0; i < scr.length; i++) img32[i] = PAL32[scr[i]]; cx.putImageData(img, 0, 0); }

let acc = 0, lastT = performance.now();
function loop(now) {
  acc += Math.min(250, now - lastT); lastT = now;
  while (acc >= 50) { update(); acc -= 50; if (tick % 8 === 0) cursorOn = !cursorOn; }
  render();
  requestAnimationFrame(loop);
}

// ---------- entrées ----------
const DIRS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Home: "upleft", PageUp: "upright", End: "downleft", PageDown: "downright" };
function submit() {
  const raw = kbd.value.trim(); kbd.value = "";
  if (!raw) return;
  S.last = raw;
  const p = parse(raw);
  if (!p) return;
  if (p.err) return say(p.err);
  act(p.v, p.N, p.num);
}
function startGame() { play(SFX.door); S.mode = "play"; buildBg(); intro(); }
function key(k) {
  if (S.mode === "title") {
    if (k === "Enter" || k === " ") { audio(); play(SFX.theme); S.mode = "select"; }
    return true;
  }
  if (S.mode === "select") {
    if (k === "ArrowLeft") { S.pc = (S.pc + 2) % 3; play(SFX.select); }
    else if (k === "ArrowRight") { S.pc = (S.pc + 1) % 3; play(SFX.select); }
    else if (k === "Enter" || k === " ") startGame();
    return true;
  }
  if (overlay) { overlay = null; return true; }
  if (Q.length) {
    if (k === "Enter" || k === "Escape" || k === " ") {
      const m = Q.shift();
      if (k === "Escape" && m.esc) m.esc(); else if (k !== "Escape" && m.enter) m.enter();
    }
    return true;
  }
  if (menu) {
    const m = MENUS[menu.m];
    if (k === "ArrowLeft") { menu.m = (menu.m + MENUS.length - 1) % MENUS.length; menu.i = 0; }
    else if (k === "ArrowRight") { menu.m = (menu.m + 1) % MENUS.length; menu.i = 0; }
    else if (k === "ArrowUp") menu.i = (menu.i + m.items.length - 1) % m.items.length;
    else if (k === "ArrowDown") menu.i = (menu.i + 1) % m.items.length;
    else if (k === "Enter") { const fn = m.items[menu.i][1]; menu = null; fn(); }
    else if (k === "Escape") menu = null;
    return true;
  }
  if (S.dead || S.won) return true;
  if (DIRS[k]) { S.target = null; const d = DIRS[k]; if (S.dir === d) S.dir = null; else { S.dir = d; S.face = d.includes("left") ? "left" : d.includes("right") ? "right" : d; } return true; }
  if (k === "Clear") { S.dir = null; return true; }
  if (k === "Enter") { submit(); return true; }
  if (k === "Escape") { menu = { m: 0, i: 0 }; return true; }
  if (k === "Tab") { showInv(); return true; }
  if (k === "F2") { S.sound = !S.sound; return true; }
  if (k === "F3") { kbd.value = S.last || ""; return true; }
  if (k === "F5") { saveGame(); return true; }
  if (k === "F7") { restoreGame(); return true; }
  if (k === "F9") { confirmRestart(); return true; }
  return false;
}
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (key(e.key)) { e.preventDefault(); return; }
  if (e.key.length === 1 && document.activeElement !== kbd) { kbd.focus(); if (kbd.value.length < 60) kbd.value += e.key; e.preventDefault(); }
}, true);
kbd.addEventListener("input", () => {
  if (Q.length || overlay || menu || S.mode !== "play" || S.dead || S.won) kbd.value = "";
});

cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); audio();
  const r = cv.getBoundingClientRect();
  const sx = Math.floor((e.clientX - r.left) / r.width * SW), sy = Math.floor((e.clientY - r.top) / r.height * SH);
  if (S.mode === "select") { const i = Math.max(0, Math.min(2, Math.floor(sx / (SW / 3)))); if (i === S.pc) startGame(); else { S.pc = i; play(SFX.select); } return; }
  if (S.mode === "title" || overlay || Q.length) { key("Enter"); return; }
  if (menu) { menu = null; return; }
  if (S.dead || S.won) return;
  if (sy >= 176) { keepKbd = true; kbd.focus(); return; }
  const px = Math.floor(sx / 2), py = sy - PIC_Y;
  if (py >= 0 && py < PH) { S.dir = null; S.target = { x: px, y: Math.max(100, py) }; }
});
function padPress(b) {
  const k = b.dataset.k; audio();
  if (k === "type") { toggleKbd(); return; }
  key(k);
}
document.getElementById("pad").addEventListener("pointerdown", (e) => {

});

// Le clavier (mobile) reste ouvert : les taps sur l'écran et les boutons ne lui volent plus le focus.
let keepKbd = false;
kbd.addEventListener("focus", () => { keepKbd = true; });
kbd.addEventListener("blur", () => { if (keepKbd) setTimeout(() => { if (keepKbd && document.activeElement !== kbd) kbd.focus({ preventScroll: true }); }, 0); });
for (const el of [cv, document.getElementById("pad")]) {
  el.addEventListener("mousedown", (e) => e.preventDefault());
  el.addEventListener("touchstart", (e) => { if (document.activeElement === kbd) e.preventDefault(); }, { passive: false });
}
