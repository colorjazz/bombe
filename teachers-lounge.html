<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teachers' Lounge Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Layout: one 4:3 EGA "monitor" centered on a dark desk, a one-line key legend beneath. */
  :root {
    --desk: #0b0b10;
    --bezel: #1c1c24;
    --bezel-edge: #34343f;
    --legend: #8a8aa0;
    --key: #55ffff;
    --btn: #2a2a36;
    --btn-fg: #ffffff;
    --font-legend: "VT323", "Lucida Console", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--btn-fg);
    font-family: var(--font-legend);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    overflow-x: hidden;
  }
  .monitor {
    width: min(100%, 960px, calc((100vh - 120px) * 4 / 3));
    padding: 10px;
    background: var(--bezel);
    border: 2px solid var(--bezel-edge);
    border-radius: 6px;
    box-sizing: border-box;
    position: relative;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    cursor: pointer;
    touch-action: manipulation;
  }
  #kbd {
    position: absolute;
    left: 0; bottom: 0;
    width: 1px; height: 1px;
    opacity: 0;
    border: 0; padding: 0;
    font-size: 16px; /* avoids iOS zoom on focus */
  }
  .legend {
    color: var(--legend);
    font-size: 20px;
    text-align: center;
    line-height: 1.2;
    max-width: 960px;
  }
  .legend b { color: var(--key); font-weight: normal; }
  .pad { display: none; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .pad button {
    font-family: var(--font-legend);
    font-size: 22px;
    min-width: 52px; min-height: 44px;
    background: var(--btn);
    color: var(--btn-fg);
    border: 2px solid var(--bezel-edge);
    border-radius: 4px;
  }
  .pad button:focus-visible { outline: 2px solid var(--key); }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<div class="monitor">
  <canvas id="screen" width="320" height="200" aria-label="Teachers' Lounge Quest game screen"></canvas>
  <input id="kbd" type="text" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type a command">
</div>
<div class="pad" id="pad">
  <button data-k="ArrowLeft" aria-label="Walk left">&larr;</button>
  <button data-k="ArrowUp" aria-label="Walk up">&uarr;</button>
  <button data-k="ArrowDown" aria-label="Walk down">&darr;</button>
  <button data-k="ArrowRight" aria-label="Walk right">&rarr;</button>
  <button data-k="type">Keyboard</button>
  <button data-k="Enter">Enter</button>
  <button data-k="Tab">Items</button>
  <button data-k="Escape">Menu</button>
</div>
<div class="legend"><b>Arrows</b> walk &middot; type a command + <b>Enter</b> &middot; <b>Tab</b> inventory &middot; <b>Esc</b> menu &middot; <b>F3</b> repeat &middot; <b>F5</b>/<b>F7</b> save/restore</div>

<script>

//  TEACHERS' LOUNGE QUEST - In Pursuit of the Planning Period

// ---------- EGA palette ----------

let S = null;

    case "mailbox": return say((S.got.memo && S.got.key) ? "Your cubby, labeled BONDS, is empty now apart from dust." : "Rows of wooden cubbies, one for each teacher. Yours is labeled BONDS. There's something in it.");
    case "memo": case "key": return say("It's in your mailbox. Why not take it?");
    case "sheet": return say("The faculty sign-in sheet, clipped to the podium. Names so far: KOWALSKI 6:45, PRUITT 7:02, and a line where FEENEY used to go." + (S.signed ? " And yours: BONDS." : " Your name isn't on it yet."));
    case "board": award("board"); return say("The bulletin board: BAKE SALE FRIDAY. LOST HAMSTER, ANSWERS TO 'GERALD'. FACULTY MEETING RESCHEDULED (AGAIN). And a flyer: OFFICER FRIENDLY VISITS LYTTON MIDDLE - BRING YOUR QUESTIONS!");
    case "fountain": return say("A drinking fountain, bolted to the wall at exactly the height of a fourth-grader.");
    case "locker": return say("Rows of blue student lockers. Several are dented. One is humming.");
    case "principal": return say("Dr. Hargrove, principal. Bald head, gray mustache, gray suit, clipboard. He's watching everyone like a hawk watches a field mouse.");
    case "fridge": return S.fridgeOpen ? say("Inside the fridge: " + (S.got.milkTaken ? "" : "a carton of milk, ") + "a meatball sub labeled KOWALSKI - DO NOT TOUCH, and a Tupperware container whose contents have achieved sentience.") : say("A white fridge covered with magnets and a sign: PLEASE LABEL YOUR FOOD. A microwave sits on top.");
    case "lunch": return say(S.fridgeOpen ? "A foot-long meatball sub in wax paper. A label in angry block capitals: KOWALSKI - DO NOT TOUCH. THIS MEANS YOU, PRUITT." : "You don't see that here.");
    case "tupperware": return say(S.fridgeOpen ? "It's moving. Slightly. Close the fridge." : "You don't see that here.");
    case "milk": return say(S.fridgeOpen && !S.got.milkTaken ? "A carton of milk. " + inv.milk : "You don't see that here.");
    case "microwave": return say("Someone microwaved fish in it in 2009. Nobody has used it since. The smell remains.");
    case "coffee": case "pot": case "maker": {
      const p = { sludge: "The pot holds a black tar that was coffee last Tuesday. The burner is still on.", empty: "The pot is empty.", water: "The pot is full of clean water.", brewing: "The coffee is brewing. It gurgles hopefully.", coffee: "A full pot of fresh, hot coffee. It smells like hope." }[S.pot];
      return say("An ancient drip coffee maker. " + p);
    }
    case "filter": case "grounds": return say(S.cabinetOpen ? "It's in the cabinet above the counter." : "You don't see that here.");
    case "cabinet": return say(S.cabinetOpen ? "The cabinet holds" + (S.got.filter ? "" : " a box of coffee filters,") + (S.got.grounds ? "" : " a can of coffee grounds,") + " and a packet of sweetener from 1994." : "Wooden cabinets above the counter. They aren't locked.");
    case "supply": return say(S.supplyUnlocked ? "The supply cabinet is open. " + (S.got.paper ? "Staplers, toner, and chalk nobody has used since 1991." : "There is a fresh ream of copy paper on the top shelf.") : "A tall gray metal supply cabinet. It's locked. Dr. Hargrove keeps the good paper under lock and key.");
    case "paper": return say(S.supplyUnlocked && !S.got.paper ? "A ream of copy paper in the supply cabinet." : S.copier.paper ? "The copier tray is loaded with paper." : "You don't see any paper here.");
    case "copier": case "jam": return say("A beige copier the size of a small car. A sticker says DO NOT KICK. Its display " + (copierDisplay() === "dark" ? "is dark. It's unplugged." : "reads: " + copierDisplay() + ".") + (S.copier.jam ? " You can see a crumpled sheet deep in its guts, right next to a label: DANGER - HIGH VOLTAGE." : ""));
    case "cord": return say(S.copier.plugged ? "The copier's power cord runs to an outlet on the wall." : "The copier's power cord lies on the floor, unplugged.");
    case "mug": case "rack": return say("A dish rack with a few clean mugs." + (S.got.mug ? "" : " A red one says WORLD'S OKAYEST TEACHER."));
    case "sink": return say("A stainless steel sink. A small brass plaque above it reads IN MEMORY OF HAROLD FEENEY. HE UNPLUGGED NOTHING.");
    case "water": return say("The sink has running water. Mostly.");
    case "donut": return say(S.donut ? "One last Boston cream donut in a pink box. Mrs. Pruitt is watching it. And you." : "The donut box is empty. Only crumbs and memories.");
    case "table": return say("A wobbly table with a stack of essays, a pink donut box, and Mrs. Pruitt.");
    case "essays": return say("Seventy ungraded essays titled \"What I Did This Summer.\" Mrs. Pruitt is on number three.");
    case "couch": return say("A brown plaid couch. Its cushions have a permanent dent shaped like a tired English teacher.");
    case "chair": return say("Plastic chairs. Mrs. Pruitt is in one of them.");
    case "poster": return say("A kitten dangling from a branch: HANG IN THERE. Someone has added in red pen: ...UNTIL JUNE.");
    case "pruitt": return say("Mrs. Pruitt, English, 31 years in. Gray bun, reading glasses, magenta cardigan." + (S.pruittHappy ? " She's sipping her coffee and looks almost content." : " She's glaring at a stack of essays like they owe her money."));
    case "window": return say("There are no windows in the teachers' lounge. There never are.");
  }
  say("You see nothing special.");
}

function act(v, N, num) {
  const L = S.room === "lounge";
  const n0 = N[0], hasN = (...a) => a.some((x) => N.includes(x));
  switch (v) {
    case "look": return doLook(N);
    case "inventory": return showInv();
    case "score": return say("Your score is " + S.score + " of " + MAX + ".");
    case "help": return say("Walk with the arrow keys (press the same arrow again to stop). Then type what you want to do, like:\n\nLOOK  LOOK AT DOOR  TAKE MEMO\nREAD MEMO  TALK TO MAN\nASK ABOUT CODE  GIVE COFFEE\n\nYou must be close to things to use them. F3 repeats your last command.");
    case "save": return saveGame();
    case "restore": return restoreGame();
    case "restart": return confirmRestart();
    case "quit": return say("Thank you for playing Teachers' Lounge Quest.\n\nENTER to start over, ESC to keep playing.", { enter: restart });
    case "sound": S.sound = !(N.includes("off") || S.sound); return say("Sound is " + (S.sound ? "on." : "off."));
    case "wait": return say("Time passes. The clock reads " + clockStr() + ".");
    case "swear": return say("Watch your language. There could be students in earshot.");
    case "kill": return say("That kind of thing gets you a meeting with HR and a brand-new career.");
    case "arrest": return say("You're a teacher now, Sonny. You can give detention, and that's it.");
    case "kiss": return say(L && hasN("pruitt") ? "Mrs. Pruitt raises one eyebrow so high it nearly leaves her face. You reconsider." : "Let's keep this professional.");
    case "dance": return say("You do a little shuffle. Nobody saw it. Good.");
    case "yell": return say("Your voice echoes. Somewhere, a custodian sighs.");
    case "thank": return say("You're welcome.");
    case "listen": return say(L ? "The fridge hums. The coffee maker ticks. Mrs. Pruitt's pen scratches." : "Distant lockers slam. Somewhere a kid is already yelling about a lost retainer.");
    case "knock": return say("You knock. Nobody answers. The door isn't locked anyway; just walk through it.");
    case "go": case "enter":
      if (v === "enter" && (hasN("code") || num)) return act("type", N, num);
      return say("Use the arrow keys to walk. Doors work if you walk right up into them.");
    case "hello": case "talk": return talk(n0);
    case "ask": return ask(N);
    case "stand": return say("You are standing.");
    case "sit": return say(L ? "You'd love to. But there's no time. Planning periods are a myth anyway." : "There's nowhere to sit out here.");
    case "read":
      if (hasN("memo")) { if (has("memo")) { award("readmemo"); return say(MEMO); } break; }
      if (N.length && !hasN("sheet")) return doLook(N);
      break;
    case "smell": return say(hasN("milk") ? "It smells... fine? Probably fine for coffee. Probably not for drinking straight." : hasN("microwave") ? "Fish. 2009. Unmistakable." : L ? "Burnt coffee, old fish, and despair." : "Floor wax and pencil shavings.");
    case "drop": return say("You'd better hang on to it.");
  }
  if (!L) return hallAct(v, N, num);
  return loungeAct(v, N, num);
}

function talk(n) {
  const L = S.room === "lounge";
  if (!n) n = L ? "pruitt" : "principal";
  if (n === "principal" && !L) {
    if (!near("principal")) return;
    if (!S.signed) return say("\"Morning, Bonds,\" says Dr. Hargrove. \"Sign in before you go anywhere. Procedure is procedure.\" He taps the podium meaningfully.");
    if (!has("copies")) return say("\"Good. Now, those quiz copies. And Bonds? Do NOT touch that copier while it's plugged in. We lost Feeney that way.\"");
    return say("\"Copies? Excellent. Class starts at eight, Bonds. Not eight-oh-one.\"");
  }
  if (n === "pruitt" && L) {
    if (!near("pruitt")) return;
    if (!S.pruittHappy) return say("Mrs. Pruitt does not look up from her essays. \"Don't talk to me before I've had my coffee, Bonds. Somebody left that pot on since last Tuesday.\"");
    return say("\"This coffee is a miracle, Bonds. Remember the copier code: " + S.code + ". And unplug that thing before you go poking around in it.\"");
  }
  say("Nobody here by that name.");
}
function ask(N) {
  const L = S.room === "lounge";
  const who = L ? "pruitt" : "principal";
  if (!near(who)) return;
  const t = N.find((n) => n !== "pruitt" && n !== "principal");
  if (L) {
    switch (t) {
      case "code": case "copier":
        if (S.pruittHappy) return say("\"The code is " + S.code + ". Weren't you listening?\"");
        return say("\"The copier code? Of course I know it. And you'll know it too, right after I get a cup of coffee. A FRESH one.\"");
      case "jam": return say("\"That copier jams if you look at it funny. Whatever you do, unplug it before you reach in there. Feeney didn't.\"");
      case "donut": return say(S.pruittHappy ? "\"Go ahead, have it. You've earned it.\"" : "\"That is MY donut. I've been looking at it since 7:15.\"");
      case "lunch": case "kowalski": return say("\"Kowalski? Shop teacher. Six-foot-five. Very particular about his lunch. Last year someone ate his pudding and we never saw them again.\"");
      case "feeney": return say("\"Harold Feeney. Thirty years of chemistry. Then that copier.\" She dabs her eye with a red pen.");
      case "coffee": case "pot": case "maker": return say("\"Filters and grounds are in the cabinet over the counter. Water's in the sink. It's not rocket science, Bonds.\"");
      case "milk": return say("\"I take my coffee with milk. And please, DON'T drink that milk straight.\"");
      case "principal": return say("\"Hargrove? He put a memo about that copier in every mailbox. Did you even read yours?\"");
      case "paper": case "supply": return say("\"The paper's in the supply cabinet. Hargrove keeps it locked. He gave everyone a key in their mailbox, which rather defeats the purpose.\"");
      case "essays": return say("\"Seventy essays about summer vacation. Number three went to the beach. So did numbers one and two.\"");
      case "me": return say("\"You? You're the ex-cop who teaches civics. You alphabetize your staples.\"");
    }
    return say("\"I'm sure I don't know, Bonds.\"");
  }
  switch (t) {
    case "code": case "copier": return say("\"The copier code? Ask Pruitt. I've changed it eleven times. She always finds out.\"");
    case "sheet": return say("\"Every teacher signs in. Every morning. Procedure is procedure, Bonds.\"");
    case "pruitt": return say("\"Mrs. Pruitt. Our longest-serving teacher. Do not get between her and a donut.\"");
    case "paper": case "supply": case "key": return say("\"Your supply key is in your mailbox, with my memo. Read the memo, Bonds.\"");
    case "lunch": case "kowalski": return say("\"Kowalski is the best shop teacher in the district. Don't touch his lunch.\"");
    case "feeney": return say("Dr. Hargrove removes his glasses. \"We don't talk about the copier incident.\"");
    case "jam": return say("\"Unplug it first. I wrote a memo.\"");
  }
  return say("\"I'm a busy man, Bonds.\"");
}

function hallAct(v, N, num) {
  const hasN = (...a) => a.some((x) => N.includes(x));
  if ((v === "take" || v === "open" || v === "look") && hasN("mailbox", "memo", "key", "all")) {
    if (!near("mailbox")) return;
    if (v === "open") return say(S.got.memo && S.got.key ? "Your cubby is empty." : "Your cubby has no door. Inside: " + (S.got.memo ? "" : "a memo") + (!S.got.memo && !S.got.key ? " and " : "") + (S.got.key ? "" : "a small brass key") + ".");
    const wantMemo = hasN("memo", "mailbox", "all"), wantKey = hasN("key", "mailbox", "all");
    let got = [];
    if (wantMemo && !S.got.memo) { give("memo"); award("memo"); got.push("the memo"); }
    if (wantKey && !S.got.key) { give("key"); award("key"); got.push("the brass key"); }
    if (!got.length) return say("There's nothing more in your mailbox.");
    return say("You take " + got.join(" and ") + " from your cubby.");
  }
  if (v === "read" && hasN("memo")) {
    if (!has("memo")) return say(near("mailbox") ? "You should take it first." : "You don't have it.");
    award("readmemo"); return say(MEMO);
  }
  if (v === "read" && hasN("board")) return doLook(["board"]);
  if (v === "read" && hasN("sheet")) return near("sheet") && doLook(["sheet"]);
  if (v === "sign") {
    if (!near("sheet")) return;
    if (S.signed) return say("You already signed in. Once is procedure. Twice is paperwork.");
    S.signed = true; award("signin");
    return say("You sign in: S. BONDS, " + clockStr() + " AM. Dr. Hargrove watches you do it and gives a single approving nod. Procedure!");
  }
  if ((v === "drink" || v === "use") && hasN("fountain", "water")) {
    if (!near("fountain")) return;
    award("water"); return say("You bend way down and slurp. Warm, faintly metallic. Exactly as it has tasted since 1962.");
  }
  if (v === "open" && hasN("locker")) return near("locker") && say("You are not about to open a student locker before 8 AM. Nobody is ready for what's in there.");
  if (v === "open" && hasN("door")) return say("Just walk through it.");
  if (v === "give") return say(hasN("principal") ? "\"I don't accept gifts, Bonds. It's in the handbook.\"" : "Nobody here wants that.");
  if (v === "take" && hasN("sheet")) return say("Taking the sign-in sheet would be a serious breach of procedure.");
  if (v === "take" && hasN("board")) return say("It's screwed to the wall.");
  if (HERE.lounge.includes(N[0]) && !HERE.hall.includes(N[0])) return say("You don't see that here.");
  cant();
}

function loungeAct(v, N, num) {
  const hasN = (...a) => a.some((x) => N.includes(x));
  const c = S.copier;
  // ----- fridge / milk / lunch -----
  if (v === "open" && hasN("fridge")) { if (!near("fridge")) return; S.fridgeOpen = true; return doLook(["fridge"]); }
  if (v === "close" && hasN("fridge")) { if (!near("fridge")) return; S.fridgeOpen = false; return say("You close the fridge. The Tupperware seems relieved."); }
  if ((v === "take" || v === "eat" || v === "open") && hasN("lunch")) {
    if (!near("fridge")) return;
    if (!S.fridgeOpen) return say("Maybe open the fridge first.");
    if (v === "take") return say("You pick up the sub. A chill runs down your spine. You put it back. That was close.");
    return die("You unwrap the meatball sub labeled KOWALSKI - DO NOT TOUCH. You take one glorious bite.\n\nThe lounge door creaks open. Mr. Kowalski, shop teacher, six-foot-five, fills the doorway. He is holding a belt sander.\n\nThey find you on Thursday. Laminated.");
  }
  if (v === "open" && hasN("tupperware")) return say("No. Absolutely not. Some things are better left sealed.");
  if (v === "take" && hasN("milk")) {
    if (S.got.milkTaken) return say("You already have it.");
    if (!near("fridge")) return;
    if (!S.fridgeOpen) return say("Maybe open the fridge first.");
    give("milk"); S.got.milkTaken = 1; return say("You take the carton of milk. It sloshes in a worrying way.");
  }
  if (v === "drink" && hasN("milk")) {
    if (!has("milk")) return say("You don't have any milk.");
    return die("You chug the milk straight from the carton. It's chunky. It's warm. It expired before most of your students were born.\n\nYou spend your final moments regretting every decision that led you here.");
  }
  // ----- microwave -----
  if (hasN("microwave") && ["open", "use", "take"].includes(v)) return near("microwave") && say("You open the microwave. 2009's fish leaps out at your nose. You slam it shut, eyes watering.");
  // ----- cabinet / filter / grounds -----
  if (v === "open" && hasN("cabinet")) { if (!near("cabinet")) return; S.cabinetOpen = true; return doLook(["cabinet"]); }
  if (v === "close" && hasN("cabinet")) { if (!near("cabinet")) return; S.cabinetOpen = false; return say("You close the cabinet."); }
  if (v === "take" && hasN("filter", "grounds", "all") && !hasN("supply")) {
    if (!near("cabinet")) return;
    if (!S.cabinetOpen) return say("Try opening the cabinet first.");
    const got = [];
    if (hasN("filter", "all") && !S.got.filter) { give("filter"); award("filter"); got.push("a coffee filter"); }
    if (hasN("grounds", "all") && !S.got.grounds) { give("grounds"); award("grounds"); got.push("the can of grounds"); }
    return say(got.length ? "You take " + got.join(" and ") + "." : "You already took that.");
  }
  // ----- mugs -----
  if (v === "take" && hasN("mug")) {
    if (has("mug") || S.got.mug) return say("One mug is plenty.");
    if (!near("rack")) return;
    give("mug"); S.mug = "empty"; award("mug"); return say("You take the red mug that says WORLD'S OKAYEST TEACHER.");
  }
  // ----- pot -----
  if (v === "drink" && hasN("water")) return near("sink") && say("You drink from the tap. It tastes like the pipes are older than the school.");
  if ((v === "fill" && hasN("pot", "water", "maker", "coffee") && !hasN("mug")) || (v === "use" && hasN("sink")) || (v === "empty" && hasN("pot", "sludge"))) {
    if (!near0("sink") && !near0("maker")) return say("You are not close enough.");
    if (S.pot === "brewing" || S.pot === "coffee") return say("The pot is full of coffee. Leave it alone.");
    if (v === "empty") { if (S.pot === "sludge") { S.pot = "empty"; return say("You tip the pot into the sink. Last Tuesday's coffee slides out in one piece, like cranberry sauce."); } return say("It's already empty."); }
    const was = S.pot; S.pot = "water"; award("fillpot");
    return say(was === "sludge" ? "You take the pot to the sink, dump out the ancient tar (it lands with a thud) and fill it with fresh water." : "You fill the pot with water from the sink.");
  }
  if (v === "take" && hasN("pot")) return say("It lives on the burner. You can FILL it at the sink or POUR from it.");
  // ----- brewing -----
  if ((v === "make" && hasN("coffee", "maker", "pot")) || (v === "use" && hasN("maker")) || (v === "load" && hasN("filter", "grounds")) ) {
    if (!near("maker")) return;
    if (S.pot === "brewing") return say("It's already brewing. Patience.");
    if (S.pot === "coffee") return say("There's already a fresh pot.");
    if (!has("filter")) return say("You need a coffee filter. Try the cabinets.");
    if (!has("grounds")) return say("You need coffee grounds. Try the cabinets.");
    if (S.pot === "sludge") return say("The pot is full of last Tuesday's sludge. Clean it out and fill it with water first.");
    if (S.pot === "empty") return say("The pot is empty. Fill it with water first.");
    lose("filter"); lose("grounds"); S.pot = "brewing"; S.brewEnd = S.t + 24; award("brew");
    return say("You put a filter in the basket, add a generous heap of grounds, pour in the water and flip the switch. The machine gurgles and hisses like an old radiator.");
  }
  if (v === "load" && hasN("milk") || (v === "pour" && hasN("milk"))) {
    if (!has("milk")) return say("You don't have any milk.");
    if (!has("mug") || S.mug === "empty") return say("Pour the coffee first.");
    if (S.mug === "milk") return say("It already has milk in it.");
    S.mug = "milk"; award("milk"); return say("You add a splash of milk. It turns a perfect caramel color. Mrs. Pruitt glances over, interested.");
  }
  if (v === "pour" || (v === "fill" && hasN("mug")) || (v === "take" && hasN("coffee"))) {
    if (!near("maker")) return;
    if (!has("mug")) return say("You need a mug first.");
    if (S.pot === "sludge") return say("You wouldn't serve that to your worst enemy. Maybe to the vice principal.");
    if (S.pot === "brewing") return say("Patience. It's still brewing.");
    if (S.pot !== "coffee") return say("There's no coffee in the pot.");
    if (S.mug !== "empty") return say("Your mug is already full.");
    S.mug = "coffee"; award("pour"); return say("You pour a steaming mug of fresh coffee. The whole lounge smells better.");
  }
  if (v === "drink" && hasN("coffee", "pot", "mug")) {
    if (has("mug") && (S.mug === "coffee" || S.mug === "milk")) { S.mug = "empty"; return say("Ahh. You drink the whole mug. You feel ready to face the eighth grade.\n\nMrs. Pruitt watches you with naked hatred."); }
    if (!near("maker")) return;
    if (S.pot === "sludge") return die("Against all reason, you drink straight from the pot. Coffee that has been simmering since last Tuesday has the consistency of roofing tar.\n\nYour heart achieves speeds previously seen only in hummingbirds.");

  }
  // ----- Pruitt / donut -----
  if (v === "give") {
    if (!near("pruitt")) return;
    if (hasN("coffee", "mug")) {

      return say("Mrs. Pruitt takes a long sip. Her whole face changes. " + "\"" + (milky ? "With milk, just how I like it. " : "") + "Bonds, you beautiful man. The copier code is " + S.code + ". And go on, take the donut. You've earned it.\"");
    }
    if (hasN("quiz", "copies")) return say("\"I have seventy essays to grade. Do NOT give me more paper.\"");
    if (hasN("milk")) return say("\"Milk? On its own? What am I, a kitten?\"");
    return say("Mrs. Pruitt shakes her head without looking up.");
  }
  if ((v === "take" || v === "eat") && hasN("donut")) {
    if (!S.donut) return say("It's gone. You ate it. It was wonderful.");
    if (!near("donut")) return;
    if (S.pruittHappy) { S.donut = false; award("donut"); return say("You eat the donut in four bites. A Boston cream. For a moment, life is good."); }
    if (!S.donutWarned) { S.donutWarned = true; return say("Mrs. Pruitt's eyes narrow over her reading glasses. \"Touch that donut, Bonds, and they'll be grading YOUR remains.\""); }

    if (!has("key")) return say(v === "open" ? "It's locked. Dr. Hargrove keeps the good paper under lock and key." : "You don't have a key that fits.");
    S.supplyUnlocked = true; award("unlock");
    return say("The brass key turns with a satisfying click. The supply cabinet swings open, revealing staplers, toner, and on the top shelf, a fresh ream of copy paper.");

  if (v === "take" && hasN("paper")) {
    if (S.got.paper) return say("You already took it.");
    if (!near("supply")) return;
    if (!S.supplyUnlocked) return say("The paper is locked in the supply cabinet.");
    give("paper"); award("paper"); return say("You take the ream of copy paper. It's heavier than it looks.");
  }
  // ----- copier -----

    if (c.plugged) return say("It's already plugged in.");
    c.plugged = true; if (!c.jam) award("plugin");
    return say("You plug the copier back in. It whirs, clunks, and warms up. The display reads: " + copierDisplay() + ".");
  }
  if (v === "fix" || (v === "open" && hasN("copier")) || (v === "take" && hasN("jam"))) {
    if (hasN("plug", "cord")) return act("unplug", N, num);
    if (!hasN("copier", "jam", "paper") && v !== "fix") return cant();
    if (!near("copier")) return;
    if (!c.jam) return say(v === "open" ? "You open the front panel. Nothing in there but toner dust and bad memories. You close it." : "There's no jam. For once.");
    if (c.plugged) return die("You open the front panel and reach deep into the copier for the jammed sheet. Your fingertips brush the fuser assembly. The copier is still plugged in.\n\nThe lights in the lounge dim. Mrs. Pruitt doesn't even look up.\n\nA second brass plaque goes up next to Mr. Feeney's.");
    c.jam = false; award("jam");
    return say("With the power safely off, you reach in and carefully tease out the crumpled sheet. It's page 214 of someone's novel. You decide not to read it.");
  }
  if (v === "load" && hasN("paper", "copier")) {
    if (!has("paper")) return say(c.paper ? "The copier already has paper." : "You don't have any paper.");
    if (!near("copier")) return;
    lose("paper"); c.paper = true; award("loadpaper"); return say("You slide the ream into Tray 1. The tray closes with a confident clunk.");
  }
  if (v === "type" || (v === "use" && hasN("code"))) {
    if (!near("copier")) return;
    if (!c.plugged) return say("The copier is dead. It might help to plug it in.");
    if (c.jam) return say("The display only says PAPER JAM - AREA 4C. It ignores your buttons.");
    let code = num;
    if (!code) { if (!S.knowsCode) return say("You don't know the code. Someone in this lounge does."); code = S.code; }
    if (code !== S.code) { play(SFX.bad); return say("You punch in " + code + ". The copier beeps contemptuously: INVALID CODE."); }
    if (c.code) return say("You've already entered the code.");
    c.code = true; award("code"); play(SFX.beep);
    return say("You punch in " + code + ". The display flashes: ACCESS GRANTED." + (c.paper ? " READY." : " Then: ADD PAPER - TRAY 1."));
  }
  if (v === "copyv" || (v === "use" && hasN("copier")) || (v === "load" && hasN("quiz")) || (v === "make" && hasN("copies"))) {
    if (!near("copier")) return;
    if (has("copies")) return say("You already have 32 copies. Any more and it's a forest fire.");
    if (!c.plugged) return say("Nothing happens. It's unplugged.");
    if (c.jam) return say("The copier groans: PAPER JAM - AREA 4C.");
    if (!c.paper) return say("The copier groans: ADD PAPER - TRAY 1.");
    if (!c.code) return say("The display reads: ENTER ACCESS CODE.");
    give("copies"); award("copy"); play(SFX.points);
    return say("You lay the quiz on the glass, set the count to 32 and press COPY. The machine wheezes, clunks, considers jamming, thinks better of it, and finally spits out 32 warm copies.\n\nNow get to class!");
  }
  if (v === "use" && hasN("couch")) return act("sit", N, num);
  if (v === "open" && hasN("door")) return say("Just walk through it.");
  if (v === "use" && hasN("pen")) return say("You uncap the red pen. The smell of judgment fills the lounge.");
  if (v === "take" && hasN("essays")) return say("Mrs. Pruitt slaps your hand away without looking up.");
  if (v === "take" && hasN("copier", "couch", "table", "fridge")) return say("You'd need a forklift and a different job.");
  if (HERE.hall.includes(N[0]) && !HERE.lounge.includes(N[0])) return say("You don't see that here.");
  cant();
}
function near0(spot) { const sp = ROOMS[S.room].spots[spot]; return sp && distTo(sp) <= sp[4]; }

// ---------- death, win, save ----------
function die(msg) {
  S.dead = true; S.dir = null; S.target = null; play(SFX.death);
  say(msg, { enter: () => say("Thank you for playing Teachers' Lounge Quest. Next time, follow procedure.\n\nENTER to restart.\nESC to restore your saved game.", { enter: restart, esc: () => { if (!restoreGame(true)) restart(); } }) });
}
function win() {
  award("deliver"); S.won = true; S.dir = null; play(SFX.win);
  say("You stride into Room 112 at " + clockStr() + " with 32 warm copies of the Period 1 quiz.\n\nRight on cue, the bell rings. Thirty-two eighth-graders groan in perfect unison.\n\nIt's going to be a beautiful day.", {
    enter: () => say("CONGRATULATIONS!\n\nYour final score is " + S.score + " of " + MAX + "." + (S.score < MAX ? "\n\nThere are still points to find. Look around. Follow procedure. Be nice to Mrs. Pruitt." : "\n\nA perfect score. Officer Friendly would be proud.") + "\n\nENTER to play again.", { enter: restart, esc: restart }),
  });
}
function saveGame() {
  try { localStorage.setItem("tlq-save", JSON.stringify(S)); say("Game saved.\n\n(" + clockStr() + " AM, score " + S.score + ")"); }
  catch (e) { say("Sorry, this browser won't let the game save."); }
}
function restoreGame(quiet) {
  let d = null;
  try { d = JSON.parse(localStorage.getItem("tlq-save") || "null"); } catch (e) { d = null; }
  if (!d) { if (!quiet) say("There's no saved game to restore."); return false; }
  Q.length = 0; S = d; S.mode = "play"; S.dir = null; S.target = null; buildBg();
  say("Game restored.");
  return true;
}
function restart() { Q.length = 0; const snd = S.sound; S = newState(); S.sound = snd; S.mode = "play"; buildBg(); intro(); }
function confirmRestart() { say("Press ENTER to restart the game.\n\nPress ESC to continue this game.", { enter: restart }); }
function intro() {
  say("Lytton Middle School.\nMonday, 7:40 AM.\n\nYou are Sonny Bonds. Twelve years on the Lytton police force taught you one thing: procedure is everything.\n\nNow you teach eighth-grade civics.");
  say("Your Period 1 quiz needs 32 copies before the 8:00 bell. The copier is in the teachers' lounge.\n\nHow hard could it be?");
  say("Walk with the arrow keys. Type commands like LOOK, TAKE MEMO or TALK TO MAN, then press ENTER.\n\nESC opens the menu.\nTAB shows your inventory.");
}

// ---------- inventory & menu ----------
let overlay = null; // "inv" or null
function showInv() { overlay = "inv"; }
function drawInv() {
  scr.fill(15);
  const t = "You are carrying:"; text(t, (SW - t.length * 8) / 2, 8, 0);
  const items = S.inv.map(invName);
  if (!items.length) text("nothing", 128, 32, 0);
  items.forEach((it, i) => text(it.slice(0, 36), 16, 28 + i * 12, 0));
  const b = "Press a key to return to the game"; text(b, (SW - b.length * 8) / 2, 184, 0);
}
const MENUS = [
  { t: "Info", items: [["About", () => say("TEACHERS' LOUNGE QUEST\nIn Pursuit of the Planning Period\n\nA fan homage to the 1987 Sierra AGI adventures.\n\nNo copiers were harmed. Several teachers were.")], ["Help", () => act("help", [])]] },
  { t: "File", items: [["Save Game     <F5>", saveGame], ["Restore Game  <F7>", () => restoreGame()], ["Restart Game  <F9>", confirmRestart], ["Quit", () => act("quit", [])]] },
  { t: "Action", items: [["Look Around", () => doLook([])], ["Inventory    <Tab>", showInv], ["Check Score", () => act("score", [])], ["Check Time", () => say("Your watch reads " + clockStr() + ". The bell rings at 8:00.")]] },
  { t: "Special", items: [["Sound On/Off  <F2>", () => { S.sound = !S.sound; }]] },
];
let menu = null;
function drawMenu() {
  srect(0, 0, SW, 8, 15);
  let x = 8; const xs = [];
  MENUS.forEach((m, i) => { xs.push(x); text(m.t, x, 0, i === menu.m ? 15 : 0, i === menu.m ? 0 : 15); x += (m.t.length + 1) * 8; });
  const m = MENUS[menu.m]; const w = Math.max(...m.items.map((it) => it[0].length)) * 8 + 16;
  const mx = Math.min(xs[menu.m], SW - w - 2), my = 8;
  srect(mx, my, w, m.items.length * 8 + 8, 15);
  srect(mx, my, w, 1, 0); srect(mx, my + m.items.length * 8 + 7, w, 1, 0); srect(mx, my, 1, m.items.length * 8 + 8, 0); srect(mx + w - 1, my, 1, m.items.length * 8 + 8, 0);
  m.items.forEach((it, i) => { const sel = i === menu.i; srect(mx + 4, my + 4 + i * 8, w - 8, 8, sel ? 0 : 15); text(it[0], mx + 8, my + 4 + i * 8, sel ? 15 : 0); });
}

// ---------- title screen ----------
function drawTitle() {
  scr.fill(1);
  srect(6, 6, SW - 12, SH - 12, 0);
  srect(8, 8, SW - 16, 1, 9); srect(8, SH - 9, SW - 16, 1, 9); srect(8, 8, 2, SH - 16, 9); srect(SW - 10, 8, 2, SH - 16, 9);
  const c1 = "TEACHERS' LOUNGE", c2 = "QUEST";
  text(c1, (SW - c1.length * 16) / 2 + 2, 26, 4, -1, 2, 2); text(c1, (SW - c1.length * 16) / 2, 24, 14, -1, 2, 2);
  text(c2, (SW - c2.length * 32) / 2 + 3, 44, 4, -1, 4, 3); text(c2, (SW - c2.length * 32) / 2, 42, 14, -1, 4, 3);
  const st = "In Pursuit of the Planning Period"; text(st, (SW - st.length * 8) / 2, 74, 11);
  // mug illustration (screen space, double-wide pixels)
  const M = (x, y, w, h, c) => srect(140 + x * 2, 96 + y, w * 2, h, c);
  M(4, 10, 14, 24, 12); M(5, 11, 12, 1, 4); M(18, 15, 4, 2, 12); M(20, 17, 2, 10, 12); M(18, 27, 4, 2, 12); M(4, 34, 14, 2, 4);
  M(6, 18, 10, 2, 15); M(6, 22, 8, 1, 15);
  const ph = (tick >> 2) % 3;
  for (let i = 0; i < 3; i++) { M(7 + i * 3 + (ph === i ? 1 : 0), 2 + i, 1, 4, 7); M(8 + i * 3 - (ph === i ? 1 : 0), 6 + i, 1, 3, 7); }
  srect(124, 132, 72, 2, 6);
  const p = "Press ENTER to begin"; if ((tick >> 3) % 2) text(p, (SW - p.length * 8) / 2, 150, 15);
  const a = "A Lytton Unified production"; text(a, (SW - a.length * 8) / 2, 172, 7);
}

// ---------- main loop ----------
let tick = 0, cursorOn = true;
const kbd = document.getElementById("kbd");
function line22() { return (kbd.value || "").slice(-38); }

function update() {
  tick++;
  if (S.mode !== "play" || Q.length || overlay || menu || S.dead || S.won) return;
  S.t += 0.1;
  // brewing
  if (S.pot === "brewing" && S.t >= S.brewEnd) { S.pot = "coffee"; play(SFX.beep); say("The coffee maker gives a final, triumphant gurgle. The coffee is ready."); }
  // PA announcements and the bell
  const pa = (k, at, msg) => { if (S.t >= at && !S.warned[k]) { S.warned[k] = 1; play(SFX.pa); say(msg); } };
  pa("10", 600, "*BONG* \"Good morning, Lytton Middle! The first bell rings in ten minutes!\"");
  pa("5", 900, "*BONG* \"Five minutes to the bell, everyone. Teachers, please be in your classrooms.\"");
  pa("1", 1140, "*BONG* \"ONE minute to the bell!\" Somewhere, thirty-two eighth-graders are already in Room 112. Unsupervised.");
  if (S.t >= BELL && !Q.length) {
    play(SFX.bell);
    return die("BRRRRRRRING!\n\nThe 8:00 bell rings. Thirty-two eighth-graders sit in Room 112 with no teacher and no quiz.\n\nBy the time you arrive, they have formed a provisional government. You are not in it.");
  }
  // walking
  let dx = 0, dy = 0;
  if (S.target) {
    const tx = S.target.x - S.x, ty = S.target.y - S.y;
    if (Math.abs(tx) <= 1 && Math.abs(ty) <= 1) S.target = null;
    else { dx = Math.sign(tx) * (Math.abs(tx) > 1 ? 1 : 0); dy = Math.sign(ty) * (Math.abs(ty) > 1 ? 1 : 0); S.face = Math.abs(tx) > Math.abs(ty) * 1.2 ? (tx > 0 ? "right" : "left") : (ty > 0 ? "down" : "up"); }
  } else if (S.dir) {
    dx = S.dir.includes("left") ? -1 : S.dir.includes("right") ? 1 : 0;
    dy = S.dir.includes("up") ? -1 : S.dir.includes("down") ? 1 : 0;
  }
  if (dx || dy) {
    const R = ROOMS[S.room]; const nx = S.x + dx, ny = S.y + dy;
    if (R.exit(nx, ny)) { S.target = null; return; }
    if (R.walk(nx, ny)) { S.x = nx; S.y = ny; S.step++; if (S.step % 2 === 0) S.frame++; }
    else if (S.target && dx && dy && R.walk(nx, S.y)) { S.x = nx; S.step++; }
    else if (S.target && dx && dy && R.walk(S.x, ny)) { S.y = ny; S.step++; }
    else { S.dir = null; S.target = null; S.frame = 0; }
  } else S.frame = 0;
}

function render() {
  if (overlay === "inv") { drawInv(); return blit(); }
  if (S.mode === "title") { drawTitle(); return blit(); }
  scr.fill(0);
  // picture
  pic.set(bg);
  const R = ROOMS[S.room];
  R.dyn();
  const layers = R.layers().slice();
  layers.push({ base: S.y, draw() { if (S.dead) drawEgoDown(S.x, S.y); else drawPerson(S.x, S.y, S.face, S.frame, EGO); } });
  layers.sort((a, b) => a.base - b.base).forEach((l) => l.draw());
  for (let y = 0; y < PH; y++) { const so = (y + PIC_Y) * SW, po = y * PW; for (let x = 0; x < PW; x++) { const c = pic[po + x]; scr[so + x * 2] = c; scr[so + x * 2 + 1] = c; } }
  // status line
  srect(0, 0, SW, 8, 15);
  text(" Score:" + S.score + " of " + MAX, 0, 0, 0);
  text("Sound:" + (S.sound ? "on" : "off"), 30 * 8, 0, 0);
  // input line
  if (!S.dead && !S.won) { const ln = ">" + line22(); text(ln, 0, 176, 15); if (cursorOn && !Q.length && !menu) text("_", ln.length * 8, 176, 15); }
  if (menu) drawMenu();
  if (Q.length) drawBox(Q[0].text);
  blit();
}
function blit() { for (let i = 0; i < scr.length; i++) img32[i] = PAL32[scr[i]]; cx.putImageData(img, 0, 0); }

let acc = 0, lastT = performance.now();
function loop(now) {
  acc += Math.min(250, now - lastT); lastT = now;
  while (acc >= 50) { update(); acc -= 50; if (tick % 8 === 0) cursorOn = !cursorOn; }
  render();
  requestAnimationFrame(loop);
}

// ---------- input ----------
const DIRS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Home: "upleft", PageUp: "upright", End: "downleft", PageDown: "downright" };
function submit() {
  const raw = kbd.value.trim(); kbd.value = "";
  if (!raw) return;
  S.last = raw;
  const p = parse(raw);
  if (!p) return;
  if (p.err) return say(p.err);
  act(p.v, p.N, p.num);
}
function key(k, e) {
  if (S.mode === "title") {
    if (k === "Enter" || k === " ") { audio(); play(SFX.theme); S.mode = "play"; buildBg(); intro(); }
    return true;
  }
  if (overlay) { overlay = null; return true; }
  if (Q.length) {
    if (k === "Enter" || k === "Escape" || k === " ") {
      const m = Q.shift();
      if (k === "Escape" && m.esc) m.esc(); else if (k !== "Escape" && m.enter) m.enter();
    }
    return true;
  }
  if (menu) {
    const m = MENUS[menu.m];
    if (k === "ArrowLeft") { menu.m = (menu.m + MENUS.length - 1) % MENUS.length; menu.i = 0; }
    else if (k === "ArrowRight") { menu.m = (menu.m + 1) % MENUS.length; menu.i = 0; }
    else if (k === "ArrowUp") menu.i = (menu.i + m.items.length - 1) % m.items.length;
    else if (k === "ArrowDown") menu.i = (menu.i + 1) % m.items.length;
    else if (k === "Enter") { const fn = m.items[menu.i][1]; menu = null; fn(); }
    else if (k === "Escape") menu = null;
    return true;
  }
  if (S.dead || S.won) return true;
  if (DIRS[k]) { S.target = null; const d = DIRS[k]; if (S.dir === d) S.dir = null; else { S.dir = d; S.face = d.includes("left") ? "left" : d.includes("right") ? "right" : d; } return true; }
  if (k === "Clear") { S.dir = null; return true; }
  if (k === "Enter") { submit(); return true; }
  if (k === "Escape") { menu = { m: 0, i: 0 }; return true; }
  if (k === "Tab") { showInv(); return true; }
  if (k === "F2") { S.sound = !S.sound; return true; }
  if (k === "F3") { kbd.value = S.last || ""; return true; }
  if (k === "F5") { saveGame(); return true; }
  if (k === "F7") { restoreGame(); return true; }
  if (k === "F9") { confirmRestart(); return true; }
  return false;
}
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (key(e.key, e)) { e.preventDefault(); return; }
  // printable keys always go to the command line
  if (e.key.length === 1 && document.activeElement !== kbd) { kbd.focus(); if (kbd.value.length < 60) kbd.value += e.key; e.preventDefault(); }
}, true);
kbd.addEventListener("input", () => {
  if (Q.length || overlay || menu || S.mode !== "play" || S.dead || S.won) kbd.value = kbd.value.replace(/.$/, "");
});

cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); audio();
  const r = cv.getBoundingClientRect();
  const sx = Math.floor((e.clientX - r.left) / r.width * SW), sy = Math.floor((e.clientY - r.top) / r.height * SH);
  if (S.mode === "title" || overlay || Q.length) { key("Enter"); return; }
  if (menu) { menu = null; return; }
  if (S.dead || S.won) return;
  if (sy >= 176) { keepKbd = true; kbd.focus(); return; }
  const px = Math.floor(sx / 2), py = sy - PIC_Y;
  if (py >= 0 && py < PH) { S.dir = null; S.target = { x: px, y: Math.max(100, py) }; }
});
function padPress(b) {
  const k = b.dataset.k; audio();
  if (k === "type") { toggleKbd(); return; }
  key(k);
}
document.getElementById("pad").addEventListener("pointerdown", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  e.preventDefault(); padPress(b);
});
document.getElementById("pad").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (b && e.detail === 0) padPress(b); // keyboard activation
});

// Keep the mobile keyboard open: taps on the screen and pad buttons no longer steal focus.
let keepKbd = false;
kbd.addEventListener("focus", () => { keepKbd = true; });
kbd.addEventListener("blur", () => { if (keepKbd) setTimeout(() => { if (keepKbd && document.activeElement !== kbd) kbd.focus({ preventScroll: true }); }, 0); });
for (const el of [cv, document.getElementById("pad")]) {
  el.addEventListener("mousedown", (e) => e.preventDefault());
  el.addEventListener("touchstart", (e) => { if (document.activeElement === kbd) e.preventDefault(); }, { passive: false });
}
function toggleKbd() { if (document.activeElement === kbd) { keepKbd = false; kbd.blur(); } else { keepKbd = true; kbd.focus(); } }

buildBg();
requestAnimationFrame(loop);
</script>
</body>
